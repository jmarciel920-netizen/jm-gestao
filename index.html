function levarOrcamento(ano,s,silencioso){
  const p=projSvc(ano,s),vals=p.total.map(r2),tot=sum(vals);
  const doc=ensureOrc(ano),gs=new Set(s.grupos||[]);
  let l=doc.linhas.find(x=>x.tipo==='receita'&&(x.vinculos||[]).some(c=>gs.has(c)));
  if(!l&&!tot)return;
  doc.linhas.forEach(x=>{if(x!==l&&x.tipo==='receita')x.vinculos=(x.vinculos||[]).filter(c=>!gs.has(c))});
  if(!l){l={id:uid(),tipo:'receita',nome:s.nome,grupo:'Sazonal',vinculos:[...gs]};doc.linhas.push(l)}
  else l.vinculos=[...new Set([...(l.vinculos||[]),...gs])];
  l.modo='sazonal';l.valores=vals;l.sazonal={anual:r2(tot),curva:vals.map(v=>tot?r2(v/tot*100):0)};delete l.fixo;
  salvar('orcamento',ano);if(!silencioso){render();toast(`Orçamento de ${ano}: "${l.nome}" agora prevê ${brl(tot)}`)}
}

/* ================= FLUXO DE CAIXA ================= */
function vFluxo(){
  const ano=S.ano,saldos=cfg().saldos||{},manual=saldos[ano]!=null,sc=manual?null:saldoContasEm((ano-1)+'-12-31');
  const sAcum=(!manual&&!sc)?saldoFimDe((ano-1)+'-12-31').v:0;
  const si=manual?+saldos[ano]:(sc?sc.total:sAcum),temSaldo=manual||!!sc;
  const orcR=Z(),orcD=Z();linhas(ano,'receita').forEach(l=>l.valores.forEach((v,i)=>orcR[i]+=+v||0));linhas(ano,'despesa').forEach(l=>l.valores.forEach((v,i)=>orcD[i]+=+v||0));
  const incSvc=!!cfg().fxSvc;const svcPrev=Z();
  if(incSvc)svcList(ano).forEach(s=>{const p=projSvc(ano,s);for(let i=0;i<12;i++)svcPrev[i]+=p.prev[i]+p.novos[i]});
  const rows=[];let saldo=si,menor=Infinity,menorM=0,neg=0;
  for(let i=0;i<12;i++){
    const ym=ano+'-'+pad(i+1),atual=ano===nowY&&i===nowM;
    // pago: mês do pagamento. pendente: mês do vencimento; pendências vencidas de meses anteriores entram no mês atual
    const pagoM=t=>allMovs().filter(m=>m.tipo===t&&m.status==='Pago'&&dCaixa(m).startsWith(ym)).reduce((a,m)=>a+(+m.valor||0),0);
    const pendM=t=>allMovs().filter(m=>m.tipo===t&&m.status!=='Pago'&&(m.data.startsWith(ym)||(atual&&m.data<ym))).reduce((a,m)=>a+(+m.valor||0),0);
    const s=(t,pg)=>pg===true?pagoM(t):pg===false?pendM(t):pagoM(t)+pendM(t);
    const passado=isPastMonth(ano,i);
    let ent,sai,orig;
    if(passado){ent=s('Receita',true);sai=s('Despesa',true);orig='Realizado'}
    else{
      const agR=s('Receita'),agD=s('Despesa');
      if(S.fxFut==='orcado'&&!(ano===nowY&&i===nowM)){ent=orcR[i];sai=orcD[i];orig='Orçado'}
      else if(S.fxFut==='maior'&&!(ano===nowY&&i===nowM)){ent=Math.max(agR+svcPrev[i],orcR[i]);sai=Math.max(agD,orcD[i]);orig='Maior'}
      else{ent=agR+svcPrev[i];sai=agD;orig='Agendado'}
    }
    saldo+=ent-sai;if(saldo<menor){menor=saldo;menorM=i}if(saldo<0)neg++;
    rows.push({i,ent,sai,res:ent-sai,saldo,orig,passado});
  }
  const firstFut=rows.findIndex(r=>!r.passado);
  const cht=chart({labels:MESES,cur:ano===nowY?nowM:-1,series:[
    {name:'Entradas',color:C.rec,values:rows.map(r=>r.ent),fadeFrom:firstFut<0?null:firstFut},
    {name:'Saídas',color:C.des,values:rows.map(r=>r.sai),fadeFrom:firstFut<0?null:firstFut},
    {name:'Saldo acumulado',type:'line',color:C.pri,values:rows.map(r=>r.saldo),dashFrom:firstFut<0?12:Math.max(0,firstFut-1)}]});
  return ph('Fluxo de caixa',`Saldo realizado e projetado de ${ano}`,yearSel())+`
  <div class="bar-tools">
    <label>Saldo em 01/01/${ano} <input type="text" inputmode="decimal" data-act="fxSaldo" value="${manual?numIn(si):''}" placeholder="${sc?numIn(sc.total)+' (contas)':numIn(sAcum)+' (acumulado)'}" style="width:150px"></label>${sc&&!manual?`<span class="chip info">calculado pelas ${sc.n} conta(s) ativas</span>`:''}
    <label>Meses futuros pelo <select data-act="fxFut"><option value="agendado"${S.fxFut==='agendado'?' selected':''}>agendado</option><option value="orcado"${S.fxFut==='orcado'?' selected':''}>orçado</option><option value="maior"${S.fxFut==='maior'?' selected':''}>maior dos dois</option></select></label>
    <label><input type="checkbox" data-act="fxSvc"${incSvc?' checked':''}> Somar serviços sazonais ainda não lançados</label>
  </div>
  ${!temSaldo?`<p class="hint">Sem saldo informado, o fluxo parte de ${brl2(sAcum)}: o acumulado de tudo o que foi recebido e pago até 31/12/${ano-1}, o mesmo usado no Painel. Para bater com o banco, informe o saldo das contas em <button class="linkbtn" data-act="goContas" style="color:var(--primary)">Contas bancárias</button> ou digite o saldo de 01/01 aqui.</p>`:''}
  <section class="kpis">
    ${stat('Saldo inicial',brl(si),`em 01/01/${ano}`,'wallet','p')}
    ${stat('Saldo final projetado',brl(rows[11].saldo),`em 31/12/${ano}`,'target','a',rows[11].saldo<0?'neg':'')}
    ${stat('Menor saldo',brl(menor),`em ${MESES_L[menorM]}`,'down','w',menor<0?'neg':'')}
    ${stat('Meses negativos',String(neg),neg?'atenção ao caixa':'nenhum mês no vermelho','alert',neg?'d':'a')}
  </section>
  <div class="panel"><h3>Entradas, saídas e saldo <small>barras claras e linha tracejada são projeção</small></h3>${cht}</div>
  <h2 class="sec">Detalhamento mensal</h2>
  <div class="tscroll"><table><thead><tr><th>Mês</th><th class="l">Base</th><th>Entradas</th><th>Saídas</th><th>Resultado</th><th>Saldo acumulado</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td class="lname">${MESES_L[r.i]}</td><td class="l"><span class="chip ${r.passado?'ok':'info'}">${r.orig}</span></td><td class="vr">${brl2(r.ent)}</td><td class="vd">${brl2(r.sai)}</td><td class="${r.res<0?'neg':'pos'}">${brl2(r.res)}</td><td style="font-weight:600" class="${r.saldo<0?'neg':''}">${brl2(r.saldo)}${r.saldo<0?' '+ic('alert'):''}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="hint" style="margin-top:10px">Meses passados usam o que foi efetivamente pago e recebido, pela data do pagamento. O mês atual soma o que já foi pago, o que vence nele e o que está em atraso de meses anteriores.</p>`;
}

/* ================= DRE ================= */
const DRE_CATS={rb:'Receita bruta de serviços',rfin:'Receitas financeiras',imp:'Impostos sobre faturamento',custo:'Custos dos serviços prestados',desp:'Despesas operacionais',pl:'Pró-labore e retiradas',fin:'Despesas financeiras',dest:'Destinações (fora do resultado)'};
function defCat(tipo,g){
  const n=norm(g);
  if(tipo==='Receita')return /rendiment|juros|aplica/.test(n)?'rfin':'rb';
  if(/^impostos?$|simples|\biss\b|inss|\bdas\b|cofins|\bpis\b|irpj|csll/.test(n))return'imp';
  if(/custo certificado|guias clientes|comiss|parceria/.test(n))return'custo';
  if(/retirada|pro.?labore/.test(n))return'pl';
  if(/emprestimo|taxas banco|juros|tarifa/.test(n))return'fin';
  if(/distribuicao|investiment|reserva|imprevist|ativo imobilizado/.test(n))return'dest';
  return'desp';
}
const catDe=(tipo,g)=>(cfg().dre||{})[tipo+'|'+g]||defCat(tipo,g);
function dreCalc(ano,a,b,regime){
  const R={};Object.keys(DRE_CATS).forEach(k=>R[k]={tot:0,g:{}});
  for(const m of allMovs()){
    const caixa=regime!=='competencia';
    if(caixa&&m.status!=='Pago')continue;
    const dt=caixa?dCaixa(m):m.data;
    const y=+dt.slice(0,4),i=+dt.slice(5,7)-1;if(y!==ano||i<a||i>b)continue;
    const k=catDe(m.tipo,m.grupo),v=+m.valor||0;R[k].tot+=v;R[k].g[m.grupo]=(R[k].g[m.grupo]||0)+v;
  }
  const rl=R.rb.tot-R.imp.tot,lb=rl-R.custo.tot,ro=lb-R.desp.tot-R.pl.tot,ll=ro+R.rfin.tot-R.fin.tot;
  return{R,rb:R.rb.tot,rl,lb,ro,ll,after:ll-R.dest.tot};
}
function drePeriodo(){
  const m=S.dreM??(S.ano===nowY?nowM:11);
  if(S.dreP==='mes')return[m,m,`${MESES_L[m]} de ${S.ano}`];
  if(S.dreP==='tri'){const q=Math.floor(m/3);return[q*3,q*3+2,`${q+1}º trimestre de ${S.ano}`]}
  if(S.dreP==='acum')return[0,m,`janeiro a ${MESES_L[m]} de ${S.ano}`];
  return[0,11,`ano de ${S.ano}`];
}
function vDre(){
  const ano=S.ano,[a,b,lbl]=drePeriodo(),reg=cfg().dreRegime||'caixa';
  const cur=dreCalc(ano,a,b,reg),ini=+cfg().anoInicio||0,semAnt=ini&&ano-1<ini;
  const ant=semAnt?dreCalc(-1,a,b,reg):dreCalc(ano-1,a,b,reg);
  const temDadosAnt=allMovs().some(m=>m.data.startsWith(String(ano-1)));
  const pv=v=>cur.rb?pct(v/cur.rb):'—';
  const vr=(x,y)=>{if(semAnt||!y)return'<td class="muted">—</td>';const d=(x-y)/Math.abs(y);return `<td class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${pct(d)}</td>`};
  const vrD=(x,y)=>{if(semAnt||!y)return'<td class="muted">—</td>';const d=(x-y)/Math.abs(y);return `<td class="${d<=0?'pos':'neg'}">${d>=0?'+':''}${pct(d)}</td>`};
  const line=(lab,x,y,cls,sinal,desp)=>`<tr class="${cls}"><td>${lab}</td><td>${sinal||''}${brl2(Math.abs(x))}</td><td class="muted">${pv(x)}</td><td class="muted">${sinal||''}${brl2(Math.abs(y))}</td>${desp?vrD(x,y):vr(x,y)}</tr>`;
  const det=(k,sinal)=>Object.entries(cur.R[k].g).sort((p,q)=>q[1]-p[1]).map(([g,v])=>line(esc(g),v,ant.R[k].g[g]||0,'det',sinal,k!=='rb'&&k!=='rfin')).join('');
  const res=(lab,x,y)=>`<tr class="sub"><td>${lab}</td><td class="${x<0?'neg':''}">${brl2(x)}</td><td>${pv(x)}</td><td class="${y<0?'neg':''}">${brl2(y)}</td>${vr(x,y)}</tr>`;
  const table=`<div class="tscroll"><table class="dre" data-mkeep="0,1,2"><thead><tr><th>Demonstração do resultado</th><th>${esc(lbl)}</th><th>% receita</th><th>${semAnt?`${ano-1} (antes da empresa)`:`Mesmo período ${ano-1}`}</th><th>Variação</th></tr></thead><tbody>
    ${res('Receita bruta',cur.rb,ant.rb)}${det('rb')}
    ${line('(−) Impostos sobre faturamento',cur.R.imp.tot,ant.R.imp.tot,'','−',true)}${det('imp','−')}
    ${res('Receita líquida',cur.rl,ant.rl)}
    ${line('(−) Custos dos serviços prestados',cur.R.custo.tot,ant.R.custo.tot,'','−',true)}${det('custo','−')}
    ${res('Lucro bruto',cur.lb,ant.lb)}
    ${line('(−) Despesas operacionais',cur.R.desp.tot,ant.R.desp.tot,'','−',true)}${det('desp','−')}
    ${line('(−) Pró-labore e retiradas',cur.R.pl.tot,ant.R.pl.tot,'','−',true)}
    ${res('Resultado operacional',cur.ro,ant.ro)}
    ${line('(+) Receitas financeiras',cur.R.rfin.tot,ant.R.rfin.tot,'','')}
    ${line('(−) Despesas financeiras',cur.R.fin.tot,ant.R.fin.tot,'','−',true)}${det('fin','−')}
    <tr class="res"><td>Lucro líquido do período</td><td class="${cur.ll<0?'neg':'pos'}">${brl2(cur.ll)}</td><td>${pv(cur.ll)}</td><td class="${ant.ll<0?'neg':''}">${brl2(ant.ll)}</td>${vr(cur.ll,ant.ll)}</tr>
    <tr class="ghead"><td colspan="5">Destinações (não entram no resultado)</td></tr>
    ${det('dest','−')}
    ${res('Saldo após destinações',cur.after,ant.after)}
  </tbody></table></div>`;
  // resumo mensal
  const ms=MESES.map((_,i)=>dreCalc(ano,i,i,reg));
  const resumo=`<div class="tscroll"><table><thead><tr><th>Resumo mensal ${ano}</th>${MESES.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr></thead><tbody>
    <tr><td>Receita bruta</td>${ms.map(x=>`<td>${num(x.rb)}</td>`).join('')}<td class="tot" style="font-weight:600">${num(ms.reduce((s,x)=>s+x.rb,0))}</td></tr>
    <tr><td>Custos e despesas</td>${ms.map(x=>`<td>${num(x.rb-x.ll)}</td>`).join('')}<td style="font-weight:600">${num(ms.reduce((s,x)=>s+x.rb-x.ll,0))}</td></tr>
    <tr class="total"><td>Lucro líquido</td>${ms.map(x=>`<td class="${x.ll<0?'neg':''}">${num(x.ll)}</td>`).join('')}<td>${num(ms.reduce((s,x)=>s+x.ll,0))}</td></tr>
    <tr><td class="muted">Margem líquida</td>${ms.map(x=>`<td class="muted">${x.rb?pct(x.ll/x.rb):'—'}</td>`).join('')}<td class="muted">${(()=>{const r=ms.reduce((s,x)=>s+x.rb,0);return r?pct(ms.reduce((s,x)=>s+x.ll,0)/r):'—'})()}</td></tr>
  </tbody></table></div>`;
  const grupos=[...gruposMov('Receita').map(g=>['Receita',g]),...gruposMov('Despesa').map(g=>['Despesa',g])];
  const classif=`<details class="panel noprint" style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Classificação dos grupos na DRE</summary>
    <p class="hint">Defina onde cada grupo de lançamento entra. Distribuição de lucros e investimentos ficam fora do resultado por padrão.</p>
    <div class="tscroll"><table><thead><tr><th>Grupo</th><th class="l">Tipo</th><th class="l">Linha da DRE</th></tr></thead><tbody>
    ${grupos.map(([t,g])=>`<tr><td>${esc(g)}</td><td class="l">${t}</td><td class="l"><select data-act="dreCat" data-t="${t}" data-g="${esc(g)}">${Object.entries(DRE_CATS).filter(([k])=>t==='Receita'?['rb','rfin'].includes(k):!['rb','rfin'].includes(k)).map(([k,n])=>`<option value="${k}"${catDe(t,g)===k?' selected':''}>${n}</option>`).join('')}</select></td></tr>`).join('')}
    </tbody></table></div></details>`;
  const m=S.dreM??(ano===nowY?nowM:11);
  const banner=!cfg().anoInicioDef&&temDadosAnt&&ano===nowY?`<div class="panel noprint" style="margin-bottom:16px;border-color:color-mix(in srgb,var(--warning) 50%,var(--border))"><h3>Os dados de ${ano-1} são comparáveis?</h3><p class="hint">Se a empresa começou em ${ano} e os lançamentos de ${ano-1} são da atividade anterior, a comparação com ${ano-1} distorce as variações. Você pode mudar isso depois em Backup e configurações.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="anoIni" data-v="${ano}">${ano} é o primeiro ano da empresa</button><button class="btn" data-act="anoIni" data-v="0">${ano-1} é comparável</button></div></div>`:'';
  S._dreExport={lbl,cur,ant,semAnt,ano};
  return ph('DRE e relatórios',`Demonstração do resultado, ${esc(lbl)}`,`${yearSel()}<button class="btn" data-act="expDre">${ic('download')}Exportar Excel</button><button class="btn" data-act="print">${ic('printer')}Imprimir ou salvar PDF</button>`)+`
  <div class="bar-tools">
    <div class="subtabs" role="group">${[['mes','Mês'],['tri','Trimestre'],['acum','Acumulado'],['ano','Ano']].map(([k,n])=>`<button data-act="dreP" data-v="${k}" aria-pressed="${S.dreP===k}">${n}</button>`).join('')}</div>
    ${S.dreP!=='ano'?`<select data-act="dreM" aria-label="Mês">${MESES_L.map((x,i)=>`<option value="${i}"${i===m?' selected':''}>${x}</option>`).join('')}</select>`:''}
    <label style="flex-wrap:wrap;max-width:100%">Regime <select data-act="dreReg" style="max-width:100%"><option value="caixa"${reg==='caixa'?' selected':''}>caixa (pagos e recebidos)</option><option value="competencia"${reg==='competencia'?' selected':''}>competência (pelo vencimento, inclui pendentes)</option></select></label>
  </div>
  ${banner}<section class="kpis">
    ${stat('Receita bruta',brl(cur.rb),!semAnt&&ant.rb?`${cur.rb>=ant.rb?'+':''}${pct((cur.rb-ant.rb)/ant.rb)} sobre ${ano-1}`:'','dollar','a')}
    ${stat('Lucro líquido',brl(cur.ll),`margem ${pv(cur.ll)}`,'wallet','p',cur.ll<0?'neg':'')}
    ${stat('Impostos',brl(cur.R.imp.tot),`${pv(cur.R.imp.tot)} da receita`,'percent','w')}
    ${stat('Destinações',brl(cur.R.dest.tot),'lucros distribuídos e investimentos','target','i')}
  </section>
  ${table}
  <h2 class="sec">Resumo mensal</h2>${resumo}

/* ---- simulador: projeção mês a mês por ano (honorários do cadastro + recorrentes) com reajuste ---- */
function recorrentesPorGrupo(tipo){
  /* grupos de lançamentos que se repetem: marcados como repetição, ou mesma descrição/grupo em 3+ meses */
  const fx=cfg().fixas||{},G=new Map(),key=m=>m.rep&&m.rep.grp?'r:'+m.rep.grp:'s:'+m.tipo+'|'+norm(m.descricao||'')+'|'+(m.grupo||'');
  for(const m of allMovs()){
    if(m.tipo!==tipo)continue;
    if(tipo==='Receita'&&clienteDe(m)&&isHon(m.grupo))continue; // honorários vêm do cadastro dos clientes
    const k=key(m);if(!G.has(k))G.set(k,[]);G.get(k).push(m)}
  const out=[];
  /* séries importadas que vão até o último mês lançado no sistema continuam depois dele (não têm fim de verdade) */
  let hz='';for(const m of allMovs())if(m.tipo===tipo&&m.data>hz)hz=m.data;hz=hz.slice(0,7);
  for(const [k,ms] of G){
    const meses=new Set(ms.map(x=>x.data.slice(0,7)));
    const fixa=(k.startsWith('r:')&&ms.some(x=>x.rep.tipo==='fixa')&&!(fx[k.slice(2)]&&fx[k.slice(2)].fim))||(k.startsWith('s:')&&[...meses].sort().pop()===hz);
    if(!k.startsWith('r:')&&meses.size<3)continue;
    ms.sort((a,b)=>a.data.localeCompare(b.data));const t=ms[ms.length-1];
    const porMes={};for(const x of ms){const ym=x.data.slice(0,7);porMes[ym]=r2((porMes[ym]||0)+(+x.valor||0))}
    out.push({k,nome:String(t.descricao||'').replace(/\s*\(\d+\/\d+\)$/,''),grupo:t.grupo||'',fixa,fim:t.data.slice(0,7),ult:+t.valor||0,porMes});
  }
  return out;
}
function valorRecMes(g,ym){if(g.porMes[ym]!=null)return g.porMes[ym];return g.fixa&&ym>g.fim?g.ult:0}
function projMesAno(P,ano){
  const yms=Array.from({length:12},(_,i)=>`${ano}-${pad(i+1)}`);
  /* reajuste: aplica a partir do mês escolhido do primeiro ano; acumula a cada ano se marcado */
  const a0=Math.min(...P.anosSel),mesR=+P.rMes||0;

    if(P.acum){n=ano-a0+(i>=mesR?1:0)}else n=(ano>a0||i>=mesR)?1:0;return Math.pow(1+pct/100,n)};
  const cli=[];
  for(const c of cliComHist()){if(ehPropria(c))continue;
    const v=yms.map((ym,i)=>{if(!ativoEm(c,ym))return 0;const e=cliEm(c,ym);return r2((e.honorario||0)*(i===11&&e.treze?2:1))});
    if(v.some(x=>x))cli.push({nome:c.nome,v})}
  cli.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
  const mk=tipo=>recorrentesPorGrupo(tipo).map(g=>({nome:g.nome+(g.grupo?' · '+g.grupo:''),v:yms.map(ym=>valorRecMes(g,ym))})).filter(x=>x.v.some(y=>y)).sort((a,b)=>b.v.reduce((s,y)=>s+y,0)-a.v.reduce((s,y)=>s+y,0));
  const outR=mk('Receita'),desp=mk('Despesa');
  const soma=L=>yms.map((_,i)=>r2(L.reduce((s,x)=>s+x.v[i],0)));
  const hon=soma(cli),oR=soma(outR),rec=hon.map((v,i)=>r2(v+oR[i])),des=soma(desp);
  const recA=rec.map((v,i)=>r2(v*fator(+P.rRec||0,i))),desA=des.map((v,i)=>r2(v*fator(+P.rDesp||0,i)));
  return{ano,cli,outR,desp,hon,oR,rec,des,recA,desA,res:rec.map((v,i)=>r2(v-des[i])),resA:recA.map((v,i)=>r2(v-desA[i]))};
}

async function baixar(filename,data){

  if(!d){toast('Download indisponível nesta visualização. Abra o sistema pelo link do artifact.');return false}

  catch(e){if(e&&e.code==='declined')return false;toast('Não foi possível gerar o arquivo ('+(e&&e.code||'erro')+')');return false}
}
function xlsxBlob(sheets){
  const wb=XLSX.utils.book_new();
  for(const [nome,rows] of sheets){const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=(rows[0]||[]).map((_,j)=>({wch:Math.min(45,Math.max(10,...rows.slice(0,200).map(r=>String(r[j]??'').length+2)))}));XLSX.utils.book_append_sheet(wb,ws,nome.slice(0,31))}
  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]);
}

/* restauração: aceita o backup completo (.json), os arquivos do backup automático no Drive (um por documento) e .zip com eles */
async function lerArquivosBackup(files){
  const out=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      if(!window.JSZip){toast('Não foi possível abrir o .zip agora. Descompacte e selecione os arquivos .json.');continue}
      const z=await JSZip.loadAsync(f);
      for(const ent of Object.values(z.files)){if(ent.dir||!/\.json$/i.test(ent.name))continue;try{out.push(JSON.parse(await ent.async('string')))}catch(e){}}
    }else{try{out.push(JSON.parse(await f.text()))}catch(e){}}
  }
  return out.filter(o=>o&&o.sistema==='JM Gestão');
}
function montarBackup(objs){
  const fulls=objs.filter(o=>o.dados&&o.tipo!=='documento').sort((x,y)=>String(x.geradoEm).localeCompare(String(y.geradoEm)));
  const full=fulls[fulls.length-1];
  const dados=full?JSON.parse(JSON.stringify(full.dados)):{};const t0=full?String(full.geradoEm||''):'';
  const ult={};
  for(const d of objs.filter(o=>o.tipo==='documento'&&o.colecao&&o.id)){
    if(String(d.salvoEm||'')<=t0)continue;
    const k=d.colecao+'/'+d.id,p=ult[k];
    if(!p||String(d.salvoEm)>String(p.salvoEm)||(d.salvoEm===p.salvoEm&&(+d.versao||0)>(+p.versao||0)))ult[k]=d;
  }
  for(const d of Object.values(ult)){const c=dados[d.colecao]||(dados[d.colecao]={});if(d.excluido)delete c[d.id];else c[d.id]=d.dados}
  const quando=[t0,...Object.values(ult).map(d=>String(d.salvoEm))].sort().pop();
  if(!full&&!Object.keys(ult).length)return null;
  const nm=Object.values(dados.movimentacoes||{}).reduce((s,d)=>s+(d.itens||[]).length,0),nc=(dados.cadastros?.clientes?.itens||[]).length;
  return{b:{sistema:'JM Gestão',versao:1,geradoEm:quando,resumo:{movimentacoes:nm,clientes:nc},dados},temFull:!!full,nDocs:Object.keys(ult).length};
}
async function restaurarBackup(files){
  const objs=await lerArquivosBackup([...files]);
  const r=montarBackup(objs);
  if(!r){toast('Arquivo inválido: não é um backup do JM Gestão');return}
  const b=r.b;
  const quando=b.geradoEm?new Date(b.geradoEm).toLocaleString('pt-BR'):'data desconhecida';
  if(!r.temFull&&!confirm('Nenhum backup completo foi selecionado, só arquivos de atualização. Só as partes contidas neles serão restauradas. Continuar?'))return;
  if(!confirm(`Restaurar os dados de ${quando}?${r.nDocs?`\n(${r.temFull?'backup completo + ':''}${r.nDocs} atualização(ões) do backup automático)`:''}\n\nIsso SUBSTITUI os dados atuais (${allMovs().length} movimentações, ${clientes().length} clientes) pelos do backup (${b.resumo.movimentacoes} movimentações, ${b.resumo.clientes} clientes). Recomendo baixar um backup do estado atual antes.`))return;
  S._acao='Restauração de backup';
  for(const [col,t] of Object.entries(COLS)){
    if(!b.dados[col])continue; // coleção ausente no backup: mantém a atual
    const novo=b.dados[col];const ids=new Set([...Object.keys(S[t]),...Object.keys(novo)]);
    S[t]=JSON.parse(JSON.stringify(novo));
    ids.forEach(id=>salvar(col,id));
  }
  render();toast('Backup restaurado');
}

function foneWa(t){let d=String(t||'').replace(/\D/g,'');if(!d)return null;d=d.replace(/^0+/,'');if(d.length===10||d.length===11)d='55'+d;return d.length>=12?d:null}

    <div class="dbody">
      <div class="fgrid">
        <label>A partir de<input type="month" data-p="ini" value="${P.ini}"></label>
        <label>Quantidade de meses<select data-p="qtd">${[1,2,3,6,12].map(n=>`<option value="${n}"${n===P.qtd?' selected':''}>${n===1?'1 mês':n+' meses'}</option>`).join('')}</select></label>
        <label>Dia de vencimento para quem não tem no cadastro nem histórico<input type="number" min="1" max="31" data-p="dia" value="${P.dia}"></label>
        <label style="flex-direction:row;align-items:center;gap:8px;color:var(--fg);margin-top:22px"><input type="checkbox" data-p="treze"${P.treze?' checked':''}> 13º honorário em dezembro, para clientes com 13º (lançamento separado)</label>
      </div>
      <div class="sumline" style="margin-top:14px"><span><b>${out.length}</b> cobranças a gerar, total <b>${brl2(tot)}</b></span>${pul.length?`<span>${pul.length} já existem e serão puladas</span>`:''}${semHon.length?`<span>${semHon.length} cliente(s) ativos sem honorário no cadastro</span>`:''}</div>
      <div class="fl">Clientes <span><button class="linkbtn" data-sel="all" style="color:var(--primary)">marcar todos</button> · <button class="linkbtn" data-sel="none" style="color:var(--primary)">desmarcar todos</button></span></div>
      <div class="tscroll" style="max-height:300px;overflow:auto;margin-top:6px"><table><thead><tr><th>Cliente</th><th class="l">Grupo</th><th>Honorário</th><th>Vence dia</th></tr></thead><tbody>
      ${ativos.map(c=>`<tr><td><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" data-c="${esc(c.id)}"${P.sel.has(c.id)?' checked':''}${temHon(c)?'':' disabled'}> ${esc(c.nome)}</label></td><td class="l muted">${esc(grupoRegime(c.regime))}</td><td>${temHon(c)?honCell(c):'<span class="muted">sem valor</span>'}</td><td class="muted">${c.dia_vencimento||(diaHist(c)?`${diaHist(c)} (último lançamento)`:`${P.dia} (padrão)`)}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="hint" style="margin-top:12px">Uma cobrança não é gerada se o cliente já tem honorário lançado naquele mês.</p>

  };
  draw();
  dlg.oninput=null;
  dlg.onchange=e=>{const t=e.target;
    if(t.dataset.p==='ini'&&t.value)P.ini=t.value;else if(t.dataset.p==='qtd')P.qtd=+t.value;else if(t.dataset.p==='dia')P.dia=Math.min(31,Math.max(1,+t.value||10));else if(t.dataset.p==='treze')P.treze=t.checked;

function cliTabs(){const n=semCliente(true).length+duplicados().length+honDiverg().length;return `<div class="bar-tools"><div class="subtabs" role="group" aria-label="Visão"><button data-act="cView" data-v="lista" aria-pressed="${S.cView!=='conc'}">Carteira</button><button data-act="cView" data-v="conc" aria-pressed="${S.cView==='conc'}">Conciliação${n?` <span class="chip fora" style="margin-left:4px">${n}</span>`:''}</button></div></div>`}
function semCliente(soHon){
  const ign=new Set(cfg().naoCliente||[]),acc=new Map();
  for(const m of allMovs()){
    if(m.tipo!=='Receita'||clienteDe(m))continue;
    if(soHon&&!isHon(m.grupo))continue;
    const k=normDesc(m.descricao);if(!k||ign.has(k))continue;
    const x=acc.get(k)||{k,desc:m.descricao.replace(/\s*13\s*[°º]?$/,'').trim(),n:0,tot:0,grupos:new Set(),ult:''};
    x.n++;x.tot+=+m.valor||0;x.grupos.add(m.grupo);if(m.data>x.ult)x.ult=m.data;acc.set(k,x);
  }
  return[...acc.values()].sort((a,b)=>b.ult.localeCompare(a.ult));
}
function duplicados(){
  const cs=clientes(),out=[],nd=new Set(cfg().naoDup||[]);
  for(let i=0;i<cs.length;i++)for(let j=i+1;j<cs.length;j++){
    const a=normDesc(cs[i].nome),b=normDesc(cs[j].nome);if(!a||!b)continue;
    const par=[cs[i].id,cs[j].id].sort().join('|');if(nd.has(par))continue;
    const pa=a.split(' ')[0],pb=b.split(' ')[0];
    const motivo=a===b?'mesmo nome sem acentos':(pa.length>=4&&pa===pb&&(a===pa||b===pa))?'um nome contém o outro':null;
    if(motivo)out.push({a:cs[i],b:cs[j],motivo,par});
  }
  return out;
}
function vincularDesc(k,cid,silencioso){
  const c=cliById(cid);if(!c)return;
  const x=semCliente(false).find(s=>s.k===k);
  const alias=x?x.desc:k;
  if(normDesc(alias)!==normDesc(c.nome)){c.aliases=[...new Set([...(c.aliases||[]),alias])];salvar('cadastros','clientes')}
  const meses=new Set();
  for(const m of allMovs())if(m.tipo==='Receita'&&!m.cliente_id&&normDesc(m.descricao)===k){m.cliente_id=cid;meses.add(m.data.slice(0,7))}
  meses.forEach(ym=>salvar('movimentacoes',ym));
  if(!silencioso){render();toast(`"${alias}" agora conta para ${c.nome}`)}
}
/* conferência: honorário do cadastro x cobranças lançadas no mês */
let _hd=null,_hdv=-1;
function honDiverg(ym=curYM){
  if(_hdv===S.v&&_hd)return _hd;const out=[];
  const ign=new Set(cfg().honDivIgn||[]);
  for(const c of clientes()){
    const e=cliEm(c,ym);if(e.status==='Inativo'||c.status!=='Ativo'||!(e.honorario>0))continue;
    if(ign.has(c.id+'|'+ym))continue;
    const ms=allMovs().filter(m=>m.tipo==='Receita'&&isHon(m.grupo)&&!is13m(m)&&m.data.startsWith(ym)&&clienteDe(m)===c.id);
    const v=r2(ms.reduce((s,m)=>s+(+m.valor||0),0));
    if(!ms.length)out.push({c,cad:e.honorario,cob:0,tipo:'sem'});
    else if(Math.abs(v-e.honorario)>0.009)out.push({c,cad:e.honorario,cob:v,tipo:'dif',n:ms.length});
  }
  _hd=out.sort((x,y)=>x.c.nome.localeCompare(y.c.nome,'pt-BR'));_hdv=S.v;return _hd;
}
function blocoHonDiv(){
  const l=honDiverg();const ym=curYM;

function mesclarDialog(aid,bid){

    if(o.status==='Ativo')k.status='Ativo',delete k.data_inativacao;

    meses.forEach(ym=>salvar('movimentacoes',ym));

const TAB_SN={
  III:[[180000,.06,0],[360000,.112,9360],[720000,.135,17640],[1800000,.16,35640],[3600000,.21,125640],[4800000,.33,648000]],
  V:[[180000,.155,0],[360000,.18,4500],[720000,.195,9900],[1800000,.205,17100],[3600000,.23,62100],[4800000,.305,540000]]};
const TRIB_PADRAO={regimes:[{de:'2025-01',r:'MEI'},{de:'2026-06',r:'LP'},{de:'2027-01',r:'SN'}],iss:3,issFixo:0,pis:0.65,cofins:3,presIRPJ:32,presCSLL:32,cpp:20,folha:0,folhaDesde:'2026-07',meiDas:0,anexo:{},fut:'maior'};
const REG_NOME={MEI:'MEI',SN:'Simples Nacional',LP:'Lucro Presumido'};
const Tb=()=>({...TRIB_PADRAO,...(cfg().trib||{})});
function setTrib(p){setCfg({trib:{...(cfg().trib||{}),...p}})}
function aliqEf(anexo,rbt){const t=TAB_SN[anexo];let f=t.findIndex(x=>rbt<=x[0]);if(f<0)f=5;const [lim,nom,pd]=t[f];return{ef:rbt>0?Math.max(0,(rbt*nom-pd)/rbt):nom,faixa:f+1,nom,lim,pd}}
const ymOf=(y,i)=>{const d=new Date(y,i,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
function regimeEm(ym){let r=null;for(const x of [...Tb().regimes].sort((a,b)=>a.de.localeCompare(b.de)))if(x.de<=ym)r=x.r;return r}
const anexoDe=g=>(Tb().anexo||{})[g]||'III';
let _rm=new Map(),_rmv=-1;
/* receita bruta do mês (categoria "receita bruta" da DRE), por grupo */
function recMes(y,i){
  const ym=ymOf(y,i);if(_rmv!==S.v){_rm=new Map();_rmv=S.v}
  if(_rm.has(ym))return _rm.get(ym);
  const [yy,mm]=ym.split('-').map(Number);const mi=mm-1;
  const out={tot:0,g:{},base:''};const add=(g,v)=>{out.g[g]=(out.g[g]||0)+v;out.tot+=v};
  const rb=m=>m.tipo==='Receita'&&catDe('Receita',m.grupo)==='rb';
  if(isPastMonth(yy,mi)){out.base='realizado';for(const m of allMovs())if(rb(m)&&m.status==='Pago'&&dCaixa(m).startsWith(ym))add(m.grupo,+m.valor||0)}
  else{
    const ag={tot:0,g:{}};for(const m of allMovs())if(rb(m)&&((m.status==='Pago'&&dCaixa(m).startsWith(ym))||(m.status!=='Pago'&&m.data.startsWith(ym)))){ag.g[m.grupo]=(ag.g[m.grupo]||0)+(+m.valor||0);ag.tot+=+m.valor||0}
    const oc={tot:0,g:{}};(O(yy)?.linhas||[]).filter(l=>l.tipo==='receita').forEach(l=>{const v=+l.valores[mi]||0;if(!v)return;const g=(l.vinculos||[]).find(c=>catDe('Receita',c)==='rb');if(!g&&(l.vinculos||[]).length)return;const k=g||l.nome;oc.g[k]=(oc.g[k]||0)+v;oc.tot+=v});
    const f=Tb().fut,atual=yy===nowY&&mi===nowM;
    const src=atual?(ag.tot>=oc.tot?ag:oc):f==='agendado'?ag:f==='maior'?(ag.tot>=oc.tot?ag:oc):(oc.tot?oc:ag);
    out.base=src===ag?'agendado':'orçado';for(const [g,v] of Object.entries(src.g))add(g,v);
  }
  _rm.set(ym,out);return out;
}
function folhaMes(y,i){const t=Tb(),ym=ymOf(y,i);return +t.folha>0&&ym>=t.folhaDesde?+t.folha:0}
function soma12(fn,y,i){let s=0;for(let k=1;k<=12;k++){const d=new Date(y,i-k,1);s+=fn(d.getFullYear(),d.getMonth())}return s}
const rbt12=(y,i)=>soma12((a,b)=>recMes(a,b).tot,y,i);
const folha12=(y,i)=>soma12(folhaMes,y,i);
function snMes(y,i){
  const R=rbt12(y,i),F=folha12(y,i),fr=R?F/R:0,rm=recMes(y,i);let tax=0;const an3=aliqEf('III',R);
  for(const [g,v] of Object.entries(rm.g)){let an=anexoDe(g);if(an==='FR')an=fr>=.28?'III':'V';tax+=v*aliqEf(an,R).ef}
  return{tax:r2(tax),R,fr,ef:rm.tot?tax/rm.tot:an3.ef,faixa:an3.faixa,rec:rm.tot};
}
function lpMes(y,i,soLP){
  const t=Tb(),rm=recMes(y,i),ym=ymOf(y,i);
  const pis=rm.tot*t.pis/100,cof=rm.tot*t.cofins/100,iss=rm.tot*t.iss/100+(+t.issFixo||0),cpp=folhaMes(y,i)*t.cpp/100;
  let irpj=0,csll=0;
  if(i%3===2){let b=0;for(let k=i-2;k<=i;k++){if(soLP&&regimeEm(ymOf(y,k))!=='LP')continue;b+=recMes(y,k).tot}
    const bi=b*t.presIRPJ/100,bc=b*t.presCSLL/100;irpj=bi*.15+Math.max(0,bi-60000)*.10;csll=bc*.09}
  return{tax:r2(pis+cof+iss+cpp+irpj+csll),pis,cof,iss,cpp,irpj,csll,rec:rm.tot};
}
function vigMes(y,i){const r=regimeEm(ymOf(y,i));if(r==='SN')return{r,tax:snMes(y,i).tax};if(r==='LP')return{r,tax:lpMes(y,i,true).tax};if(r==='MEI')return{r,tax:+Tb().meiDas||0};return{r:null,tax:0}}
function pagoImp(y,i){const ym=ymOf(y,i);return allMovs().filter(m=>m.tipo==='Despesa'&&m.status==='Pago'&&dCaixa(m).startsWith(ym)&&catDe('Despesa',m.grupo)==='imp').reduce((a,m)=>a+(+m.valor||0),0)}

function contasInfo(){

  for(const m of allMovs()){const k=contaDe(m);const x=acc.get(k)||{nome:k,n:0,ult:'',pend:0};x.n++;if(m.status==='Pago'){const d=dCaixa(m);if(d>x.ult)x.ult=d}else x.pend++;acc.set(k,x)}
  for(const k of Object.keys(cfgContas()))if(!acc.has(k))acc.set(k,{nome:k,n:0,ult:'',pend:0});
  const cc=cfgContas();
  return[...acc.values()].map(x=>({...x,...(cc[x.nome]||{}),ativa:cc[x.nome]?.ativa??(x.ult>=addMonths(todayISO,-3)||x.pend>0)})).sort((a,b)=>(b.ativa-a.ativa)||b.ult.localeCompare(a.ult));

const fluxoPago=m=>m.status==='Pago'?(m.tipo==='Receita'?1:-1)*(+m.valor||0):0;
/* saldo de uma conta numa data, a partir do saldo de referência informado */
function saldoEm(nome,dataISO){
  const c=cfgContas()[nome];if(!c||c.saldo==null||!c.data)return null;
  let s=+c.saldo;
  for(const m of allMovs()){if(m.status!=='Pago'||contaDe(m)!==nome)continue;const d=dCaixa(m);
    if(dataISO>=c.data){if(d>c.data&&d<=dataISO)s+=fluxoPago(m)}else if(d>dataISO&&d<=c.data)s-=fluxoPago(m)}
  for(const t of transfs()){const f=fluxoTransf(t,nome);if(!f)continue;const d=t.data;
    if(dataISO>=c.data){if(d>c.data&&d<=dataISO)s+=f}else if(d>dataISO&&d<=c.data)s-=f}
  return r2(s);
}

  const last=new Date(y,mi+1,0).getDate();let d;
  if(t.dia==='U'){d=new Date(y,mi,last);while(!isUtil(d))d.setDate(d.getDate()-1);return isoD(d)}
  const m=/^D(\d+)$/.exec(t.dia||'');if(m){let n=0;d=new Date(y,mi,1);while(true){if(isUtil(d)&&++n===+m[1])break;d.setDate(d.getDate()+1)}return isoD(d)}
  d=new Date(y,mi,Math.min(+t.dia||last,last));
  while(!isUtil(d))d.setDate(d.getDate()+(t.ajuste==='proximo'?1:-1));
  return isoD(d);
}
const aplica=(c,t)=>(t.regimes||[]).includes(c.regime)&&((c.obrig||{})[t.id]??t.padrao);
/* ocorrências com vencimento no mês (y, mi) */
function obrigacoesDoMes(y,mi,incl){
  const out=[];
  const ativos=cliComHist();
  for(const t of obrTpl()){
    let comp=null;
    if(t.freq==='mensal'){const d=new Date(y,mi-(+t.offset||0),1);comp=d.getFullYear()+'-'+pad(d.getMonth()+1)}
    else if(t.freq==='trimestral'){const d=new Date(y,mi-(+t.offset||0),1);if(d.getMonth()%3!==2)continue;comp=`${Math.floor(d.getMonth()/3)+1}T/${d.getFullYear()}`}
    else if(t.freq==='anual'){if(mi+1!==+t.mes)continue;comp=String(t.ref==='atual'?y:y-1)}
    const venc=vencEm(y,mi,t);
    for(const c of ativos){const reg=regimeComp(c,t,t.freq==='anual'&&t.ref==='atual'?y+'-'+pad(mi+1):comp);if(reg)out.push({key:`${c.id}|${t.id}|${comp}`,c,t,comp,venc,reg})}
  }
  return out.filter(o=>incl||!excluida(+o.venc.slice(0,4),o.key)).sort((a,b)=>a.venc.localeCompare(b.venc)||a.t.nome.localeCompare(b.t.nome)||a.c.nome.localeCompare(b.c.nome,'pt-BR'));
}

/* ================= HONORÁRIOS DO ORÇAMENTO PELA CARTEIRA ================= */
function calcCarteira(P){
  const ativos=clientes().filter(c=>!ehPropria(c)&&c.status==='Ativo');
  // saídas, retornos e mudanças de honorário já agendados no cadastro
  const comH=clientes().filter(c=>c.historico&&c.historico.length),_k={};
  const conhecida=ym=>_k[ym]??(_k[ym]=comH.reduce((s,c)=>{const e=cliEm(c,ym);return s+(e.status==='Inativo'?0:e.honorario)},0));
  let base=ativos.reduce((a,c)=>a+(+c.honorario_mensal||0),0),n=ativos.length;
  const out=[];
  for(let i=0;i<12;i++){
    if(i>0||P.desdeJan===false){base=base*(1-(+P.churn||0)/100)+(+P.novos||0)*(+P.honNovo||0);n=n*(1-(+P.churn||0)/100)+(+P.novos||0)}
    const ymi=S.ano+'-'+pad(i+1);let v=base+(ymi>curYM?conhecida(ymi)-conhecida(curYM):0);if(P.reajMes>=0&&i>=P.reajMes)v*=1+(+P.reajPct||0)/100;
    const tz=ativos.reduce((a,c)=>a+(cliEm(c,curYM).treze?cliEm(c,curYM).honorario:0),0),b0=ativos.reduce((a,c)=>a+(+c.honorario_mensal||0),0)||1;if(P.treze==='dez'&&i===11)v*=1+tz/b0;if(P.treze==='diluir')v*=1+tz/b0/12;
    out.push(r2(v));
  }
  return{valores:out,base0:ativos.reduce((a,c)=>a+(+c.honorario_mensal||0),0),n0:ativos.length,nFim:n};
}

const ST_TAR={afazer:'A fazer',andamento:'Em andamento',aguardando:'Aguardando cliente ou documentos',concluida:'Concluída'};
const stTar=t=>t.feito_em?'concluida':(t.status&&ST_TAR[t.status]?t.status:'afazer');
/* conclui a tarefa numa data e, se ela se repete, cria a próxima */
function concluirTar(t,data){
  t.feito_em=data||diaFeito();delete t.status;if(typeof EU!=='undefined'&&EU.id)t.feito_por=EU.id;
  const r=t.recorrencia;if(r&&r!=='nenhuma'&&!t.proxId){let d=proxData(t.data,r);while(d<=todayISO)d=proxData(d,r);if(t.util)d=diaUtil(d);const n={...t,id:uid('t'),data:d};delete n.feito_em;delete n.feito_por;delete n.proxId;delete n.status;t.proxId=n.id;S.tar.lista.itens.push(n)}
}
function reabrirTar(t,status){delete t.feito_em;delete t.feito_por;if(t.proxId)S.tar.lista.itens=tarefas().filter(x=>!(x.id===t.proxId&&!x.feito_em));delete t.proxId;if(status&&status!=='afazer')t.status=status;else delete t.status}
function togTarefa(id){
  const t=tarefas().find(x=>x.id===id);if(!t)return;
  S._acao=`${t.feito_em?'Reabertura':'Conclusão'}: ${t.titulo}`;
  if(t.feito_em)reabrirTar(t);else concluirTar(t,diaFeito());
  saveTar();render();
}

function vObrigCli(){
  const [y,mo]=(S.oym||curYM).split('-').map(Number);
  let os=obrigacoesDoMes(y,mo-1);
  if(S.oTpl)os=os.filter(o=>o.t.id===S.oTpl);
  if(S.oBusca){const q=norm(S.oBusca);os=os.filter(o=>norm(o.c.nome).includes(q))}
  const ts=[...new Map(os.map(o=>[o.t.id,o.t])).values()];
  const byC=new Map();for(const o of os){const x=byC.get(o.c.id)||{c:o.c,reg:o.reg,m:{}};x.m[o.t.id]=o;byC.set(o.c.id,x)}
  let rows=[...byC.values()].sort((a,b)=>a.c.nome.localeCompare(b.c.nome,'pt-BR'));
  if(S.oSt)rows=rows.filter(r=>Object.values(r.m).some(o=>obgStatus(o)===S.oSt));
  const cell=o=>{if(!o)return'<td class="muted">—</td>';const st=obgStatus(o),f=feito(+o.venc.slice(0,4),o.key);
    return `<td data-l="${esc(o.t.nome)}"><button class="st ${st==='feito'?'pago':st==='atrasado'?'venc':st==='anterior'?'':'pend'}" data-act="obgTog" data-k="${esc(o.key)}" data-y="${o.venc.slice(0,4)}" title="${esc(o.t.nome)}, vence ${dBR(o.venc)}${f?', feito em '+dBR(f.em):''}">${st==='feito'?'Feito':st==='atrasado'?'Atrasado':st==='anterior'?'Antes':dBR(o.venc).slice(0,5)}</button></td>`};
  return `<div class="tscroll"><table class="cards"><thead><tr><th>Cliente</th>${ts.map(t=>`<th>${esc(t.nome)}</th>`).join('')}<th>Feitas</th></tr></thead><tbody>
  ${rows.map(r=>{const l=Object.values(r.m),f=l.filter(o=>obgStatus(o)==='feito').length;return `<tr><td><span class="lname">${esc(r.c.nome)}</span><div class="muted" style="font-size:12px">${esc(r.reg)}</div></td>${ts.map(t=>cell(r.m[t.id])).join('')}<td data-l="Feitas" class="${f===l.length?'pos':'muted'}">${f}/${l.length}</td></tr>`}).join('')}
  </tbody></table></div>`;
}

const CAMPOS_SUG={cpf_cnpj:'CPF/CNPJ',razao_social:'Razão social',nome_fantasia:'Nome fantasia',nome:'Nome / razão social',natureza:'Natureza jurídica',telefone:'Telefone',situacao_rf:'Situação na Receita',regime_rf:'Regime na Receita',socios:'Sócios'};
const fmtSugV=v=>Array.isArray(v)?v.map(x=>x.nome+(x.qualificacao?' ('+x.qualificacao+')':'')).join(', '):(typeof v==='string'&&v.startsWith('[')?(()=>{try{return fmtSugV(JSON.parse(v))}catch(e){return v}})():v);
const sugAll=()=>S.cad.sugestoes?.itens||[];
const sugPronta=s=>{if(!s.dep)return true;const d=sugAll().find(x=>x.id===s.dep);return !d||d.decisao==='aceita'};
const sugestoes=()=>sugAll().filter(s=>!s.decisao&&sugPronta(s));
const sugEspera=()=>sugAll().filter(s=>!s.decisao&&!sugPronta(s));
const fmtDoc=d=>{d=String(d||'').replace(/\D/g,'');return d.length===14?d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5'):d.length===11?d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4'):d};
function decidirSug(ids,ok){
  const set=new Set(ids);let n=0;
  for(const s of S.cad.sugestoes.itens){if(!set.has(s.id)||s.decisao)continue;
    if(ok){const c=cliById(s.cliente_id);if(!c){s.decisao='cliente não encontrado';continue}
      if(s.campo==='cpf_cnpj')c.cpf_cnpj=fmtDoc(s.novo);
      else if(s.campo==='nome'){if(s.novo&&s.novo!==c.nome){const al=new Set(c.aliases||[]);al.add(c.nome);c.aliases=[...al];c.nome=s.novo}}
      else if(s.campo==='socios'){const atual=socios(c);const novos=(s.novo||[]).map(n=>{const ex=atual.find(x=>normDesc(x.nome)===normDesc(n.nome));return ex?{...n,...ex}:n});atual.forEach(x=>{if(!novos.some(n=>normDesc(n.nome)===normDesc(x.nome)))novos.push(x)});c.socios=novos}
      else c[s.campo]=s.novo;
      n++}
    s.decisao=ok?'aceita':'recusada';s.decididaEm=todayISO;
    if(!ok&&s.campo==='cpf_cnpj')for(const d of S.cad.sugestoes.itens)if(d.dep===s.id&&!d.decisao){d.decisao='recusada';d.decididaEm=todayISO}}
  S._acao=ok?`Atualização de cadastro aceita (${n})`:'Sugestão de cadastro recusada';
  S.cad.sugestoes.itens=S.cad.sugestoes.itens.filter(s=>!s.decisao||s.decididaEm>=addDays(todayISO,-60));
  salvar('cadastros','sugestoes');if(ok)salvar('cadastros','clientes');return n;
}

    </div>

  };
  draw();dlg.oninput=dlg.onchange=null;

/* --- 1. Orçamento: carteira x orçado e linhas fora do orçamento --- */
function avisoCarteiraOrc(ano){
  const l=linhaHonorarios(ano),R=S.ref;if(!l||R<0)return'';
  const ativos=clientes().filter(c=>!ehPropria(c)&&c.status==='Ativo');const cart=ativos.reduce((s,c)=>s+(+c.honorario_mensal||0),0);
  const orc=+l.valores[R]||0;if(!cart||Math.abs(orc-cart)/cart<0.05)return'';
  return `<div class="panel" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-color:color-mix(in srgb,var(--warning) 45%,var(--border))"><span class="grow" style="min-width:220px"><b>Honorários orçados em ${MESES[R]}: ${brl2(orc)}. Carteira atual: ${brl2(cart)} (${cart>orc?'+':''}${pct((cart-orc)/(orc||1))})</b>
    <span class="muted" style="display:block;font-size:13px">O orçamento de "${esc(l.nome)}" está ${cart>orc?'abaixo':'acima'} do que a carteira de ${ativos.length} clientes ativos rende por mês. Recalcule pela carteira para o resultado projetado ficar realista.</span></span>
    <button class="btn primary" data-act="carteira">Recalcular pela carteira</button></div>`;
}
function blocoForaOrc(ano){
  if(!O(ano))return'';
  const it=t=>foraOrc(ano,t).map(l=>{const A=realCat(ano,t,l.nome,'r'),P=realCat(ano,t,l.nome,'p');return{t,cat:l.nome,real:sum(A),pend:sum(P)}}).filter(x=>x.real+x.pend>0).sort((a,b)=>b.real-a.real);
  const rs=it('receita'),ds=it('despesa');if(!rs.length&&!ds.length)return'';
  const tot=l=>l.reduce((s,x)=>s+x.real,0);
  const opts=t=>linhas(ano,t).map(l=>`<option value="${esc(l.id)}">${esc(l.nome)}</option>`).join('');
  const lista=(l,t)=>l.length?`<ul class="list">${l.map(x=>`<li style="flex-wrap:wrap"><div class="grow" style="min-width:180px"><div class="t">${esc(x.cat)}</div><div class="m">${brl2(x.real)} ${t==='receita'?'recebido':'pago'} em ${ano}${x.pend?`, ${brl2(x.pend)} pendente`:''}</div></div>
    <span style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><select data-act="foVinc" data-t="${t}" data-cat="${esc(x.cat)}" aria-label="Vincular ${esc(x.cat)} a uma linha" style="max-width:210px"><option value="">Somar em uma linha…</option>${opts(t)}</select><button class="btn small" data-act="foNova" data-t="${t}" data-cat="${esc(x.cat)}">Criar linha própria</button></span></li>`).join('')}</ul>`:'<p class="hint">Nada fora do orçamento.</p>';
  return `<details class="panel" style="margin-bottom:16px"${S.foOpen?' open':''} data-fo><summary style="cursor:pointer"><b>Fora do orçamento: ${brl2(tot(rs))} em receitas e ${brl2(tot(ds))} em despesas</b> <span class="muted" style="font-size:13px">${rs.length+ds.length} categoria(s) sem linha no orçamento</span></summary>
    <p class="hint" style="margin-top:10px">Some cada categoria em uma linha existente ou crie uma linha própria. A linha nova recebe nos meses já fechados o que foi realizado e, do mês atual em diante, a média mensal dos meses fechados.</p>
    <div class="cols eq" style="margin:0"><div><h4 style="margin:6px 0">Receitas</h4>${lista(rs,'receita')}</div><div><h4 style="margin:6px 0">Despesas</h4>${lista(ds,'despesa')}</div></div></details>`;
}
function criarLinhaFora(t,cat){
  const ano=S.ano,doc=ensureOrc(ano),R=S.ref<0?(ano<nowY?11:-1):S.ref;
  const A=realCat(ano,t,cat,'r');const fech=R>=0?R:0,media=fech?r2(sum(A,0,fech-1)/fech):r2(sum(A)/12);
  const valores=Array.from({length:12},(_,i)=>i<fech?r2(A[i]):media);
  const grupo=t==='receita'?'Eventual':(catDe('Despesa',cat)==='fin'?'Financeiro':catDe('Despesa',cat)==='dest'?'Investimentos':'Operacional');
  doc.linhas.push({id:uid('l'),tipo:t,nome:cat,grupo,modo:'manual',vinculos:[cat],valores});

/* ================= MIGRAÇÃO ÚNICA: competência = mês anterior ao vencimento =================
   Até MIG_T as obrigações mensais estavam com defasagem 0 (competência = mês do vencimento).
   As marcações feitas em 04/11/2026 nessa configuração mudam de chave para a competência certa,
   mantendo o mesmo vencimento. Roda uma vez por documento (flag migComp). */
const MIG_T='2026-11-05T01:38:35Z';
function migrarComp(){
  if(!S.obg||!Object.keys(S.obg).length)return;
  const L=obrTpl();const dm=L.find(x=>x.id==='das-mei'||x.freq==='mensal');
  if(!dm||!(+dm.offset>0))return;
  const off=id=>{const t=L.find(x=>x.id===id);if(!t)return 1;return t.freq==='mensal'?(+t.offset||0):0};
  const shift=(comp,n)=>{const [y,m]=comp.split('-').map(Number);const d=new Date(y,m-1-n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
  for(const [y,doc] of Object.entries(S.obg)){
    if(!doc||doc.migComp)continue;const now=new Date().toISOString();let n=0;
    for(const f of ['feitos','excl']){const m=doc[f];if(!m)continue;
      for(const k of Object.keys(m).sort()){const v=m[k];
        if(!v||v.em!=='2026-11-04'||(v.ts&&v.ts>=MIG_T))continue;
        const [c,t,comp]=k.split('|');if(!/^\d{4}-\d{2}$/.test(comp||''))continue;const s=off(t);if(!s)continue;
        const nk=c+'|'+t+'|'+shift(comp,s);
        m[k]={em:null,ts:now};
        if(!(m[nk]&&m[nk].em))m[nk]={...v,ts:now};
        n++}}
    doc.migComp=1;S._acao='Ajuste da competência das obrigações';salvar('obrigacoes',y);
  }
  render();
}


/* ================= OBRIGAÇÕES ANTERIORES AO INÍCIO DO CONTROLE =================
   Vencimentos antes de "Controlar a partir de" não aparecem em lugar nenhum, e as marcações
   antigas desses vencimentos são apagadas uma vez (com marca de exclusão, para a sincronização). */
const _obrDoMesTodas=obrigacoesDoMes;
obrigacoesDoMes=function(y,mi,incl){const d=obgDesde();return _obrDoMesTodas(y,mi,incl).filter(o=>o.venc>=d)};
function limparAnteriores(){
  if(!S.obg||!cfg().obrigDesde)return;const d=cfg().obrigDesde,yd=+d.slice(0,4);
  for(const [y,doc] of Object.entries(S.obg)){
    if(!doc||doc.migAnt===d)continue;
    const venc=new Map();if(+y>=yd)for(let mi=0;mi<12;mi++)for(const o of _obrDoMesTodas(+y,mi,true))if(o.venc.startsWith(y))venc.set(o.key,o.venc);
    const now=new Date().toISOString();let n=0;
    for(const f of ['feitos','excl']){const m=doc[f];if(!m)continue;
      for(const k of Object.keys(m)){const v=m[k];if(!v||!v.em)continue;
        const vc=venc.get(k);if(+y<yd||(vc&&vc<d)){m[k]={em:null,ts:now};n++}}}
    doc.migAnt=d;S._acao='Limpeza das obrigações anteriores a '+dBR(d);salvar('obrigacoes',y);
  }
  render();
}


/* ================= FORMA DE COBRANÇA DO HONORÁRIO (mensal, trimestral, semestral, anual, avulso) =================
   Campos no cliente: hon_per, hon_valor (valor de cada período), hon_parc (parcelas por período), hon_mes (mês da 1ª parcela). */
const PERIODOS=[['mensal','Mensal',1],['trimestral','Trimestral',3],['semestral','Semestral',6],['anual','Anual',12],['avulso','Avulso, sem valor fixo',0],['permuta','Permuta, sem cobrança',0]];
const semCob=p=>p==='avulso'||p==='permuta';
const perDe=c=>c&&c.hon_per&&c.hon_per!=='mensal'?c.hon_per:'mensal';
const perMeses=c=>(PERIODOS.find(p=>p[0]===perDe(c))||[0,0,1])[2];
const honVal=c=>{const v=c.hon_valor;return typeof v==='number'?v:r2(parseBR(String(v||'')))};
const honParc=c=>Math.max(1,Math.min(perMeses(c)||1,parseInt(c.hon_parc)||1));
/* valor da parcela que vence no mês ym (0 se nada vence) e qual parcela é */
function parcelaEm(c,ym){
  const P=perMeses(c);if(!P||P===1)return null;

/* ================= REPETIÇÃO: mensal, fixa, parcelada ================= */
function repResumo(R,D){const v=r2(parseBR(D.valor));
  if(R.t==='mensal')return `Cria ${R.n} lançamentos, um por mês, de ${v?brl2(v):'(valor)'} cada. O primeiro com a situação informada, os outros pendentes.`;
  if(R.t==='fixa')return `Cria os próximos 12 meses e, daí em diante, o sistema acrescenta os meses seguintes sozinho, sempre mantendo um ano à frente. Para parar, exclua um lançamento e escolha excluir os seguintes.`;
  if(R.t==='parcelada'){const p=R.modo==='total'?r2(v/R.n):v,t=R.modo==='total'?v:r2(v*R.n);return v?`${R.n} parcelas de ${brl2(p)}, total ${brl2(t)}. A descrição recebe (1/${R.n}), (2/${R.n})…`:`${R.n} parcelas. A descrição recebe (1/${R.n}), (2/${R.n})…`}
  return'';
}
function gerarRepeticao(base,R){
  const grp=uid('g'),out=[];
  const n=R.t==='fixa'?12:R.n;
  const tot=R.t==='parcelada'&&R.modo==='total'?base.valor:null,parc=tot!=null?r2(tot/n):base.valor;
  for(let i=0;i<n;i++){
    const x=i?{...base,id:uid('m'),data:addMonths(base.data,i),status:'Pendente'}:{...base};
    if(i)delete x.data_pag;
    x.rep={tipo:R.t,grp,i:i+1,...(R.t==='fixa'?{}:{n})};
    if(R.t==='parcelada'){x.valor=tot!=null&&i===n-1?r2(tot-parc*(n-1)):parc;x.descricao=`${base.descricao} (${i+1}/${n})`}
    out.push(x);
  }
  if(R.t==='fixa'){const fx={...(cfg().fixas||{})};fx[grp]={ate:out[out.length-1].data.slice(0,7)};setCfg({fixas:fx})}
  return out;
}
function excluirSeguintes(m){
  if(!m.rep||!m.rep.grp)return;const g=m.rep.grp;
  const seg=allMovs().filter(x=>x.rep&&x.rep.grp===g&&x.data>m.data&&x.status!=='Pago');
  const fixa=m.rep.tipo==='fixa'&&!(cfg().fixas||{})[g]?.fim;
  if(!seg.length&&!fixa)return;
  if(!confirm(`Este lançamento faz parte de uma repetição${m.rep.tipo==='parcelada'?' parcelada':m.rep.tipo==='fixa'?' fixa':''}. Excluir também ${seg.length?`os ${seg.length} lançamento(s) pendente(s) seguintes`:'os próximos'}${fixa?' e encerrar a repetição':''}?`))return;
  seg.forEach(x=>delMov(x.id));
  if(fixa){const fx={...(cfg().fixas||{})};fx[g]={...fx[g],fim:m.data.slice(0,7)};setCfg({fixas:fx})}
  toast(`${seg.length} lançamento(s) seguinte(s) excluído(s)${fixa?', repetição encerrada':''}`);
}
/* aplica a edição de um lançamento aos seguintes da mesma repetição */
function aplicarSeguintes(m0,base,seg){
  const raiz=String(base.descricao).replace(/\s*\(\d+\/\d+\)$/,'');
  const mudouDia=base.data.slice(8,10)!==m0.data.slice(8,10),dia=+base.data.slice(8,10);
  for(const x of seg){
    if(x.origem==='mf'&&!x.editado){x.mfk=x.mfk||mfKey(x);x.editado=true}
    x.valor=base.valor;x.grupo=base.grupo;
    for(const k of ['subgrupo','conta','cliente_id'])if(base[k])x[k]=base[k];else delete x[k];
    x.descricao=x.rep&&x.rep.tipo==='parcelada'&&x.rep.n?`${raiz} (${x.rep.i}/${x.rep.n})`:raiz;
    if(mudouDia){const [yy,mm]=x.data.split('-').map(Number),last=new Date(yy,mm,0).getDate();x.data=x.data.slice(0,8)+pad(Math.min(dia,last))}

/* mantém as fixas sempre 12 meses à frente */
function estenderFixas(){
  if(EQUIPE)return;const fx={...(cfg().fixas||{})};let mud=0,n=0;const alvo=addMonths(curYM+'-01',11).slice(0,7);
  for(const [g,f] of Object.entries(fx)){

    const ms=allMovs().filter(x=>x.rep&&x.rep.grp===g).sort((a,b)=>a.data.localeCompare(b.data));
    if(!ms.length){fx[g]={...f,fim:f.ate};mud=1;continue}
    const t=ms[ms.length-1];let ym=f.ate,i=Math.max(...ms.map(x=>x.rep.i||0));
    while(ym<alvo){ym=addMonths(ym+'-01',1).slice(0,7);i++;
      const dia=+t.data.slice(8,10),[yy,mm]=ym.split('-').map(Number),last=new Date(yy,mm,0).getDate();
      const x={...t,id:uid('m'),data:ym+'-'+pad(Math.min(dia,last)),status:'Pendente',rep:{tipo:'fixa',grp:g,i}};delete x.data_pag;delete x.editado;delete x.mfk;if(x.origem==='mf')x.origem='manual';
      putMov(x);n++}

/* ================= PRORROGAR repetições com prazo (mensal por alguns meses, parcelada, fixa encerrada) ================= */
const ymLab=ym=>{const [y,m]=ym.split('-');return MESES[+m-1]+'/'+y};
function repGrupos(){
  const G=new Map();for(const m of allMovs()){if(!m.rep||!m.rep.grp)continue;if(!G.has(m.rep.grp))G.set(m.rep.grp,[]);G.get(m.rep.grp).push(m)}
  const fx=cfg().fixas||{},out=[];
  for(const [g,ms] of G){
    ms.sort((a,b)=>a.data.localeCompare(b.data));const t=ms[ms.length-1],tipo=t.rep.tipo;
    if(tipo==='fixa'&&!(fx[g]&&fx[g].fim))continue; // fixa ativa não tem prazo
    const cont={};ms.forEach(x=>{cont[x.valor]=(cont[x.valor]||0)+1});const valor=+Object.entries(cont).sort((a,b)=>b[1]-a[1])[0][0];
    out.push({grp:g,tipo,ms,ult:t,fim:t.data.slice(0,7),n:Math.max(t.rep.n||0,...ms.map(x=>x.rep.i||0)),pend:ms.filter(x=>x.status!=='Pago').length,
      raiz:String(t.descricao).replace(/\s*\(\d+\/\d+\)$/,''),mov:t.tipo,valor,dia:+ms[0].data.slice(8,10)});
  }
  /* séries sem marcação de repetição (vindas da importação): mesma descrição, grupo e tipo, mês a mês */
  const SR=new Map(),fixaKey=new Set();
  for(const m of allMovs()){const k=serieKey(m);if(m.rep&&m.rep.tipo==='fixa'&&!(fx[m.rep.grp]&&fx[m.rep.grp].fim))fixaKey.add(k);if(m.rep)continue;if(!SR.has(k))SR.set(k,[]);SR.get(k).push(m)}
  const desde=addMonths(curYM+'-01',-2).slice(0,7);
  for(const [k,ms] of SR){
    if(fixaKey.has(k))continue;ms.sort((a,b)=>a.data.localeCompare(b.data));const t=ms[ms.length-1];
    if(new Set(ms.map(x=>x.data.slice(0,7))).size<3||t.data.slice(0,7)<desde)continue;
    const ult3=ms.slice(-3),cont={};ult3.forEach(x=>{cont[x.valor]=(cont[x.valor]||0)+1});const valor=+Object.entries(cont).sort((a,b)=>b[1]-a[1])[0][0];
    out.push({grp:'s:'+k,tipo:'serie',ms,ult:t,fim:t.data.slice(0,7),n:ms.length,pend:ms.filter(x=>x.status!=='Pago').length,raiz:t.descricao,mov:t.tipo,valor,dia:+t.data.slice(8,10)});
  }
  return out.sort((a,b)=>a.fim.localeCompare(b.fim)||a.raiz.localeCompare(b.raiz,'pt-BR'));
}
const serieKey=m=>m.tipo+'|'+norm(m.descricao||'')+'|'+(m.grupo||'');
const repGrupo=g=>repGrupos().find(x=>x.grp===g)||null;
const grupoDoMov=m=>m.rep&&m.rep.grp?repGrupo(m.rep.grp):repGrupo('s:'+serieKey(m));
function prorrogarGrupo(g,qtd,valor,virarFixa){
  const G=repGrupo(g);if(!G)return 0;const t=G.ult,fx={...(cfg().fixas||{})};
  const novaData=k=>{const ym=addMonths(t.data.slice(0,8)+'01',k).slice(0,7),[yy,mm]=ym.split('-').map(Number);return ym+'-'+pad(Math.min(G.dia,new Date(yy,mm,0).getDate()))};
  const limpo=x=>{delete x.data_pag;delete x.editado;delete x.mfk;delete x.parcial;if(x.origem==='mf')x.origem='manual';return x};
  S._acao=`Prorrogação: ${G.raiz}`;
  if(virarFixa){
    const gf=G.tipo==='serie'?uid('g'):g;
    const x=limpo({...t,id:uid('m'),data:novaData(1),status:'Pendente',valor,descricao:G.raiz,rep:{tipo:'fixa',grp:gf,i:G.tipo==='serie'?1:G.n+1}});if(x.origem!=='manual')x.origem='manual';putMov(x);
    fx[gf]={ate:x.data.slice(0,7)};setCfg({fixas:fx});estenderFixas();return -1;
  }
  if(G.tipo==='serie'){for(let k=1;k<=qtd;k++){const x=limpo({...t,id:uid('m'),data:novaData(k),status:'Pendente',valor});delete x.rep;x.origem='manual';putMov(x)}return qtd}
  const tipo=G.tipo==='fixa'?'mensal':G.tipo,N=G.n+qtd;
  for(let k=1;k<=qtd;k++){const i=G.n+k;
    putMov(limpo({...t,id:uid('m'),data:novaData(k),status:'Pendente',valor,descricao:tipo==='parcelada'?`${G.raiz} (${i}/${N})`:G.raiz,rep:{tipo,grp:g,i,n:N}}))}
  /* os lançamentos já existentes passam a mostrar o novo total */
  for(const x of G.ms){const r={...x.rep,n:N};let d=x.descricao;if(tipo==='parcelada')d=`${G.raiz} (${x.rep.i}/${N})`;
    if(x.rep.n!==N||d!==x.descricao){const y={...x,rep:r,descricao:d};if(y.origem==='mf'&&!y.editado){y.mfk=y.mfk||mfKey(y);y.editado=true}putMov(y)}}
  if(G.tipo==='fixa'){fx[g]={...fx[g],ate:novaData(qtd).slice(0,7)};setCfg({fixas:fx})}
  return qtd;
}

/* ================= CONFIRMAÇÕES DENTRO DA PÁGINA =================
   Em algumas visualizações do claude.ai a janela padrão do navegador (confirm) é bloqueada e responde
   "não" na hora, sem aparecer. Quando isso acontece, a pergunta aparece numa janela do próprio sistema
   e, no OK, a ação clicada é repetida já confirmada. */
{
  const nativo=window.confirm?window.confirm.bind(window):()=>false;
  const aprovadas=new Set();let ult=null,limpa=null;
  const marca=e=>{ult={tipo:e.type,el:e.target,t:Date.now()}};
  document.addEventListener('click',marca,true);document.addEventListener('change',marca,true);
  let dc=null;
  const abrir=(msg,ok)=>{
    if(!dc){dc=document.createElement('dialog');dc.className='dlg';dc.id='dlgConf';dc.style.maxWidth='440px';document.body.appendChild(dc)}
    dc.innerHTML=`<div class="dhead"><h3>Confirmar</h3></div><div class="dbody"><p style="margin:0;white-space:pre-line">${esc(msg)}</p></div><div class="dfoot"><span></span><span style="display:flex;gap:8px"><button class="btn" data-cno>Cancelar</button><button class="btn primary" data-cok>OK</button></span></div>`;
    dc.onclick=e=>{e.stopPropagation();if(e.target.closest('[data-cok]')){dc.close();ok()}else if(e.target.closest('[data-cno]')||e.target===dc)dc.close()};
    dc.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();dc.close();ok()}};
    dc.showModal();setTimeout(()=>dc.querySelector('[data-cok]')?.focus(),0);
  };
  window.confirm=function(msg){
    msg=String(msg??'');
    if(aprovadas.has(msg))return true;
    const t=performance.now();let r=false;try{r=nativo(msg)}catch(e){r=false}
    if(r)return true;
    const bloqueado=performance.now()-t<40;
    const ev=ult;
    if(bloqueado&&ev&&Date.now()-ev.t<2000&&ev.el&&ev.el.isConnected){
      setTimeout(()=>abrir(msg,()=>{aprovadas.add(msg);clearTimeout(limpa);limpa=setTimeout(()=>aprovadas.clear(),4000);
        if(!ev.el.isConnected){toast('A tela mudou. Faça a ação de novo.');return}
        if(ev.tipo==='change')ev.el.dispatchEvent(new Event('change',{bubbles:true}));else ev.el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}))}),0);
    }
    return false;
  };
}


/* ================= FERIADOS (nacionais + MS) ================= */
const _ferCache={};
const FER_MUN_PADRAO=[['01-25','São Paulo Apóstolo (Ivinhema)'],['11-11','Aniversário de Ivinhema']];
const ferMun=()=>{const L=cfg().feriadosMun;return Array.isArray(L)?L:FER_MUN_PADRAO};
function feriados(y){
  const ck=y+'|'+JSON.stringify(ferMun());
  if(_ferCache[ck])return _ferCache[ck];
  const s=new Set(['01-01','04-21','05-01','09-07','10-11','10-12','11-02','11-15','11-20','12-25'].map(x=>y+'-'+x));
  // Páscoa (algoritmo de Meeus)
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;const pascoa=y+'-'+pad(mes)+'-'+pad(dia);
  [-48,-47,-2,60].forEach(n=>s.add(addDays(pascoa,n))); // carnaval (seg e ter), sexta-feira santa, Corpus Christi
  for(const [md] of ferMun())if(/^\d{2}-\d{2}$/.test(md))s.add(y+'-'+md);
  return _ferCache[ck]=s;
}
const ehFeriado=iso=>feriados(+iso.slice(0,4)).has(iso);
const diaLivre=iso=>{const w=new Date(iso+'T12:00').getDay();return w===0||w===6||ehFeriado(iso)};
let nomeFeriado=iso=>{const md=iso.slice(5);return({'01-01':'Ano-novo','04-21':'Tiradentes','05-01':'Dia do Trabalho','09-07':'Independência','10-11':'Criação do MS','10-12':'N. Sra. Aparecida','11-02':'Finados','11-15':'Proclamação da República','11-20':'Consciência Negra','12-25':'Natal'})[md]||'feriado'};
{const _nf=nomeFeriado;nomeFeriado=iso=>{const f=ferMun().find(x=>x[0]===iso.slice(5));return f?f[1]:_nf(iso)}}
const motivoLivre=iso=>{const w=new Date(iso+'T12:00').getDay();return w===6?'sábado':w===0?'domingo':nomeFeriado(iso)};

/* ================= ANIVERSÁRIOS ================= */
function anivEm(c,y){
  const a=String(c.aniversario||'');const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(a);if(!m)return null;
  let md=m[2]+'-'+m[3];if(md==='02-29'&&!(y%4===0&&(y%100!==0||y%400===0)))md='02-28';
  const dia=y+'-'+md;let aviso=dia;while(diaLivre(aviso))aviso=addDays(aviso,-1);
  const idade=+m[1]>1900?y-(+m[1]):null;
  return{dia,aviso,idade};
}
/* quem deve receber os parabéns com aviso no dia d */
function aniversariantes(d){
  const y=+d.slice(0,4),out=[];
  for(const c of clientes()){if(!c.aniversario)continue;
    for(const yy of [y,y+1]){const a=anivEm(c,yy);if(a&&a.aviso===d)out.push({c,...a})}}
  return out.sort((a,b)=>a.dia.localeCompare(b.dia)||a.c.nome.localeCompare(b.c.nome,'pt-BR'));
}
function proxAniv(d,dias=7){
  const out=[];const fim=addDays(d,dias);
  for(const c of clientes()){if(!c.aniversario)continue;
    for(const yy of [+d.slice(0,4),+d.slice(0,4)+1]){const a=anivEm(c,yy);if(a&&a.aviso>d&&a.aviso<=fim)out.push({c,...a})}}
  return out.sort((a,b)=>a.dia.localeCompare(b.dia));
}

    else novos=[{...base,id:uid('m'),data:P.venc,valor:r}];

function migrarSicredi(){
  if(EQUIPE||cfg().migSicredi)return;
  const alvo='Sicredi',meses=new Set();let n=0;
  for(const m of allMovs()){
    if(m.status==='Pago'||m.data<'2026-11-01'||m.conta===alvo)continue;
    if(m.origem==='mf'&&!m.editado){m.mfk=m.mfk||mfKey(m);m.editado=true}

  meses.forEach(ym=>salvar('movimentacoes',ym));

/* ================= PENDÊNCIAS DE CADASTRO E DADOS (só no principal) ================= */
const _lev=(a,b)=>{if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]};
function contasParecidas(){
  const L=contasInfo().filter(c=>c.nome&&c.nome!==SEM_CONTA),ign=new Set(cfg().contaOk||[]),out=[];
  for(const a of L){if(ign.has(a.nome))continue;
    const na=normDesc(a.nome);
    const alvo=L.filter(b=>b.nome!==a.nome&&b.n>a.n).find(b=>{const nb=normDesc(b.nome);return _lev(na,nb)<=2||(na.length>=3&&nb.startsWith(na+' '))||(nb.length>=3&&na.startsWith(nb))});
    if(alvo&&a.n<=Math.max(5,alvo.n/10))out.push({de:a,para:alvo});}
  return out;
}

  for(const m of allMovs())if(contaDe(m)===de){m.conta=para;if(m.origem==='mf'){m.mfk=m.mfk||mfKey(m);m.editado=true}meses.add(m.data.slice(0,7));n++}
  const cc={...cfgContas()};delete cc[de];
  const tr=transfs().map(t=>({...t,de:t.de===de?para:t.de,para:t.para===de?para:t.para}));
  S._acao=`Conta ${de} juntada em ${para}`;meses.forEach(ym=>salvar('movimentacoes',ym));setCfg({contas:cc,transf:tr,...(cfg().contaPadrao===de?{contaPadrao:para}:{})});
  render();toast(`${n} lançamento(s) passaram de ${de} para ${para}`);
}
const rfIgnorado=c=>((cfg().rfOk||{})[c.id]||'')===(c.regime_rf||'')+'|'+(c.regime||'');

  const falta=c=>[!c.telefone&&'telefone',!c.cpf_cnpj&&'CPF/CNPJ',!c.regime&&'regime',perDe(c)==='mensal'&&!temHon(c)&&!c.permuta&&'honorário'].filter(Boolean);
  push('Clientes ativos com cadastro incompleto',ativos.filter(c=>falta(c).length).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).map(c=>({t:c.nome,m:'Falta: '+falta(c).join(', '),b:`<button class="btn small" data-act="pCli" data-id="${esc(c.id)}">Completar</button>`})));
  const lim=addDays(todayISO,-60),velhos=allMovs().filter(m=>m.status!=='Pago'&&m.data<lim);
  if(velhos.length)push('Lançamentos pendentes há mais de 60 dias',[{t:`${velhos.length} lançamento(s), ${brl2(velhos.reduce((a,m)=>a+(+m.valor||0),0))}`,m:'Provavelmente já foram pagos ou recebidos e falta a baixa, ou não vão acontecer e podem ser excluídos',b:`<button class="btn small primary" data-act="verVencidos">Ver vencidos</button>`}]);
  const semGrupo=allMovs().filter(m=>!String(m.grupo||'').trim());
  if(semGrupo.length)push('Lançamentos sem grupo',[{t:`${semGrupo.length} lançamento(s)`,m:'Sem grupo eles ficam fora do orçamento e da DRE: '+semGrupo.slice(0,3).map(m=>`${m.descricao} (${dBR(m.data)})`).join('; '),b:`<button class="btn small" data-act="pMovId" data-id="${esc(semGrupo[0].id)}">Abrir o primeiro</button>`}]);
  const pagosSemConta=allMovs().filter(m=>m.status==='Pago'&&!String(m.conta||'').trim()&&dCaixa(m)>=addMonths(todayISO,-3));
  if(pagosSemConta.length)push('Pagos ou recebidos sem conta (últimos 3 meses)',[{t:`${pagosSemConta.length} lançamento(s)`,m:'Sem conta, o valor não entra no saldo de nenhuma conta bancária',b:`<button class="btn small" data-act="ctAbrir" data-c="${esc(SEM_CONTA)}">Ver lançamentos</button>`}]);

  if(semSaldo.length)push('Contas ativas sem saldo informado',semSaldo.map(c=>({t:c.nome,m:`${c.n} lançamento(s). Sem o saldo, o saldo total e a projeção ficam incompletos. Se não usa mais, desmarque "ativa"`,b:`<button class="btn small" data-act="pContas">Ir para Contas bancárias</button>`})));

  const refs=Object.values(cfgContas()).filter(c=>c&&c.saldo!=null&&c.data&&!c.auto).map(c=>c.data).sort();
  if(refs.length){const R=refs[0],sc=saldoContasEm(R);
    const saldos=cfg().saldos||{},y=+R.slice(0,4),anos=Object.keys(saldos).map(Number).filter(a=>a<=y&&saldos[a]!=null&&saldos[a]!=='').sort((a,b)=>b-a);
    if(sc&&anos.length){let s=+saldos[anos[0]];const de=anos[0]+'-01-01';for(const m of allMovs()){if(m.status!=='Pago')continue;const d=dCaixa(m);if(d>=de&&d<=R)s+=fluxoPago(m)}
      const dif=r2(sc.total-s);if(Math.abs(dif)>=1)push('Diferença entre lançamentos e saldo dos bancos',[{t:`${brl2(Math.abs(dif))} ${dif>0?'a mais nos bancos':'a menos nos bancos'} em ${dBR(R)}`,
        m:`Pelos lançamentos (saldo inicial de ${anos[0]} + pagos e recebidos) o caixa seria ${brl2(s)}; pelas contas informadas é ${brl2(sc.total)}. ${dif>0?'Pode faltar lançar alguma receita, ou o saldo inicial do ano está baixo':'Pode faltar lançar alguma despesa, ou alguma conta inativa (Cresol, JM Gestão) ainda tinha dinheiro'}. Um extrato OFX ajuda a achar o que falta.`,
        b:`<button class="btn small" data-act="ofxImport">Importar extrato</button>`}])}}
  const ORD=['Contas com nome parecido','Clientes possivelmente duplicados','Diferença entre lançamentos e saldo dos bancos','Contas ativas sem saldo informado','Lançamentos pendentes há mais de 60 dias','Pagos ou recebidos sem conta (últimos 3 meses)','Lançamentos sem grupo','Regime diferente da Receita Federal','Clientes ativos com cadastro incompleto'];
  return P.sort((x,y)=>ORD.indexOf(x.sec)-ORD.indexOf(y.sec));
}

/* ================= IMPORTAR EXTRATO OFX COM CONCILIAÇÃO ================= */
const BANCOS_OFX={'748':'Sicredi','341':'Itaú Empresas','133':'Cresol','077':'Inter PJ','77':'Inter PJ','237':'Bradesco','260':'Nubank','001':'Banco do Brasil','1':'Banco do Brasil','104':'Caixa','756':'Sicoob','033':'Santander'};
function lerOFX(txt){
  const tag=(b,t)=>{const m=new RegExp('<'+t+'>([^<\\r\\n]*)','i').exec(b);return m?m[1].trim():''};
  const dt=v=>{const m=/^(\d{4})(\d{2})(\d{2})/.exec(v||'');return m?`${m[1]}-${m[2]}-${m[3]}`:''};
  const num=v=>{v=String(v||'').trim();if(/,\d{1,2}$/.test(v)&&!/\.\d{1,2}$/.test(v))v=v.replace(/\./g,'').replace(',','.');return parseFloat(v)};
  const trs=[];const re=/<STMTTRN>([\s\S]*?)(?:<\/STMTTRN>|(?=<STMTTRN>)|(?=<\/BANKTRANLIST>))/gi;let m;
  while((m=re.exec(txt))){const b=m[1];const v=num(tag(b,'TRNAMT'));const d=dt(tag(b,'DTPOSTED'));if(!d||!isFinite(v)||!v)continue;
    const memo=[tag(b,'MEMO'),tag(b,'NAME')].filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join(' - ').replace(/\s+/g,' ');
    trs.push({fitid:tag(b,'FITID')||(d+'|'+v+'|'+memo),data:d,valor:r2(Math.abs(v)),tipo:v>0?'Receita':'Despesa',memo})}
  const bal=/<LEDGERBAL>([\s\S]*?)<\/LEDGERBAL>/i.exec(txt);
  return{banco:tag(txt,'BANKID').replace(/^0+(?=\d)/,''),bancoRaw:tag(txt,'BANKID'),trs,saldo:bal?{v:num(tag(bal[1],'BALAMT')),data:dt(tag(bal[1],'DTASOF'))}:null};
}
function sugestaoOFX(t,conta,usados){
  const ofxUsado=allMovs().some(m=>m.ofx===t.fitid);if(ofxUsado)return{acao:'dup'};
  if((cfg().ofxIgn||[]).includes(t.fitid))return{acao:'ign',ja:true};
  const memo=normDesc(t.memo);
  const nomeBate=m=>{const c=cliById(clienteDe(m));const ns=[m.descricao,c?.nome,c?.razao_social].filter(Boolean).map(normDesc);return ns.some(n=>n.split(' ').filter(w=>w.length>=4).some(w=>memo.includes(w)))};
  const pend=allMovs().filter(m=>!usados.has(m.id)&&m.tipo===t.tipo&&m.status!=='Pago'&&Math.abs((+m.valor||0)-t.valor)<0.01&&Math.abs((new Date(m.data)-new Date(t.data))/864e5)<=10)
    .sort((a,b)=>(nomeBate(b)-nomeBate(a))||Math.abs(new Date(a.data)-new Date(t.data))-Math.abs(new Date(b.data)-new Date(t.data)));
  const pagos=allMovs().filter(m=>!usados.has(m.id)&&!m.ofx&&m.tipo===t.tipo&&m.status==='Pago'&&Math.abs((+m.valor||0)-t.valor)<0.01&&Math.abs((new Date(dCaixa(m))-new Date(t.data))/864e5)<=4&&(!m.conta||m.conta===conta));
  const opts=[...pagos.map(m=>({v:'ja:'+m.id,n:`Já lançado: ${m.descricao} (${dBR(dCaixa(m))})`})),...pend.slice(0,6).map(m=>({v:'baixa:'+m.id,n:`Dar baixa: ${m.descricao}, vence ${dBR(m.data)}`}))];
  // grupo sugerido: último lançamento pago com descrição parecida
  const regra=(cfg().ofxRegras||{})[t.tipo+'|'+memo.split(' ').slice(0,3).join(' ')];
  const igual=allMovs().filter(m=>m.tipo===t.tipo&&m.grupo&&normDesc(m.descricao)&&memo.includes(normDesc(m.descricao))).sort((a,b)=>b.data.localeCompare(a.data))[0];
  const g=regra?regra.g:igual?igual.grupo:'',dsc=regra?regra.d:igual?igual.descricao:t.memo.slice(0,60);
  const pad=pagos[0]?'ja:'+pagos[0].id:pend[0]?'baixa:'+pend[0].id:'novo';
  return{acao:pad,opts,grupo:g,desc:dsc,cli:igual?.cliente_id||''};
}
function abrirOFX(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.ofx,.OFX,application/x-ofx';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const buf=await f.arrayBuffer();
    let txt=new TextDecoder('utf-8').decode(buf);if(/CHARSET:\s*1252|ENCODING:\s*USASCII/i.test(txt.slice(0,600))||txt.includes(String.fromCharCode(65533)))txt=new TextDecoder('windows-1252').decode(buf);
    const X=lerOFX(txt);if(!X.trs.length){toast(`"${f.name}" não tem lançamentos de extrato OFX que eu consiga ler.`);return}
    conciliarOFX(X,f.name)};
  inp.click();
}
function conciliarOFX(X,nome){
  const contas=contasInfo().map(c=>c.nome).filter(n=>n!==SEM_CONTA);
  let conta=BANCOS_OFX[X.banco]||BANCOS_OFX[X.bancoRaw]||cfg().contaPadrao||'';
  if(conta&&!contas.includes(conta)){const p=contas.find(c=>normDesc(c).startsWith(normDesc(conta).split(' ')[0]));if(p)conta=p}
  const trs=[...X.trs].sort((a,b)=>a.data.localeCompare(b.data));
  let R=[];
  const sugerir=()=>{const usados=new Set();R=trs.map(t=>{const s=sugestaoOFX(t,conta,usados);const id=(s.acao||'').split(':')[1];if(id)usados.add(id);return{t,...s,escolha:s.acao==='dup'?'dup':s.ja?'ign':s.acao}})};
  sugerir();
  let usarSaldo=!!X.saldo;
  const gR=gruposMov('Receita'),gD=gruposMov('Despesa');
  const draw=()=>{
    const novos=R.filter(r=>r.t&&r.escolha==='novo').length,baixas=R.filter(r=>r.escolha.startsWith('baixa:')).length,ja=R.filter(r=>r.escolha.startsWith('ja:')).length,dup=R.filter(r=>r.escolha==='dup').length;
    dlg.innerHTML=`<div class="dhead"><div><h3>Conciliar extrato</h3><div class="muted" style="font-size:13px">${esc(nome)}: ${trs.length} lançamento(s) de ${dBR(trs[0].data)} a ${dBR(trs[trs.length-1].data)}</div></div><button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="dbody">
      <div class="fgrid" style="margin-bottom:10px"><label>Conta do extrato<input type="text" list="dlOfxC" data-oconta value="${esc(conta)}"><datalist id="dlOfxC">${contas.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></label>
        ${X.saldo?`<label style="flex-direction:row;align-items:center;gap:8px;margin-top:22px;color:var(--fg)"><input type="checkbox" data-osaldo${usarSaldo?' checked':''}> Usar o saldo do extrato (${brl2(X.saldo.v)} em ${dBR(X.saldo.data)}) para conferir a conta</label>`:''}</div>
      <p class="hint" style="margin:0 0 10px">${baixas} baixa(s), ${ja} já lançado(s), ${novos} novo(s)${dup?`, ${dup} já importado(s) antes`:''}. Confira a sugestão de cada linha; nada é gravado antes de "Confirmar".</p>
      <div class="tscroll"><table class="tbl-ofx"><thead><tr><th class="l">Data</th><th class="l">No banco</th><th>Valor</th><th class="l">O que fazer</th></tr></thead><tbody>
      ${R.map((r,i)=>{const t=r.t,gs=t.tipo==='Receita'?gR:gD;
        return `<tr${r.escolha==='dup'||r.escolha==='ign'?' style="opacity:.55"':''}><td class="l" style="white-space:nowrap">${dBR(t.data)}</td><td class="l" style="max-width:260px;word-break:break-word">${esc(t.memo||'—')}</td>
        <td class="${t.tipo==='Receita'?'vr':'vd'}" style="white-space:nowrap">${t.tipo==='Receita'?'':'−'}${brl2(t.valor)}</td>
        <td class="l" style="min-width:260px">${r.escolha==='dup'?'<span class="muted">já importado antes</span>':`<select data-oesc="${i}" style="width:100%">${(r.opts||[]).map(o=>`<option value="${esc(o.v)}"${r.escolha===o.v?' selected':''}>${esc(o.n)}</option>`).join('')}<option value="novo"${r.escolha==='novo'?' selected':''}>Criar lançamento novo (já pago)</option><option value="ign"${r.escolha==='ign'?' selected':''}>Ignorar</option></select>
          ${r.escolha==='novo'?`<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><input type="text" data-odesc="${i}" value="${esc(r.desc)}" placeholder="Descrição" style="flex:2;min-width:140px"><input type="text" data-ogrupo="${i}" list="dlOfxG${t.tipo[0]}" value="${esc(r.grupo)}" placeholder="Grupo" style="flex:1;min-width:110px"></div>`:''}`}</td></tr>`}).join('')}
      </tbody></table></div>
      <datalist id="dlOfxGR">${gR.map(g=>`<option value="${esc(g)}">`).join('')}</datalist><datalist id="dlOfxGD">${gD.map(g=>`<option value="${esc(g)}">`).join('')}</datalist>

      else if(r.escolha==='novo'){const g=String(r.grupo||'').trim(),dsc=String(r.desc||t.memo||'Lançamento do extrato').trim();
        const m={id:uid('m'),tipo:t.tipo,data:t.data,data_pag:t.data,descricao:dsc,valor:t.valor,status:'Pago',grupo:g,subgrupo:'',conta,origem:'ofx',ofx:t.fitid};if(r.cli)m.cliente_id=r.cli;
        putMov(m);nn++;if(g)regras[t.tipo+'|'+normDesc(t.memo).split(' ').slice(0,3).join(' ')]={g,d:dsc}}
      else if(r.escolha==='ign')ign.add(t.fitid)}
    const patch={ofxIgn:[...ign].slice(-2000),ofxRegras:regras};
    if(usarSaldo&&X.saldo){const cc={...cfgContas()};cc[conta]={...(cc[conta]||{ativa:true}),extrato:X.saldo.v,...(cc[conta]?.saldo==null?{saldo:X.saldo.v,data:X.saldo.data}:{})};patch.contas=cc}
    setCfg(patch);dlg.close();render();toast(`Extrato conciliado: ${nb} baixa(s), ${nn} novo(s), ${nj} já lançado(s)`);
  };

/* ================= COBRANÇA EM SEQUÊNCIA E INADIMPLÊNCIA ================= */
function inadimplencia(){
  const mp=new Map();
  for(const m of allMovs()){if(m.tipo!=='Receita'||!vencido(m))continue;const cid=clienteDe(m)||'';const k=cid||'d:'+normDesc(m.descricao);
    const x=mp.get(k)||{k,c:cid?cliById(cid):null,nome:m.descricao,movs:[],tot:0};x.movs.push(m);x.tot=r2(x.tot+(+m.valor||0));mp.set(k,x)}
  const cob=cfg().cobEnv||{};
  return [...mp.values()].map(x=>{x.movs.sort((a,b)=>a.data.localeCompare(b.data));x.mais=x.movs[0].data;x.dias=Math.round((new Date(todayISO)-new Date(x.mais))/864e5);x.cobrado=cob[x.k]||'';return x})
    .sort((a,b)=>b.tot-a.tot);
}
const faixaAtraso=d=>d<=30?'até 30 dias':d<=60?'31 a 60 dias':d<=90?'61 a 90 dias':'mais de 90 dias';

    if(e.target.closest('[data-cxls]')){

      const det=[['Cliente','Descrição','Grupo','Vencimento','Valor','Dias de atraso']];for(const x of L)for(const m of x.movs)det.push([x.c?.nome||x.nome,m.descricao,m.grupo,dISO(m.data),+m.valor,Math.round((new Date(todayISO)-new Date(m.data))/864e5)]);
