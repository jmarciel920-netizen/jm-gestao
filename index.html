<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JM Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>:root{
  --bg:hsl(220 20% 97%); --card:#fff; --fg:hsl(222 47% 11%); --muted-fg:hsl(220 9% 46%); --muted-bg:hsl(220 14% 96%);
  --border:hsl(220 13% 90%); --primary:hsl(230 80% 55%); --primary-fg:#fff; --accent:hsl(162 70% 38%); --destructive:hsl(0 72% 51%);
  --warning:hsl(32 95% 44%); --info:hsl(200 90% 45%);
  --sb-bg:hsl(230 45% 18%); --sb-fg:hsl(220 20% 80%); --sb-accent:hsl(230 40% 25%); --sb-active:hsl(162 70% 50%); --sb-border:hsl(230 35% 25%);
  /* aliases used by components */
  --paper:var(--bg); --surface:var(--card); --ink:var(--fg); --muted:var(--muted-fg); --line:var(--border); --line-strong:hsl(220 13% 82%);
  --rec:var(--accent); --rec-soft:hsl(162 60% 92%); --des:hsl(350 75% 52%); --des-soft:hsl(350 80% 95%);
  --saz:var(--warning); --saz-soft:hsl(38 95% 90%); --brand:var(--primary); --focus:var(--primary); --neg:var(--destructive); --pos:var(--accent);
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:hsl(230 35% 8%); --card:hsl(230 30% 12%); --fg:hsl(220 20% 95%); --muted-fg:hsl(220 12% 60%); --muted-bg:hsl(230 25% 15%);
    --border:hsl(230 25% 20%); --line-strong:hsl(230 22% 28%); --primary:hsl(230 75% 62%); --accent:hsl(162 65% 48%); --destructive:hsl(0 75% 60%);
    --warning:hsl(38 95% 58%); --sb-bg:hsl(230 35% 10%); --sb-accent:hsl(230 30% 18%); --sb-border:hsl(230 25% 18%);
    --rec-soft:hsl(162 40% 16%); --des:hsl(350 80% 65%); --des-soft:hsl(350 40% 18%); --saz-soft:hsl(38 40% 17%); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:hsl(230 35% 8%); --card:hsl(230 30% 12%); --fg:hsl(220 20% 95%); --muted-fg:hsl(220 12% 60%); --muted-bg:hsl(230 25% 15%);
  --border:hsl(230 25% 20%); --line-strong:hsl(230 22% 28%); --primary:hsl(230 75% 62%); --accent:hsl(162 65% 48%); --destructive:hsl(0 75% 60%);
  --warning:hsl(38 95% 58%); --sb-bg:hsl(230 35% 10%); --sb-accent:hsl(230 30% 18%); --sb-border:hsl(230 25% 18%);
  --rec-soft:hsl(162 40% 16%); --des:hsl(350 80% 65%); --des-soft:hsl(350 40% 18%); --saz-soft:hsl(38 40% 17%); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* shell */
.app{display:flex;min-height:100vh}
.sb{width:240px;flex:none;background:var(--sb-bg);color:var(--sb-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--sb-border);z-index:30}
.sb-head{display:flex;align-items:center;gap:10px;padding:18px 16px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--sb-active);display:grid;place-items:center;color:#fff}
.sb-head b{font-size:17px;color:#fff;letter-spacing:-.01em}
.sb-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in srgb,var(--sb-fg) 60%,transparent);padding:10px 18px 6px}
.sb nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;overflow-y:auto}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--sb-fg);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:14px}
.nav:hover{background:var(--sb-accent);color:#fff}
.nav[aria-current="page"]{background:var(--sb-accent);color:#fff;font-weight:600}
.nav[aria-current="page"] svg{color:var(--sb-active)}
.sb-foot{margin-top:auto;padding:12px;border-top:1px solid var(--sb-border)}
.sb-foot .nav{width:100%}
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}
.hdr{height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:20}
.crumb{display:flex;align-items:center;gap:4px;color:var(--muted-fg);font-size:14px}
.crumb b{color:var(--fg);font-weight:500}
.hbtn{border:0;background:transparent;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.hbtn:hover{background:var(--muted-bg)}
.menu-btn{display:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.status{font-size:12px;color:var(--muted-fg)}
.wrap{padding:24px;max-width:1280px;width:100%;margin:0 auto}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.ph h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.ph p{margin:2px 0 0;color:var(--muted-fg)}
.ph .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scrim{display:none}
@media (max-width:900px){
  .sb{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s ease;padding-top:env(safe-area-inset-top,0px)}
  .app.open .sb{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .menu-btn{display:grid}
  .wrap{padding:16px}
  .hdr{padding:0 12px}
  .crumb>span:first-child,.crumb>svg{display:none}
}

/* controls */
.bar-tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 16px}
.bar-tools label{font-size:13px;color:var(--muted-fg);display:flex;align-items:center;gap:8px}
select,input[type=number],input[type=text],input[type=date],textarea{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;height:36px;color:var(--fg)}
textarea{height:auto}
select:focus,input:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--primary) 45%,transparent);outline-offset:0;border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:0 14px;height:36px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
a.btn{text-decoration:none;color:inherit}a.btn.primary{color:var(--primary-fg)}
table.mcol-on th:first-child,table.mcol-on td:first-child{min-width:0;max-width:46vw}table.mcol-on th{white-space:normal}table.mcol-on .season,table.mcol-on .chip{display:none}table.mcol-on td,table.mcol-on th{padding-left:8px;padding-right:8px}
.btn:hover{background:var(--muted-bg)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.btn.primary:hover{filter:brightness(1.07);background:var(--primary)}
.btn.danger{color:var(--destructive);border-color:color-mix(in srgb,var(--destructive) 40%,transparent)}
.btn.small{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;padding:0;cursor:pointer;text-align:left;font-weight:500;color:var(--fg)}
.linkbtn:hover{color:var(--primary)}
.subtabs{display:inline-flex;background:var(--muted-bg);border-radius:10px;padding:3px;gap:2px}
.subtabs button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted-fg);font-weight:500}
.subtabs button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg{display:inline-flex;background:var(--muted-bg);border-radius:10px;padding:3px;gap:2px;margin:14px 0 6px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted-fg);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* cards */
.card0,.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel{padding:18px 20px}
.panel h3{margin:0 0 12px;font-size:16px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.panel h3 small{font-weight:400;color:var(--muted-fg);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:0 0 16px}
.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}@media (max-width:1000px){.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:560px){.kpis.k6{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);position:relative}
.kpi h3{margin:0 44px 6px 0;font-size:13px;font-weight:500;color:var(--muted-fg)}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.kpi .s{font-size:12.5px;color:var(--muted-fg);margin-top:4px}
.kpi .ic{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:10px;display:grid;place-items:center}
.kpi .ic svg{width:18px;height:18px}
.tone-p{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.tone-a{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tone-d{background:color-mix(in srgb,var(--destructive) 12%,transparent);color:var(--destructive)}
.tone-w{background:color-mix(in srgb,var(--warning) 16%,transparent);color:var(--warning)}
.tone-i{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted-fg)}
.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}
.cols.eq{grid-template-columns:1fr 1fr}
.cols>*{min-width:0}
@media (max-width:900px){.cols,.cols.eq{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--muted-fg);margin:4px 0 12px}

/* tables */
h2.sec{font-size:16px;margin:24px 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
h2.sec .dot{width:9px;height:9px;border-radius:50%}
.tscroll{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel .tscroll{box-shadow:none}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--border)}
th{font-weight:500;color:var(--muted-fg);font-size:12.5px;background:color-mix(in srgb,var(--muted-bg) 60%,var(--card))}
thead tr:first-child th{color:var(--fg);font-weight:600}
tbody tr:last-child td{border-bottom:0}
th.grp,td.gl{border-left:1px solid var(--border)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;min-width:200px;white-space:normal}
th:first-child{background:color-mix(in srgb,var(--muted-bg) 60%,var(--card))}
td.l,th.l{text-align:left}
tr.ghead td,tr.ghead td:first-child{background:color-mix(in srgb,var(--muted-bg) 70%,var(--card));font-weight:600;font-size:12.5px;color:var(--muted-fg)}
tr.total td{font-weight:700;border-top:2px solid var(--border);border-bottom:0}
tr.row{cursor:pointer}
tr.row:hover td{background:color-mix(in srgb,var(--muted-bg) 80%,var(--card))}
.lname{font-weight:500}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.chip.saz{background:var(--saz-soft);color:var(--saz)}
.chip.fixo{background:var(--rec-soft);color:var(--rec)}
.chip.man{background:var(--muted-bg);color:var(--muted-fg)}
.chip.fora{background:var(--des-soft);color:var(--des)}
.chip.ok{background:var(--rec-soft);color:var(--rec)}
.chip.info{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.season{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-fg);margin-top:3px}
.track{position:relative;width:90px;height:6px;border-radius:3px;background:var(--saz-soft);flex:none}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--saz)}
.track .mark{position:absolute;top:-3px;width:2px;height:12px;background:var(--fg)}
.grid td{padding:3px 3px}
.grid td:first-child{padding:6px 12px}
.cell{width:84px;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;height:30px}
.cell:hover{border-color:var(--border)}
.cell:focus{border-color:var(--primary);background:var(--card)}
.grid .tot{font-weight:600;padding-right:12px}

/* strip (orçamento) */
.strip-wrap{overflow-x:auto;margin-bottom:16px}
.strip{min-width:680px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 14px 12px;box-shadow:var(--shadow)}
.months{display:grid;grid-template-columns:repeat(12,minmax(48px,1fr));gap:4px}
.mcol{border:0;background:transparent;padding:6px 2px 4px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.mcol:hover{background:var(--muted-bg)}
.mcol.cur{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.bars{height:118px;display:flex;align-items:flex-end;gap:3px}
.bar{position:relative;width:14px;height:100%}
.bar .o{position:absolute;bottom:0;left:0;right:0;border:1.5px solid;border-radius:3px 3px 0 0;border-bottom:0}
.bar .f{position:absolute;bottom:0;left:2px;right:2px;border-radius:2px 2px 0 0}
.bar.rec .o{border-color:var(--rec)} .bar.rec .f{background:var(--rec)}
.bar.des .o{border-color:var(--des)} .bar.des .f{background:var(--des)}
.fut .bar .f{opacity:.55;background-image:repeating-linear-gradient(135deg,transparent 0 3px,var(--card) 3px 5px)}
.mlab{font-size:13px;font-weight:600}
.mcol.fut .mlab{color:var(--muted-fg);font-weight:500}
.mres{font-size:12px;color:var(--pos)} .mres.neg{color:var(--neg)} .fut .mres{opacity:.7}
.bands{display:grid;grid-template-columns:repeat(12,minmax(48px,1fr));gap:4px;margin-top:10px;border-top:1px dashed var(--line-strong);padding-top:10px}
.band{position:relative;height:26px;border-radius:6px;background:var(--saz-soft);overflow:hidden;cursor:pointer;border:0;padding:0;text-align:left}
.band.des{background:var(--des-soft)}
.band .bf{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--saz) 40%,transparent)}
.band.des .bf{background:color-mix(in srgb,var(--des) 30%,transparent)}
.blabel{font-size:12px;color:var(--muted-fg);align-self:center;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.blabel.r{text-align:right}
.band span{position:relative;color:var(--fg);display:block;padding:4px 8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted-fg);margin-top:10px}
.legend i{display:inline-block;width:11px;height:11px;vertical-align:-1px;margin-right:5px;border-radius:2px}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
.list .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .m{font-size:12px;color:var(--muted-fg)}
.list .v{font-weight:600;white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(110px,180px) 1fr auto;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.hbar .tr{height:8px;border-radius:4px;background:var(--muted-bg);overflow:hidden}
.hbar .tr span{display:block;height:100%;border-radius:4px;background:var(--primary)}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthnav{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.monthnav button{border:1px solid var(--border);background:var(--card);width:32px;height:32px;border-radius:8px;cursor:pointer}
.monthnav span{min-width:130px;text-align:center}
.st{border:1px solid;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;white-space:nowrap}
.st.pago{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 45%,transparent);background:var(--rec-soft)}
.st.pend{color:var(--saz);border-color:color-mix(in srgb,var(--saz) 55%,transparent)}
.st.venc{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 50%,transparent);background:color-mix(in srgb,var(--neg) 8%,transparent)}
.mov td{vertical-align:middle}
.mov td:first-child{min-width:0;white-space:nowrap}
.mov td.desc{text-align:left;white-space:normal;min-width:200px}
.mov td.gr{text-align:left;color:var(--muted-fg);font-size:13px;white-space:normal}
.vr{color:var(--rec);font-weight:600} .vd{color:var(--des);font-weight:600}
.icon{border:0;background:none;cursor:pointer;color:var(--muted-fg);padding:5px;border-radius:6px;display:inline-grid;place-items:center}
.icon:hover{background:var(--muted-bg);color:var(--fg)}
.cli{font-size:11px;font-weight:600;background:var(--rec-soft);color:var(--rec);padding:1px 7px;border-radius:999px;margin-left:6px}
.search{min-width:190px}
.sumline{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px;margin:0 0 12px;color:var(--muted-fg)}
.sumline b{color:var(--fg)}
.hist{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:6px}
.hist div{border-radius:6px;padding:4px 2px;text-align:center;font-size:11px;background:var(--muted-bg)}
.hist div.pg{background:var(--rec-soft);color:var(--rec)}
.hist div.pd{background:var(--saz-soft);color:var(--saz)}
.hist div.vc{background:var(--des-soft);color:var(--des)}
.hist b{display:block;font-weight:600;color:var(--muted-fg)}
@media (max-width:560px){.hist{grid-template-columns:repeat(6,1fr)}}

/* import / empty */
.drop{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:26px;text-align:center;background:var(--card);cursor:pointer}
.drop.over{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 6%,var(--card))}
.drop strong{display:block;font-size:15px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-top:12px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.card .meta{font-size:13px;color:var(--muted-fg)}
.empty{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:40px 24px;text-align:center}
.empty h2{font-size:18px}
.empty p{max-width:56ch;margin:6px auto 16px;color:var(--muted-fg)}

/* dialog */
dialog{border:1px solid var(--border);border-radius:14px;padding:0;background:var(--card);color:var(--fg);width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,15,30,.5)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2}
.dhead h3{margin:0;font-size:18px}
.dbody{padding:16px 20px 20px}
.dfoot{display:flex;justify-content:space-between;gap:10px;padding:12px 20px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--card)}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted-fg);padding:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.fgrid label,.fl{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted-fg);font-weight:500}
.fgrid input,.fgrid select{width:100%}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.vinc{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px}
.vinc label{flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-size:14px;font-weight:400;display:flex}
.vinc small{color:var(--muted-fg)}
.curve{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px}
.cv{display:flex;flex-direction:column;align-items:center;gap:4px}
.cv .cb{width:100%;height:80px;display:flex;align-items:flex-end;border:0;background:var(--muted-bg);border-radius:6px;cursor:pointer;padding:0}
.cv .cb span{display:block;width:100%;background:var(--saz);border-radius:4px 4px 0 0}
.cv .cb.mk{outline:2px solid var(--saz);outline-offset:1px}
.cv input{width:100%;text-align:center;padding:4px 2px;font-size:12px;height:28px}
.cv small{font-size:11px;color:var(--muted-fg)}
.preview{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px;font-size:12px;text-align:center}
.preview div{background:var(--muted-bg);border-radius:6px;padding:4px 2px}
.preview b{display:block;color:var(--muted-fg);font-weight:500}
.mgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.mgrid label{font-size:12px}
.mgrid input{width:100%}
@media (max-width:560px){.mgrid{grid-template-columns:repeat(3,1fr)}.curve,.preview{grid-template-columns:repeat(6,1fr)}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;max-width:90vw}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:inherit}

/* serviços */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:16px}
.svc{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.svc:hover{border-color:color-mix(in srgb,var(--primary) 45%,var(--border))}
.svc[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.svc h4{margin:0;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.svc .big{font-size:22px;font-weight:700;letter-spacing:-.02em}
.svc .row2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted-fg)}
.prog{height:6px;border-radius:3px;background:var(--muted-bg);overflow:hidden;display:flex}
.prog span{display:block;height:100%}
.pipe{display:flex;gap:6px;flex-wrap:wrap}
.pipe span{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--muted-bg);color:var(--muted-fg)}
.itm select{height:30px;padding:2px 6px;font-size:13px}
.itm input.cell{width:90px}
.dre td:first-child{min-width:280px}
.dre tr.sub td{font-weight:700;background:color-mix(in srgb,var(--muted-bg) 55%,var(--card))}
.dre tr.sub td:first-child{background:color-mix(in srgb,var(--muted-bg) 55%,var(--card))}
.dre tr.det td:first-child{padding-left:28px;color:var(--muted-fg)}
.dre tr.res td{font-weight:700;font-size:15px;border-top:2px solid var(--fg)}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px 16px}
.params label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted-fg);font-weight:500}
.params input,.params select{width:100%}
.params input[type=checkbox],.vinc input,.fgrid input[type=checkbox]{width:auto;height:auto}
@media print{
  .sb,.hdr,.ph .acts,.bar-tools,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .wrap{padding:0;max-width:none}
  .tscroll,.panel,.kpi{box-shadow:none;border-color:#ccc}
}

/* cartões no celular */
@media (max-width:640px){
  table.cards thead{display:none}
  table.cards,table.cards tbody{display:block;width:100%}
  table.cards tr{display:flex;flex-direction:column;padding:10px 0;border-bottom:1px solid var(--border)}
  table.cards tr:last-child{border-bottom:0}
  table.cards td,table.cards td:first-child{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:3px 14px;text-align:right;white-space:normal;position:static;min-width:0;background:transparent}
  table.cards td::before{content:attr(data-l);color:var(--muted-fg);font-size:12px;font-weight:500;text-align:left;flex:none}
  table.cards td:first-child::before,table.cards td.desc::before,table.cards td.acts::before{content:none}
  table.cards td:first-child,table.cards td.desc{font-size:15px;justify-content:flex-start;text-align:left;flex-wrap:wrap}
  table.cards td.desc{order:-2}
  table.cards td.dt,table.cards td.dt:first-child{order:-1;font-size:12.5px;color:var(--muted-fg);padding-top:0}
  table.cards td.acts{justify-content:flex-end}
  table.cards tr.ghead{padding:6px 0;background:color-mix(in srgb,var(--muted-bg) 70%,var(--card))}
  table.cards tr.ghead td::before{content:none}
  table.cards tr.row:hover td{background:transparent}
  .mov td.gr{font-size:13px}
}

/* tarefas do dia */
.tk{border:1px solid var(--border);border-radius:10px;margin:8px 0;background:var(--card)}
.tk>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
.tk>summary::-webkit-details-marker{display:none}
.tk>summary .grow{flex:1;min-width:0}
.tk-sub{display:block;font-size:12px;color:var(--muted-fg)}
.tk-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--primary)}
.tk-ic.ok{background:var(--rec-soft);color:var(--rec)}
.tk-ic.late{background:color-mix(in srgb,var(--destructive) 12%,transparent);color:var(--destructive)}
.tk-list{padding:0 12px 6px 54px}
.tk-row .tk-chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--line-strong);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none;color:#fff;padding:0}
.tk-row .tk-chk.on{background:var(--rec);border-color:var(--rec)}
.tk-row .tk-chk svg{width:14px;height:14px}
.tk-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;padding:12px 14px}
.tk-add input[name=titulo]{flex:1 1 260px}
.tk-add input[name=cli]{flex:0 1 200px}
.tk-h{margin:14px 0 4px;font-size:13px;color:var(--muted-fg);font-weight:600}
.tk-sec>h3{margin-bottom:6px}
@media (max-width:640px){.tk>summary{flex-wrap:wrap}.tk>summary .prog{display:none}.tk-list{padding-left:12px}}
</style>

<script type="text/plain" id="jmapp">
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const GRUPOS={receita:['Recorrente','Sazonal','Eventual'],despesa:['Sócio','Impostos','Operacional','Comercial','Financeiro','Investimentos']};
const REGIMES=['MEI','Simples Nacional','Lucro Presumido','Associação','Pessoa Física'];
const Z=()=>Array(12).fill(0);
const sum=(a,i0=0,i1=11)=>{let s=0;for(let i=i0;i<=i1;i++)s+=+a[i]||0;return s};
const r2=v=>Math.round(v*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});
const brl2=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2});
const num=v=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const numIn=v=>v?(+v).toLocaleString('pt-BR',{maximumFractionDigits:2}):'';
const pct=v=>isFinite(v)?(v*100).toLocaleString('pt-BR',{maximumFractionDigits:0})+'%':'—';
const kfmt=v=>{const a=Math.abs(v);const s=v<0?'−':'';return a>=1000?s+(a/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil':s+Math.round(a)};
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const normDesc=s=>norm(s).replace(/\s*13\s*[°º]?$/,'').trim();
const dBR=iso=>iso?iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(0,4):'';
const pad=n=>String(n).padStart(2,'0');
const todayISO=(()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())})();
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addMonths(iso,n){const [y,m,d]=iso.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(Math.min(d,last))}
function parseBR(v){
  if(typeof v==='number')return v;
  let s=String(v??'').replace(/R\$|\s/g,'');
  if(!s)return 0;
  if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?n:0;
}
const EQUIPE=!!window.JM_EQUIPE;
const UNIF=!!window.JM_UNIF;
const PODE_TAR=EQUIPE||UNIF;
let _uidN=0;const uid=(p='l')=>p+Date.now().toString(36)+(_uidN++%1296).toString(36).padStart(2,'0')+Math.random().toString(36).slice(2,8);

/* ================= state ================= */
const today=new Date();
const prefs=(()=>{try{return JSON.parse(localStorage.getItem('jm-prefs')||'{}')}catch(e){return{}}})();
const S={orc:{},mov:{},cad:{clientes:{itens:[]}},svc:{},cfg:{},fin:{},usu:{},v:0,svcSel:null,dreP:'ano',dreM:null,fxFut:'agendado',simP:null,
  ano:prefs.ano||today.getFullYear(),tab:prefs.tab||'painel',futuro:prefs.futuro||'orcado',orcView:'comp',ref:null,
  mym:prefs.mym||todayISO.slice(0,7),mTipo:'todos',mStatus:'todos',mGrupo:'',mBusca:'',
  cStatus:'Ativo',cRegime:'',cBusca:'',imports:[]};
function savePrefs(){try{localStorage.setItem('jm-prefs',JSON.stringify({ano:S.ano,tab:S.tab,futuro:S.futuro,mym:S.mym}))}catch(e){}}
function defRef(ano){const y=today.getFullYear();return ano<y?11:ano>y?-1:today.getMonth()}
S.ref=defRef(S.ano);
const bump=()=>{S.v++};

/* ================= persistence ================= */
const store={db:null,mode:'init'};
const timers={},chains={},lastJson={};
const COLS={orcamento:'orc',movimentacoes:'mov',cadastros:'cad',servicos:'svc',config:'cfg'};
function setStatus(t){document.getElementById('status').textContent=t}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem('jm-data')||'{}');for(const k of Object.values(COLS))if(d[k])S[k]=d[k];bump()}catch(e){}if(typeof histBase==='function')histBase()}
function saveLocal(){try{const o={};for(const k of Object.values(COLS))o[k]=S[k];localStorage.setItem('jm-data',JSON.stringify(o))}catch(e){toast('O navegador não deixou salvar localmente.')}}
/* ===== caixa de saída: toda alteração fica guardada neste navegador até o banco confirmar que gravou ===== */
const OUTBOX_K='jm-outbox';
function outboxAll(){try{return JSON.parse(localStorage.getItem(OUTBOX_K)||'{}')}catch(e){return{}}}
function outboxPut(key,data,base){try{const o=outboxAll();const b=o[key]?o[key].base:base;o[key]={data,base:b??null,em:new Date().toISOString()};localStorage.setItem(OUTBOX_K,JSON.stringify(o))}catch(e){}}
function outboxDel(key,data){try{const o=outboxAll();if(o[key]&&JSON.stringify(o[key].data)===JSON.stringify(data)){delete o[key];localStorage.setItem(OUTBOX_K,JSON.stringify(o))}}catch(e){}}
function outboxN(){return Object.keys(outboxAll()).length}
function avisoNaoSalvo(e){
  let b=document.getElementById('naoSalvo');const n=outboxN();
  if(!n){if(b)b.remove();return}
  if(!e&&!b)return;
  if(!b){b=document.createElement('div');b.id='naoSalvo';b.setAttribute('role','alert');b.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9999;background:#b91c1c;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:min(560px,calc(100vw - 32px));font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap';document.body.appendChild(b)}
  b.innerHTML=`<span style="flex:1;min-width:200px"><b>${n} alteração(ões) ainda NÃO foram salvas.</b> Elas estão guardadas neste navegador. Não feche esta página: clique em tentar de novo; se não der, recarregue e elas serão enviadas.${e&&e.code?' ('+esc(e.code)+')':''}</span><button type="button" style="border:0;background:#fff;color:#b91c1c;font-weight:700;padding:6px 12px;border-radius:8px;cursor:pointer" data-retry>Tentar de novo</button><button type="button" style="border:1px solid #fff;background:transparent;color:#fff;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer" data-baixa>Baixar pendentes</button>`;
  b.querySelector('[data-retry]').onclick=()=>{reenviarOutbox(true)};
  b.querySelector('[data-baixa]').onclick=()=>{const o=outboxAll(),dados={};for(const [k,x] of Object.entries(o)){const [c,i]=k.split('/');(dados[c]=dados[c]||{})[i]=x.data}
    baixar(`JM-Gestao-pendentes-${carimbo()}.json`,JSON.stringify({sistema:'JM Gestão',versao:2,geradoEm:new Date().toISOString(),pendentes:true,dados}))};
}
let _reenvio=false;
async function reenviarOutbox(forcar){
  if(store.mode!=='db'||_reenvio)return;const o=outboxAll(),ks=Object.keys(o);if(!ks.length)return;
  _reenvio=true;let ok=0,falha=null;
  const conflitos=[];
  for(const k of ks){const x=o[k];
    // se o banco já tem exatamente isso, só limpa
    if(lastJson[k]===JSON.stringify(x.data)){outboxDel(k,x.data);continue}
    // só envia se o banco ainda está como estava quando a alteração foi feita; senão, não sobrescreve
    if(x.base!==undefined&&x.base!==null&&lastJson[k]!==undefined&&lastJson[k]!==x.base){conflitos.push(k);continue}
    try{await store.db.doc(k).set(x.data);lastJson[k]=JSON.stringify(x.data);outboxDel(k,x.data);ok++;
      const [col,id]=k.split('/');const t=COLS[col];if(t){S[t][id]=JSON.parse(JSON.stringify(x.data));if(typeof MERGED!=='undefined')MERGED=new WeakSet();if(typeof mergeFin==='function')mergeFin(true)}}
    catch(e){falha=e}}
  _reenvio=false;setStatus(outboxN()?'Falha ao salvar':'Tudo salvo');avisoNaoSalvo(falha);
  if(conflitos.length){const nomes={tarefas:'tarefas',obrigacoes:'obrigações',movimentacoes:'movimentações',cadastros:'clientes',config:'configurações',financeiro:'dados financeiros'};
    toast(`Alterações pendentes em ${[...new Set(conflitos.map(k=>nomes[k.split('/')[0]]||k))].join(', ')} não foram enviadas porque os dados mudaram depois. Elas continuam guardadas; use "Baixar pendentes" no aviso.`);avisoNaoSalvo({code:'conflito'})}
  if(ok){toast(`${ok} alteração(ões) pendente(s) enviada(s) ao banco`);render()}
}
function salvar(col,id){
  bump();
  const key=col+'/'+id;
  if(store.mode!=='db'){
    /* dentro do claude.ai sem banco: não grava nada (a cópia local é antiga e sobrescreveria dados bons) */
    if(store.mode==='local'&&window.JMC&&window.JMC.use){semBanco();toast('Sem ligação com o banco: esta alteração NÃO foi salva. Recarregue a página.');return}
    saveLocal();return}
  clearTimeout(timers[key]);
  timers[key]=setTimeout(()=>{
    delete timers[key];
    const src=S[COLS[col]][id];
    if(!src){ // excluído
      lastJson[key]=null;
      chains[key]=(chains[key]||Promise.resolve()).then(()=>store.db.doc(key).delete()).catch(()=>{});return;
    }
    const data=(typeof XF!=='undefined'&&XF[key])?XF[key](src):JSON.parse(JSON.stringify(src));
    const base=lastJson[key];
    lastJson[key]=JSON.stringify(data);
    setStatus('Salvando…');
    outboxPut(key,data,base);
    const tentar=n=>store.db.doc(key).set(data).catch(e=>{if(n<4)return new Promise(r=>setTimeout(r,1500*(n+1))).then(()=>tentar(n+1));throw e});
    chains[key]=(chains[key]||Promise.resolve()).then(()=>tentar(0))
      .then(()=>{outboxDel(key,data);setStatus(outboxN()?'Salvando…':'Tudo salvo');avisoNaoSalvo()})
      .catch(e=>{setStatus('Falha ao salvar');avisoNaoSalvo(e)});
  },400);
}
async function initStore(){
  loadLocal();try{render()}catch(e){/* a tela inicial é desenhada de novo quando os dados chegam */}
  let db=null;
  try{db=window.JMC&&window.JMC.use?await window.JMC.use('db'):null}catch(e){db=null}
  if(!db){store.mode='local';setStatus('Salvando neste navegador');render();
    if(window.JMC&&window.JMC.use)semBanco();return}
  store.db=db;store.mode='db';setStatus('Sincronizado');
  const first={};
  for(const col of Object.keys(COLS)){
    const target=COLS[col];
    db.collection(col).onSnapshot(snap=>{
      let changed=!first[col];first[col]=true;
      const vistos=new Set();
      for(const d of snap.docs){
        const key=col+'/'+d.id;vistos.add(d.id);
        if(timers[key])continue;
        const j=JSON.stringify(d.data());
        if(j===lastJson[key]&&S[target][d.id])continue;
        lastJson[key]=j;S[target][d.id]=JSON.parse(j);changed=true;if(typeof HB!=='undefined')HB[key]=j;
      }
      for(const id of Object.keys(S[target])){if(!vistos.has(id)&&!timers[col+'/'+id]){delete S[target][id];changed=true;if(typeof HB!=='undefined')delete HB[col+'/'+id]}}
      try{if(typeof aposSnap==='function')aposSnap(col,changed)}catch(e){console.error(e)}
      if(changed){bump();if(!isEditing())render()}
    },e=>{console.error('db',col,e);setStatus('Conexão com os dados interrompida');conexaoCaiu(col,e)});
  }
}
function isEditing(){const a=document.activeElement;return a&&a.classList&&(a.classList.contains('cell')||a.classList.contains('search'))}

/* ================= data: movimentações ================= */
const allMovs=()=>{const out=[];for(const k in S.mov)for(const m of S.mov[k].itens||[])out.push(m);return out};
const clientes=()=>S.cad.clientes?.itens||[];
let _cm=null,_cmv=-1;
function cliMap(){if(_cmv===S.v)return _cm;_cm=new Map();for(const c of clientes()){_cm.set(normDesc(c.nome),c.id);(c.aliases||[]).forEach(a=>_cm.set(normDesc(a),c.id))}_cmv=S.v;return _cm}
function clienteDe(m){if(m.cliente_id)return m.cliente_id;if(m.tipo!=='Receita')return null;return cliMap().get(normDesc(m.descricao))||null}
const cliById=id=>clientes().find(c=>c.id===id);
const vencido=m=>m.status!=='Pago'&&m.data<todayISO;
const dCaixa=m=>m.data_pag||m.data;
/* data que conta: pago ou recebido entra na data do pagamento; pendente, no vencimento */
const dRef=m=>m.status==='Pago'?dCaixa(m):m.data;
const mfKey=m=>[m.tipo,m.data,norm(m.descricao),r2(+m.valor||0)].join('|');
let _ix=null,_ixv=-1;
function idx(){
  if(_ixv===S.v)return _ix;_ix={};
  for(const m of allMovs()){
    const dr=dRef(m),y=+dr.slice(0,4),mo=+dr.slice(5,7)-1,t=m.tipo==='Receita'?'receita':'despesa',k=m.status==='Pago'?'r':'p',v=+m.valor||0;
    const Y=_ix[y]||(_ix[y]={receita:{},despesa:{}});
    const n=Y[t][m.grupo]||(Y[t][m.grupo]={r:Z(),p:Z(),d:{}});
    n[k][mo]+=v;
    const dd=n.d[m.descricao]||(n.d[m.descricao]={r:Z(),p:Z()});dd[k][mo]+=v;
  }
  _ixv=S.v;return _ix;
}
function gruposMov(tipo){const s=new Set();for(const m of allMovs())if(m.tipo===tipo)s.add(m.grupo);return[...s].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function putMov(m){const ym=m.data.slice(0,7);const d=S.mov[ym]||(S.mov[ym]={ym,itens:[]});const i=d.itens.findIndex(x=>x.id===m.id);if(i>=0)d.itens[i]=m;else d.itens.push(m);salvar('movimentacoes',ym)}
function delMov(id){for(const ym in S.mov){const d=S.mov[ym];const i=d.itens.findIndex(x=>x.id===id);if(i>=0){d.itens.splice(i,1);if(!d.itens.length)delete S.mov[ym];salvar('movimentacoes',ym);return}}}
function findMov(id){for(const ym in S.mov){const m=S.mov[ym].itens.find(x=>x.id===id);if(m)return m}return null}

/* ================= data: orçamento ================= */
const O=ano=>S.orc[ano];
const linhas=(ano,tipo)=>(O(ano)?.linhas||[]).filter(l=>l.tipo===tipo);
function realCat(ano,tipo,cat,k){const n=idx()[ano]?.[tipo]?.[cat];return n?n[k].slice():Z()}
function realVinc(ano,tipo,vinc,k){const o=Z();for(const c of vinc||[]){const a=realCat(ano,tipo,c,k);for(let i=0;i<12;i++)o[i]+=a[i]}return o}
function catsReal(tipo){const s=new Set();for(const y in idx())for(const c in (idx()[y][tipo]||{}))s.add(c);return[...s].sort((a,b)=>a.localeCompare(b,'pt-BR'))}
function vincSet(ano,tipo){const s=new Set();linhas(ano,tipo).forEach(l=>(l.vinculos||[]).forEach(c=>s.add(c)));return s}
function foraOrc(ano,tipo){
  const vs=vincSet(ano,tipo);const out=[];
  for(const c in (idx()[ano]?.[tipo]||{})){if(vs.has(c))continue;const A=realCat(ano,tipo,c,'r'),P=realCat(ano,tipo,c,'p');if(sum(A)+sum(P)>0)out.push({id:'cat:'+c,tipo,nome:c,grupo:'Fora do orçamento',vinculos:[c],valores:Z(),fora:true})}
  return out.sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function linhasPainel(ano,tipo){
  const g=GRUPOS[tipo],gi=x=>{const i=g.indexOf(x);return i<0?99:i};
  return[...[...linhas(ano,tipo)].sort((a,b)=>gi(a.grupo)-gi(b.grupo)),...foraOrc(ano,tipo)];
}
function metr(ano,l){
  const B=l.valores||Z(),A=realVinc(ano,l.tipo,l.vinculos,'r'),P=realVinc(ano,l.tipo,l.vinculos,'p'),R=S.ref;
  const fut=i=>S.futuro==='orcado'?B[i]:S.futuro==='agendado'?P[i]:Math.max(B[i],P[i]);
  let proj=R>=0?sum(A,0,R):0;for(let i=R+1;i<12;i++)proj+=fut(i);
  return{B,A,P,bM:R>=0?B[R]:0,aM:R>=0?A[R]:0,bY:R>=0?sum(B,0,R):0,aY:R>=0?sum(A,0,R):0,bAno:sum(B),aAno:sum(A),proj,pendAtr:R>=0?sum(P,0,R):0,futV:Array.from({length:12},(_,i)=>fut(i))};
}
function totais(ano,tipo){
  const t={B:Z(),A:Z(),P:Z(),F:Z(),bM:0,aM:0,bY:0,aY:0,bAno:0,proj:0,pendAtr:0};
  for(const l of linhasPainel(ano,tipo)){const m=metr(ano,l);for(let i=0;i<12;i++){t.B[i]+=m.B[i];t.A[i]+=m.A[i];t.P[i]+=m.P[i];t.F[i]+=m.futV[i]}for(const k of['bM','aM','bY','aY','bAno','proj','pendAtr'])t[k]+=m[k]}
  return t;
}

/* saldo de caixa no fim de um dia: pelas contas bancárias com saldo informado; senão pelo saldo inicial do ano (Fluxo de caixa) mais o que foi pago e recebido */
function saldoFimDe(iso){
  /* o saldo pelas contas só vale a partir da data mais antiga em que um saldo foi informado:
     antes disso, calcular para trás dá valores que não existiram (contas que nem tinham movimento) */
  const refs=Object.values(cfgContas()).filter(c=>c&&c.saldo!=null&&c.data&&!c.auto).map(c=>c.data).sort();
  if(refs.length&&iso>=refs[0]){const sc=saldoContasEm(iso);if(sc)return{v:sc.total,fonte:'pelas contas bancárias'}}
  const saldos=cfg().saldos||{},y=+iso.slice(0,4);
  const anos=Object.keys(saldos).map(Number).filter(a=>a<=y&&saldos[a]!=null&&saldos[a]!=='').sort((a,b)=>b-a);
  const base=anos.length?{v:+saldos[anos[0]],de:anos[0]+'-01-01'}:{v:0,de:''};
  let s=base.v;for(const m of allMovs()){if(m.status!=='Pago')continue;const d=dCaixa(m);if(d>=base.de&&d<=iso)s+=fluxoPago(m)}
  return{v:r2(s),fonte:anos.length?'':'calculado pelas movimentações'};
}
/* lembrete no Painel: consulta periódica dos CNPJs na Receita */
function avisoReceita(){

}
function vDash(){
  const ano=S.ano,R=S.ref<0?0:S.ref,ym=ano+'-'+pad(R+1);
  // pago/recebido pelo mês do pagamento; pendente pelo mês do vencimento
  const s=(t,st)=>allMovs().filter(m=>m.tipo===t&&(st?(m.status==='Pago'&&dCaixa(m).startsWith(ym)):(m.status!=='Pago'&&m.data.startsWith(ym)))).reduce((a,m)=>a+(+m.valor||0),0);
  const rec=s('Receita',1),arec=s('Receita',0),pag=s('Despesa',1),apag=s('Despesa',0);
  const venc=allMovs().filter(vencido).sort((a,b)=>a.data.localeCompare(b.data));
  const vRec=venc.filter(m=>m.tipo==='Receita'),vDes=venc.filter(m=>m.tipo==='Despesa');
  const prox=allMovs().filter(m=>m.status!=='Pago'&&m.data>=todayISO&&m.data<=addDays(todayISO,15)).sort((a,b)=>a.data.localeCompare(b.data));
  const ativos=clientes().filter(c=>!ehPropria(c)&&c.status==='Ativo');
  const carteira=ativos.reduce((a,c)=>a+(+c.honorario_mensal||0),0);
  const porReg={};ativos.forEach(c=>{const r=c.regime||'Sem regime';porReg[r]=porReg[r]||{n:0,v:0};porReg[r].n++;porReg[r].v+=+c.honorario_mensal||0});
  // receita do ano por grupo (pago)
  const gy={};for(const [g,n] of Object.entries(idx()[ano]?.receita||{}))gy[g]=sum(n.r);
  const gyl=Object.entries(gy).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);const gmx=Math.max(1,...gyl.map(x=>x[1]));
  const item=m=>{const c=clienteDe(m);const dias=Math.round((new Date(todayISO)-new Date(m.data))/864e5);
    return `<li><div class="grow"><div class="t">${esc(m.descricao)}${c?'<span class="cli">cliente</span>':''}</div><div class="m">${esc(m.grupo)}, ${dBR(m.data)}${dias>0?`, ${dias} dia${dias>1?'s':''} de atraso`:''}</div></div>
      <span class="v ${m.tipo==='Receita'?'vr':'vd'}">${brl2(m.valor)}</span>${m.tipo==='Receita'&&c&&vencido(m)?waBtn(c,[m],true):''}${stBtn(m)}</li>`};
  const empty=!allMovs().length&&!clientes().length;
  return ph('Painel',`Visão geral de ${MESES_L[R]} de ${ano}`,`${refMonthSel()}${yearSel()}${empty?`<button class="btn primary" data-act="goImport">${ic('upload')}Importar do Minhas Finanças</button>`:''}`)+`
  <section class="kpis k6">
    ${(()=>{const fim=addDays(ym+'-01',-1),si=saldoFimDe(fim),mesAnt=MESES[+fim.slice(5,7)-1];
      return stat('Saldo inicial',brl(si.v),'','wallet','i',si.v<0?'neg':'')})()}
    ${stat(`Recebido em ${MESES[R]}`,brl(rec),arec>0?`${brl(arec)} ainda a receber no mês`:'nada pendente no mês','dollar','a')}
    ${stat(`Pago em ${MESES[R]}`,brl(pag),apag>0?`${brl(apag)} ainda a pagar no mês`:'nada pendente no mês','down','d')}
    ${(()=>{const si=saldoFimDe(addDays(ym+'-01',-1)).v,sf=r2(si+rec-pag);
      return stat('Saldo final',brl(sf),'','wallet','p',sf<0?'neg':'')})()}
    ${stat('Carteira de honorários',brl(carteira),`${ativos.length} clientes ativos por mês`,'clientes','i')}
    ${stat('Vencidos a receber',brl(vRec.reduce((a,m)=>a+ +m.valor,0)),`${vRec.length} lançamento${vRec.length===1?'':'s'}`,'alert','w',vRec.length?'neg':'')}
  </section>
  ${avisoReceita()}${resumoHoje()}${alertasTemporada()}
  <div class="cols">
    <div class="panel"><h3>Vencidos <small>${vRec.length?`${brl(vRec.reduce((a,m)=>a+ +m.valor,0))} a receber`:''}${vRec.length&&vDes.length?', ':''}${vDes.length?`${brl(vDes.reduce((a,m)=>a+ +m.valor,0))} a pagar`:''}</small></h3>
      ${venc.length?`<ul class="list">${venc.slice(0,12).map(item).join('')}</ul>${venc.length>12?`<p class="hint"><button class="linkbtn" data-act="verVencidos">Ver todos os ${venc.length} vencidos</button></p>`:''}`:'<p class="hint">Nenhuma conta vencida. Tudo em dia.</p>'}</div>
    <div class="panel"><h3>Próximos 15 dias</h3>
      ${prox.length?`<ul class="list">${prox.slice(0,12).map(item).join('')}</ul>`:'<p class="hint">Nada agendado para os próximos 15 dias.</p>'}</div>
  </div>
  <div class="cols">

function movFiltradas(){
  let ms;
  if(S.mStatus==='vencidos')ms=allMovs().filter(vencido);
  else ms=allMovs().filter(m=>dRef(m).startsWith(S.mym));
  if(S.mTipo!=='todos')ms=ms.filter(m=>m.tipo===S.mTipo);
  if(S.mStatus==='pagos')ms=ms.filter(m=>m.status==='Pago');
  if(S.mStatus==='pendentes')ms=ms.filter(m=>m.status!=='Pago');
  if(S.mGrupo)ms=ms.filter(m=>m.grupo===S.mGrupo);
  if(S.mConta)ms=ms.filter(m=>contaDe(m)===S.mConta);
  if(S.mBusca){const q=norm(S.mBusca);ms=ms.filter(m=>norm(m.descricao).includes(q)||norm(m.grupo).includes(q))}
  return ms.sort((a,b)=>dRef(a).localeCompare(dRef(b))||a.tipo.localeCompare(b.tipo));
}

function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date){const d=new Date(v.getTime()+12*3600e3);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  if(typeof v==='number'){const p=XLSX.SSF.parse_date_code(v);return p?p.y+'-'+pad(p.m)+'-'+pad(p.d):null}
  const s=String(v).trim();let r=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(r)return r[3]+'-'+pad(+r[2])+'-'+pad(+r[1]);
  r=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(r)return r[1]+'-'+r[2]+'-'+r[3];return null;
}
async function lerArquivo(file){
  if(!window.XLSX){toast('O leitor de planilhas não carregou. Verifique a conexão e recarregue.');return}
  const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  const hi=rows.findIndex(r=>r&&r.some(c=>norm(c)==='valor')&&r.some(c=>norm(c)==='categoria'));
  if(hi<0){toast(`"${file.name}" não parece uma exportação do Minhas Finanças (faltam as colunas VALOR e CATEGORIA).`);return}
  const H=rows[hi].map(norm);const col=f=>H.findIndex(f);
  const cD=col(h=>h==='descricao'),cV=col(h=>h==='valor'),cS=col(h=>h==='situacao'),cC=col(h=>h==='categoria'),cSub=col(h=>h==='subcategoria'),
    cVen=col(h=>h.includes('vencimento')),cPag=col(h=>h.includes('recebimento')||h==='data pagamento'),cConta=col(h=>h==='conta');
  const tipo=H.some(h=>h.includes('recebimento'))?'Receita':H.some(h=>h.includes('pagamento'))?'Despesa':/despes/i.test(file.name)?'Despesa':'Receita';
  if(cVen<0){toast(`"${file.name}" não tem a coluna DATA VENCIMENTO.`);return}
  const itens=[];let nr=0,np=0,vr=0,vp=0,ini=null,fim=null;
  for(const r of rows.slice(hi+1)){
    if(!r)continue;const data=parseDate(r[cVen]);const v=Math.abs(parseBR(r[cV]));if(!data||!v)continue;
    const status=cS>=0&&/^efetiv|^pag|^receb/.test(norm(r[cS]))?'Pago':'Pendente';
    const grupo=String(r[cC]??'Sem categoria').trim()||'Sem categoria';
    const descricao=String(r[cD]??'').trim().replace(/\s+\d+\/\d+$/,'').trim()||grupo;
    const sub=cSub>=0&&r[cSub]&&!/^outros$/i.test(String(r[cSub]).trim())?String(r[cSub]).trim():null;
    const m={id:uid('mf'),tipo,data,descricao,valor:r2(v),status,grupo,origem:'mf'};m.mfk=mfKey(m);
    if(sub)m.subgrupo=sub;
    const dp=cPag>=0?parseDate(r[cPag]):null;if(dp)m.data_pag=dp;
    if(cConta>=0&&r[cConta])m.conta=String(r[cConta]).trim();
    itens.push(m);
    if(status==='Pago'){nr++;vr+=v}else{np++;vp+=v}
    const ym=data.slice(0,7);if(!ini||ym<ini)ini=ym;if(!fim||ym>fim)fim=ym;
  }
  if(!itens.length){toast(`Nenhum lançamento com data e valor em "${file.name}".`);return}
  S.imports.push({arquivo:file.name,tipo,itens,nr,np,vr,vp,ini,fim});S.showImport=true;S.tab='mov';render();
}
function preservadosInfo(t){
  const cont=new Map();
  for(const x of allMovs())if(x.origem==='mf'&&x.editado&&x.tipo===t){const k=x.mfk||mfKey(x);cont.set(k,(cont.get(k)||0)+1)}
  for(const k of cfg().mfIgn||[])if(k.startsWith(t+'|'))cont.set(k,(cont.get(k)||0)+1e9);
  return cont;
}
function aplicarImport(i){
  const m=S.imports[i];const t=m.tipo;
  const meses=[];for(let ym=m.ini;ym<=m.fim;ym=addMonths(ym+'-01',1).slice(0,7))meses.push(ym);
  const keep=preservadosInfo(t);
  let rem=0,pul=0,add=0,dup=0;
  // cobranças geradas pelo sistema: a importação não duplica, só atualiza a baixa
  const recMap=new Map();for(const r of allMovs()){if(r.tipo!=='Receita')continue;const ok=(r.origem==='recorrente'&&r.cliente_id)||(r.origem==='mf'&&r.editado&&isHon(r.grupo));const cid=ok?(r.cliente_id||clienteDe(r)):null;if(cid)recMap.set(cid+'|'+r.data.slice(0,7)+'|'+(is13m(r)?1:0),r)}
  for(const ym of meses){
    const d=S.mov[ym]||{ym,itens:[]};
    const antes=d.itens.length;
    d.itens=d.itens.filter(x=>!(x.origem==='mf'&&x.tipo===t&&!x.editado));rem+=antes-d.itens.length;
    for(const x of m.itens){
      if(!x.data.startsWith(ym))continue;
      const k=mfKey({...x,tipo:t});const n=keep.get(k)||0;
      if(n>0){keep.set(k,n-1);pul++;continue}
      const novo={...x,tipo:t,mfk:k};
      if(t==='Receita'){const cid=cliMap().get(normDesc(x.descricao));if(cid){novo.cliente_id=cid;
        const r=recMap.get(cid+'|'+ym+'|'+(is13m(x)?1:0));
        if(r&&isHon(x.grupo)){let mud=false;if(!r.mfk){r.mfk=k;mud=true}if(x.status==='Pago'&&r.status!=='Pago'&&(!r.editado||r.origem==='mf')){r.status='Pago';r.data_pag=x.data_pag||x.data;mud=true}if(mud)salvar('movimentacoes',r.data.slice(0,7));dup++;continue}}}
      d.itens.push(novo);add++;
    }
    if(d.itens.length){S.mov[ym]=d}else delete S.mov[ym];
    salvar('movimentacoes',ym);
  }
  S.imports.splice(i,1);if(!S.imports.length)S.showImport=false;
  render();toast(`${add} ${t==='Receita'?'receitas':'despesas'} importadas${pul?`, ${pul} alteradas ou excluídas aqui foram mantidas como estão`:''}${dup?`, ${dup} honorários já gerados aqui não foram duplicados`:''}`);
}

    if(e.target.closest('[data-save]')||escB){const escopo=escB?escB.dataset.esc:null;
      const v=r2(parseBR(D.valor));
      if(!D.descricao.trim()||!v||!D.data||!D.grupo.trim()){toast('Preencha descrição, valor, vencimento e grupo');return}
      const base={...D,descricao:D.descricao.trim(),grupo:D.grupo.trim(),valor:v};
      ['subgrupo','conta','cliente_id'].forEach(k=>{if(!base[k])delete base[k];else base[k]=String(base[k]).trim()});

      if(seg.length&&!escopo){const f=dlg.querySelector('.dfoot');f.innerHTML=`<span class="hint" style="margin:0;flex:1;min-width:200px"><b>Este lançamento faz parte de uma repetição${m0.rep.tipo==='fixa'?' fixa':m0.rep.tipo==='parcelada'?' parcelada':''}.</b> Aplicar a alteração a:</span><span style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-escv>Voltar</button><button class="btn" data-esc="um">Só este mês</button><button class="btn primary" data-esc="todos">${seg.length===1?'Este e o seguinte':`Este e os ${seg.length} seguintes`}</button></span>`;f.style.flexWrap='wrap';return}
      if(m0&&!dup&&m0.origem==='mf'){base.mfk=m0.mfk||mfKey(m0);base.editado=true}
      if(m0&&!dup&&m0.data.slice(0,7)!==base.data.slice(0,7))delMov(m0.id);
      const L=novo&&R.t!=='nao'?gerarRepeticao(base,R):[base];L.forEach(putMov);
      if(escopo==='todos'){const n=aplicarSeguintes(m0,base,seg);dlg.close();render();toast(`Alteração aplicada a este e a ${n} lançamento(s) seguinte(s)`);return}
      dlg.close();render();toast(L.length>1?`${L.length} lançamentos criados${R.t==='fixa'?' (os próximos meses entram sozinhos)':''}`:'Movimentação salva');
    }
  };
  dlg.showModal();
}

function statsCliente(c,ano){
  const r=Z(),p=Z();let aberto=0,prox=null;
  for(const m of allMovs()){
    if(m.tipo!=='Receita'||clienteDe(m)!==c.id)continue;
    if(m.status!=='Pago'){if(m.data<=todayISO)aberto+=+m.valor;else if(!prox||m.data<prox)prox=m.data}
    if(!m.data.startsWith(String(ano)))continue;
    const i=+m.data.slice(5,7)-1;(m.status==='Pago'?r:p)[i]+=+m.valor;
  }
  return{r,p,aberto,prox,ano:sum(r)};
}

  <p class="hint" style="margin-top:14px">Realizado considera movimentações pagas ou recebidas, pelo mês do pagamento ou recebimento. Clique em uma linha para ver mês a mês e o detalhe por lançamento. Clique em um mês da faixa para mudar a referência.</p>`;
}
function strip(ano,rec,des){
  const R=S.ref;
  const fillR=i=>i>R?rec.P[i]:rec.A[i], fillD=i=>i>R?des.P[i]:des.A[i];
  let mx=1;for(let i=0;i<12;i++)mx=Math.max(mx,rec.B[i],des.B[i],fillR(i),fillD(i));
  const h=v=>Math.max(0,Math.min(100,v/mx*100)).toFixed(1)+'%';
  const cols=MESES.map((m,i)=>{
    const fut=i>R;const res=fut?rec.F[i]-des.F[i]:rec.A[i]-des.A[i];
    const tip=`${MESES_L[i]}: receita orçada ${brl(rec.B[i])}, ${fut?'agendada':'realizada'} ${brl(fillR(i))}; despesa orçada ${brl(des.B[i])}, ${fut?'agendada':'realizada'} ${brl(fillD(i))}`;
    return `<button class="mcol ${i===R?'cur':''} ${fut?'fut':''}" data-act="setref" data-m="${i}" title="${esc(tip)}" aria-label="${esc(tip)}">
      <span class="bars"><span class="bar rec"><span class="o" style="height:${h(rec.B[i])}"></span><span class="f" style="height:${h(fillR(i))}"></span></span>
      <span class="bar des"><span class="o" style="height:${h(des.B[i])}"></span><span class="f" style="height:${h(fillD(i))}"></span></span></span>
      <span class="mlab">${m}</span><span class="mres ${res<0?'neg':''}">${kfmt(res)}</span></button>`;
  }).join('');
  const saz=[...linhas(ano,'receita'),...linhas(ano,'despesa')].filter(l=>l.modo==='sazonal'&&sum(l.valores)>0);
  const bands=saz.map((l,k)=>{
    const v=l.valores;const f=v.findIndex(x=>x>0),t=11-[...v].reverse().findIndex(x=>x>0);
    const m=metr(ano,l);const p=m.bAno?m.aAno/m.bAno:0;const txt=`${esc(l.nome)}: ${pct(p)} de ${brl(m.bAno)}`;
    const curto=t-f<3;
    const lab=!curto?'':t<=7?`<span class="blabel" style="grid-row:${k+1};grid-column:${t+2}/13">${txt}</span>`:`<span class="blabel r" style="grid-row:${k+1};grid-column:1/${f+1}">${txt}</span>`;
    return `<button class="band ${l.tipo==='despesa'?'des':''}" style="grid-row:${k+1};grid-column:${f+1}/${t+2}" data-act="det" data-id="${esc(l.id)}" data-tipo="${l.tipo}" title="${esc(l.nome)}: ${brl(m.aAno)} de ${brl(m.bAno)}" aria-label="${txt}">
      <span class="bf" style="width:${Math.min(100,p*100)}%"></span>${curto?'':`<span>${txt}</span>`}</button>${lab}`;
  }).join('');
  return `<div class="strip-wrap"><div class="strip">
    <div class="months">${cols}</div>
    ${bands?`<div class="bands">${bands}</div>`:''}
    <div class="legend"><span><i style="border:1.5px solid var(--rec)"></i>receita orçada</span><span><i style="background:var(--rec)"></i>receita realizada</span>
    <span><i style="border:1.5px solid var(--des)"></i>despesa orçada</span><span><i style="background:var(--des)"></i>despesa realizada</span>
    <span><i style="background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 4px)"></i>meses futuros: agendado</span>
    ${bands?`<span><i style="background:var(--saz-soft)"></i>temporada de serviço sazonal, preenchida pelo que já entrou</span>`:''}</div>
  </div></div>`;
}
function kpisOrc(rec,des){
  const R=S.ref;
  if(R<0){
    return `<section class="kpis">
      ${stat('Receita orçada no ano',brl(rec.bAno),`média ${brl(rec.bAno/12)} por mês`,'dollar','a')}
      ${stat('Despesa orçada no ano',brl(des.bAno),`média ${brl(des.bAno/12)} por mês`,'down','d')}
      ${stat('Resultado orçado',brl(rec.bAno-des.bAno),`margem ${pct((rec.bAno-des.bAno)/rec.bAno)}`,'wallet','p',rec.bAno-des.bAno<0?'neg':'')}
      ${stat('Já agendado',brl(sum(rec.P)),`de receitas; ${brl(sum(des.P))} de despesas`,'target','i')}</section>`;
  }
  const dR=rec.aY-rec.bY,dD=des.aY-des.bY,resY=rec.aY-des.aY,resB=rec.bY-des.bY,proj=rec.proj-des.proj;
  const ate=`até ${MESES[R]}`;
  return `<section class="kpis">
    ${stat(`Receitas ${ate}`,brl(rec.aY),`<span class="${dR>=0?'pos':'neg'}">${dR>=0?'+':'−'}${brl(Math.abs(dR))}</span> sobre o orçado (${pct(rec.aY/rec.bY)})`,'dollar','a')}
    ${stat(`Despesas ${ate}`,brl(des.aY),`<span class="${dD<=0?'pos':'neg'}">${dD>=0?'+':'−'}${brl(Math.abs(dD))}</span> sobre o orçado (${pct(des.aY/des.bY)})`,'down','d')}
    ${stat(`Resultado ${ate}`,brl(resY),`orçado ${brl(resB)}`,'wallet','p',resY<0?'neg':'')}

function tabela(ano,tipo,tot){

  const dcell=d=>`<td class="${Math.abs(d)<0.5?'muted':fav(d)?'pos':'neg'}">${Math.abs(d)<0.5?'—':(d>0?'+':'−')+num(Math.abs(d))}</td>`;

  let rows='',grp=null;
  for(const l of ls){
    if(l.grupo!==grp){grp=l.grupo;

      rows+=`<tr class="ghead"><td>${esc(grp||'Sem grupo')}</td>${R>=0?`<td class="gl">${num(g('bM'))}</td><td>${num(g('aM'))}</td><td></td><td class="gl">${num(g('bY'))}</td><td>${num(g('aY'))}</td><td>${pct(g('aY')/g('bY'))}</td>`:''}<td class="gl">${num(g('bAno'))}</td><td>${num(g('proj'))}</td></tr>`;
    }
    const m=metr(ano,l);let sub='';
    if(l.modo==='sazonal'&&m.bAno>0){const esp=R>=0?m.bY/m.bAno:0,real=m.aAno/m.bAno;
      sub=`<div class="season"><span class="track"><span class="fill" style="width:${Math.min(100,real*100)}%"></span><span class="mark" style="left:${Math.min(100,esp*100)}%"></span></span>${pct(real)} da temporada, esperado ${pct(esp)}</div>`}
    const chip=l.fora?'<span class="chip fora">fora do orçamento</span>':l.modo==='sazonal'?'<span class="chip saz">sazonal</span>':l.modo==='carteira'?'<span class="chip info">carteira</span>':'';
    rows+=`<tr class="row" data-act="det" data-id="${esc(l.id)}" data-tipo="${tipo}" tabindex="0">
      <td><span class="lname">${esc(l.nome)}</span>${chip}${sub}</td>
      ${R>=0?`<td class="gl">${num(m.bM)}</td><td>${num(m.aM)}</td>${dcell(m.aM-m.bM)}<td class="gl">${num(m.bY)}</td><td>${num(m.aY)}</td><td class="${m.bY?(fav(m.aY-m.bY)?'pos':'neg'):'muted'}">${m.bY?pct(m.aY/m.bY):'—'}</td>`:''}
      <td class="gl">${num(m.bAno)}</td><td>${num(m.proj)}</td></tr>`;
  }
  rows+=`<tr class="total"><td>Total de ${tipo}s</td>${R>=0?`<td class="gl">${num(tot.bM)}</td><td>${num(tot.aM)}</td>${dcell(tot.aM-tot.bM)}<td class="gl">${num(tot.bY)}</td><td>${num(tot.aY)}</td><td>${pct(tot.aY/tot.bY)}</td>`:''}<td class="gl">${num(tot.bAno)}</td><td>${num(tot.proj)}</td></tr>`;
  return `<div class="tscroll"><table${R>=0?' data-mkeep="0,5,6,8"':''}><thead>
    <tr><th></th>${mhead}<th colspan="2" class="grp">Ano ${ano}</th></tr>
    <tr><th>Linha</th>${msub}<th class="grp">Orçado</th><th>Projeção</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ================= DETALHE (orçamento) ================= */
const dlg=document.getElementById('dlg');
function findLinha(ano,id,tipo){if(id.startsWith('cat:')){const c=id.slice(4);return{id,tipo,nome:c,vinculos:[c],valores:Z(),fora:true,grupo:'Fora do orçamento'}}return(O(ano)?.linhas||[]).find(l=>l.id===id)}
function openDetalhe(id,tipo){
  const ano=S.ano,l=findLinha(ano,id,tipo);if(!l)return;const m=metr(ano,l),R=S.ref;
  const mx=Math.max(1,...m.B,...m.A.map((a,i)=>a+m.P[i]));
  const W=660,H=200,padX=26,bw=(W-padX*2)/12,y=v=>H-24-(v/mx)*(H-44);
  const cor=tipo==='receita'?'rec':'des';let bars='';
  for(let i=0;i<12;i++){
    const x=padX+i*bw,w=bw*0.56,x0=x+(bw-w)/2;
    bars+=`<rect x="${x0}" y="${y(m.A[i])}" width="${w}" height="${H-24-y(m.A[i])}" fill="var(--${cor})" rx="2"/>`;
    if(m.P[i]>0)bars+=`<rect x="${x0}" y="${y(m.A[i]+m.P[i])}" width="${w}" height="${y(m.A[i])-y(m.A[i]+m.P[i])}" fill="url(#hatch)" rx="2"/>`;
    if(m.B[i]>0)bars+=`<rect x="${x+bw*0.1}" y="${y(m.B[i])}" width="${bw*0.8}" height="${H-24-y(m.B[i])}" fill="none" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 2" rx="2"/>`;
    bars+=`<text x="${x+bw/2}" y="${H-7}" text-anchor="middle" font-size="12" fill="${i===R?'var(--ink)':'var(--muted)'}" font-weight="${i===R?700:400}">${MESES[i]}</text>`;
  }
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Orçado e realizado mês a mês de ${esc(l.nome)}">
    <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="var(--${cor}-soft)"/><line x1="0" y1="0" x2="0" y2="5" stroke="var(--${cor})" stroke-width="1.5"/></pattern></defs>
    <line x1="${padX}" x2="${W-padX}" y1="${H-24}" y2="${H-24}" stroke="var(--line-strong)"/>${bars}</svg>`;
  const descs={};
  for(const c of l.vinculos||[]){const n=idx()[ano]?.[tipo]?.[c];if(!n)continue;for(const d in n.d){const t=descs[d]||(descs[d]={r:Z(),p:Z()});for(let i=0;i<12;i++){t.r[i]+=n.d[d].r[i];t.p[i]+=n.d[d].p[i]}}}
  const ref=R<0?0:R;
  const drows=Object.entries(descs).map(([d,v])=>({d,mes:v.r[ref],pm:v.p[ref],acum:sum(v.r,0,ref)})).filter(x=>x.mes||x.pm||x.acum).sort((a,b)=>(b.mes+b.pm)-(a.mes+a.pm)||b.acum-a.acum);
  dlg.innerHTML=`<div class="dhead"><div><h3>${esc(l.nome)}</h3><div class="muted" style="font-size:13px">${esc((l.vinculos||[]).join(', '))||'sem grupos vinculados'}</div></div><button class="x" data-close aria-label="Fechar">×</button></div>
  <div class="dbody">
    <div class="fgrid" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">
      <div class="fl">Orçado no ano<strong style="color:var(--ink);font-size:18px">${brl(m.bAno)}</strong></div>
      <div class="fl">Realizado no ano<strong style="color:var(--ink);font-size:18px">${brl(m.aAno)}</strong></div>
      <div class="fl">Agendado<strong style="color:var(--ink);font-size:18px">${brl(sum(m.P))}</strong></div>
    </div>
    <div class="chart">${svg}</div>
    <div class="legend"><span><i style="border:1.5px dashed var(--ink)"></i>orçado</span><span><i style="background:var(--${cor})"></i>realizado</span><span><i style="background:repeating-linear-gradient(135deg,var(--${cor}) 0 2px,transparent 2px 4px)"></i>agendado, ainda não quitado</span></div>
    <h4 style="margin:18px 0 6px">Por ${tipo==='receita'?'cliente ou serviço':'lançamento'} em ${MESES_L[ref]}</h4>
    ${drows.length?`<div class="tscroll"><table><thead><tr><th>Descrição</th><th>Realizado ${MESES[ref]}</th><th>Pendente ${MESES[ref]}</th><th>Acumulado</th></tr></thead><tbody>
      ${drows.map(x=>`<tr><td>${esc(x.d)}</td><td>${x.mes?num(x.mes):'—'}</td><td class="${x.pm?'neg':''}">${x.pm?num(x.pm):'—'}</td><td>${num(x.acum)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="hint">Sem lançamentos neste mês.</p>`}
  </div>

/* ================= LINHA editor ================= */
let D=null;
function calcD(){
  if(D.modo==='fixo'){const f=D.fixo;D.valores=Array.from({length:12},(_,i)=>{if(i<f.de||i>f.ate)return 0;let v=+f.mensal||0;if(f.reajMes>=0&&i>=f.reajMes)v*=1+(+f.reajPct||0)/100;if(f.dez13&&i===11)v*=2;return r2(v)})}
  else if(D.modo==='sazonal'){const c=D.sazonal.curva,t=sum(c)||1;D.valores=c.map(p=>r2((+D.sazonal.anual||0)*(+p||0)/t))}
}
function openLinha(id,tipo){
  const ano=S.ano;ensureOrc(ano);
  const l=id?O(ano).linhas.find(x=>x.id===id):null;
  D=l?JSON.parse(JSON.stringify(l)):{id:uid(),tipo,nome:'',grupo:GRUPOS[tipo][0],vinculos:[],modo:'fixo',valores:Z(),novo:true};
  const tot=sum(D.valores);
  D.fixo=D.fixo||{mensal:r2(tot/12)||0,de:0,ate:11,dez13:false,reajMes:-1,reajPct:0};
  D.sazonal=D.sazonal||{anual:r2(tot),curva:tot?D.valores.map(v=>r2(v/tot*100)):Z()};
  D.marks=D.sazonal.curva.map(v=>v>0);
  renderLinha();dlg.showModal();
}
function renderLinha(){
  const ano=S.ano,t=D.tipo;
  const cats=[...new Set([...catsReal(t),...D.vinculos])];
  const donos={};linhas(ano,t).forEach(l=>{if(l.id!==D.id)(l.vinculos||[]).forEach(c=>donos[c]=l.nome)});
  const presetYears=anos().filter(y=>sum(realVinc(y,t,D.vinculos,'r'))>0);
  let body='';
  if(D.modo==='fixo'){const f=D.fixo;

function onLinhaInput(e){
  const x=e.target;

  else if(x.dataset.s){D.sazonal.anual=parseBR(x.value);updPrev()}
  else if(x.dataset.c!=null){D.sazonal.curva[+x.dataset.c]=parseBR(x.value);D.marks[+x.dataset.c]=parseBR(x.value)>0;updPrev()}
  else if(x.dataset.v!=null){D.valores[+x.dataset.v]=r2(parseBR(x.value));updPrev()}
  else if(x.dataset.vinc!=null&&e.type==='change'){const c=x.dataset.vinc;D.vinculos=x.checked?[...new Set([...D.vinculos,c])]:D.vinculos.filter(v=>v!==c);if(D.modo==='sazonal')renderLinha()}

function onLinhaClick(e){
  const x=e.target;
  if(x===dlg||x.closest('[data-close]')){dlg.close();return}
  const md=x.closest('[data-modo]');if(md){calcD();const tot=sum(D.valores);D.modo=md.dataset.modo;
    if(D.modo==='sazonal'&&tot){D.sazonal={anual:r2(tot),curva:D.valores.map(v=>r2(v/tot*100))};D.marks=D.sazonal.curva.map(v=>v>0)}
    if(D.modo==='fixo'&&tot&&!D.fixo.mensal)D.fixo.mensal=r2(tot/12);
    renderLinha();return}
  const mk=x.closest('[data-mk]');if(mk){const i=+mk.dataset.mk;D.marks[i]=!D.marks[i];updPrev();return}
  const pr=x.closest('[data-preset]');if(pr){
    const p=pr.dataset.preset;
    if(p==='igual')setCurva(Array(12).fill(100/12));
    else if(p==='marcados'){const n=D.marks.filter(Boolean).length;if(!n){toast('Marque ao menos um mês clicando nas barras');return}setCurva(D.marks.map(m=>m?100/n:0))}
    else if(p==='real'){const a=realVinc(+pr.dataset.y,D.tipo,D.vinculos,'r'),t=sum(a);if(t)setCurva(a.map(v=>v/t*100))}
    return}
  if(x.closest('[data-del]')){if(confirm(`Excluir a linha "${D.nome}" do orçamento de ${S.ano}?`)){O(S.ano).linhas=O(S.ano).linhas.filter(l=>l.id!==D.id);salvar('orcamento',S.ano);dlg.close();render()}return}
  if(x.closest('[data-save]')){
    if(!D.nome.trim()){toast('Dê um nome para a linha');return}
    calcD();
    const doc=ensureOrc(S.ano);
    doc.linhas.forEach(l=>{if(l.id!==D.id&&l.tipo===D.tipo)l.vinculos=(l.vinculos||[]).filter(c=>!D.vinculos.includes(c))});
    const {novo,marks,...clean}=D;clean.nome=clean.nome.trim();

    salvar('orcamento',S.ano);dlg.close();render();toast('Linha salva');
  }
}

/* gráfico SVG genérico: barras agrupadas/empilhadas + linhas */
function chart({labels,series,height=260,cur=-1,stacked=false,fmt=kfmt,pctAxis=false}){
  const W=760,H=height,pl=54,pr=12,pt=14,pb=28,iw=W-pl-pr,ih=H-pt-pb,n=labels.length;
  const bars=series.filter(s=>s.type!=='line'),lines=series.filter(s=>s.type==='line');
  let mn=0,mx=0;
  for(let i=0;i<n;i++){
    if(stacked){let p=0,q=0;bars.forEach(s=>{const v=+s.values[i]||0;if(v>=0)p+=v;else q+=v});mx=Math.max(mx,p);mn=Math.min(mn,q)}
    else bars.forEach(s=>{const v=+s.values[i]||0;mx=Math.max(mx,v);mn=Math.min(mn,v)});
    lines.forEach(s=>{const v=s.values[i];if(v==null)return;mx=Math.max(mx,v);mn=Math.min(mn,v)});
  }
  if(mx===mn)mx=mn+1;
  const step=(()=>{const raw=(mx-mn)/4,p=Math.pow(10,Math.floor(Math.log10(raw)));const k=[1,2,2.5,5,10].find(k=>k*p>=raw)||10;return k*p})();
  mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;
  const y=v=>pt+ih-(v-mn)/(mx-mn)*ih,cw=iw/n;
  let g='';
  for(let v=mn;v<=mx+1e-9;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" ${Math.abs(v)<1e-9?'stroke-width="1.5" stroke="var(--line-strong)"':''}/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted-fg)">${pctAxis?Math.round(v)+'%':fmt(v)}</text>`}
  if(cur>=0&&cur<n)g+=`<rect x="${pl+cur*cw}" y="${pt}" width="${cw}" height="${ih}" fill="var(--primary)" opacity=".06"/>`;
  labels.forEach((l,i)=>{g+=`<text x="${pl+i*cw+cw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="${i===cur?'var(--fg)':'var(--muted-fg)'}" font-weight="${i===cur?600:400}">${esc(l)}</text>`});
  const nb=bars.length,bw=stacked?cw*.56:Math.min(22,cw*.7/Math.max(1,nb));
  for(let i=0;i<n;i++){
    let p=0,q=0;
    bars.forEach((s,k)=>{
      const v=+s.values[i]||0;if(!v)return;
      const x=stacked?pl+i*cw+(cw-bw)/2:pl+i*cw+(cw-bw*nb)/2+k*bw;
      let y0,y1;if(stacked){if(v>=0){y0=y(p);y1=y(p+v);p+=v}else{y0=y(q+v);y1=y(q);q+=v}}else{y0=y(Math.min(0,v));y1=y(Math.max(0,v))}
      const top=Math.min(y0,y1),hgt=Math.abs(y0-y1);
      const op=s.fadeFrom!=null&&i>=s.fadeFrom?'.45':'1';
      g+=`<rect x="${x+(stacked?0:1)}" y="${top}" width="${stacked?bw:bw-2}" height="${Math.max(0,hgt)}" fill="${s.color}" opacity="${op}" rx="2"/>`;
    });
  }
  lines.forEach(s=>{
    const pts=s.values.map((v,i)=>v==null?null:[pl+i*cw+cw/2,y(v)]);
    const seg=(a,b,dash)=>{const ps=pts.slice(a,b).filter(Boolean);if(ps.length<2)return'';return `<polyline points="${ps.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.2" ${dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`};
    const df=s.dashFrom??n;
    g+=seg(0,Math.min(n,df+1),false)+seg(Math.max(0,df),n,true);
    pts.forEach((p,i)=>{if(p)g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--card)" stroke="${s.color}" stroke-width="2"/>`});
  });
  labels.forEach((l,i)=>{const tip=[l,...series.map(s=>s.values[i]==null?null:`${s.name}: ${pctAxis?(Math.round(s.values[i]*10)/10+'%'):brl(s.values[i])}`).filter(Boolean)].join('\n');g+=`<rect x="${pl+i*cw}" y="${pt}" width="${cw}" height="${ih}" fill="transparent"><title>${esc(tip)}</title></rect>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))}">${g}</svg></div>
  <div class="legend">${series.map(s=>`<span><i style="background:${s.color}${s.type==='line'?';height:3px;vertical-align:3px':''}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

/* vincula lançamentos aos itens e monta a projeção mensal do serviço */
function projSvc(ano,s){
  const out={real:Z(),agend:Z(),prev:Z(),novos:Z(),total:Z(),itens:new Map(),avulsos:[]};
  const gs=new Set(s.grupos||[]);
  const movs=allMovs().filter(m=>m.tipo==='Receita'&&gs.has(m.grupo)&&dRef(m).startsWith(String(ano)));
  const byCli=new Map(),byDesc=new Map();
  (s.itens||[]).forEach(it=>{out.itens.set(it.id,{rec:0,pend:0,movs:[]});if(it.cliente_id)byCli.set(it.cliente_id,it.id);byDesc.set(normDesc(it.nome),it.id)});
  for(const m of movs){
    const i=+dRef(m).slice(5,7)-1,c=clienteDe(m);
    const iid=(c&&byCli.get(c))||byDesc.get(normDesc(m.descricao));
    if(m.status==='Pago')out.real[i]+=+m.valor;else out.agend[i]+=+m.valor;
    if(iid){const x=out.itens.get(iid);x.movs.push(m);if(m.status==='Pago')x.rec+=+m.valor;else x.pend+=+m.valor}
    else out.avulsos.push(m);
  }

function itensDosLancamentos(y,grupos,comoAFazer,f=1,excluir=new Set()){
  const gs=new Set(grupos),acc=new Map();
  for(const m of allMovs()){
    if(m.tipo!=='Receita'||!gs.has(m.grupo)||!m.data.startsWith(String(y)))continue;
    const k=clienteDe(m)||normDesc(m.descricao);if(excluir.has(k))continue;
    const i=+m.data.slice(5,7)-1;
    const x=acc.get(k)||{id:uid('i'),nome:m.descricao.replace(/\s*13\s*[°º]?$/,'').trim(),cliente_id:clienteDe(m)||undefined,valor:0,mes:i,pagos:0,n:0};
    x.valor+=+m.valor;x.n++;if(m.status==='Pago')x.pagos++;x.mes=Math.min(x.mes,i);acc.set(k,x);
  }
  return[...acc.values()].map(x=>{const it={id:x.id,nome:x.nome,valor:r2(x.valor*f),mes:x.mes,status:comoAFazer?'A fazer':(x.pagos===x.n?'Entregue':'Em andamento')};if(x.cliente_id)it.cliente_id=x.cliente_id;return it});
}

    const k=e.target.dataset.k;if(!k)return;D[k]=e.target.value;if(k==='status'&&D.status==='Entregue'&&!D.entregue_em){D.entregue_em=todayISO;const n=dlg.querySelector('[data-k=entregue_em]');if(n)n.value=todayISO}
