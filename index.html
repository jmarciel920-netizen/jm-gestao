function abrirReajuste(){
  const y=+todayISO.slice(0,4),prox=(+todayISO.slice(5,7)>=10?y+1:y)+'-01';
  const P={desde:prox<=curYM?addMonths(curYM+'-01',1).slice(0,7):prox,pct:'',arred:'1',reg:'',pend:true,fora:new Set()};
  const regs=[...new Set(clientes().map(c=>c.regime).filter(Boolean))].sort();
  const elegiveis=()=>clientes().filter(c=>!ehPropria(c)&&c.status==='Ativo'&&!semCob(perDe(c))&&(!P.reg||cliEm(c,P.desde).regime===P.reg)&&(perDe(c)==='mensal'?cliEm(c,P.desde).honorario>0:honVal(c)>0));
  const novo=v=>{const p=parseBR(String(P.pct||'0'))||0;let n=v*(1+p/100);const a=+P.arred;return a>0?Math.round(n/a)*a:r2(n)};
  const draw=()=>{
    const L=elegiveis().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));const p=parseBR(String(P.pct||'0'))||0;
    let antes=0,depois=0;
    const rows=L.map(c=>{const m=perDe(c)==='mensal',v=m?cliEm(c,P.desde).honorario:honVal(c),nv=novo(v),on=!P.fora.has(c.id);
      if(on&&m){antes+=v;depois+=nv}
      return `<tr${on?'':' style="opacity:.5"'}><td class="l"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-rcli="${esc(c.id)}"${on?' checked':''}>${esc(c.nome)}</label></td><td class="l muted">${esc(cliEm(c,P.desde).regime||'')}${m?'':`, ${perDe(c)}`}</td><td>${brl2(v)}</td><td><b>${p?brl2(nv):'—'}</b></td></tr>`}).join('');
    dlg.innerHTML=`<div class="dhead"><div><h3>Reajuste de honorários</h3><div class="muted" style="font-size:13px">Cria a mudança de honorário no histórico de cada cliente selecionado, a partir do mês escolhido</div></div><button class="x" data-close aria-label="Fechar">×</button></div>
    <div class="dbody"><div class="fgrid">
      <label>A partir de<input type="month" data-r="desde" value="${P.desde}"></label>
      <label>Reajuste (%)<input type="text" inputmode="decimal" data-r="pct" value="${esc(P.pct)}" placeholder="Ex.: 5,5 (IPCA dos últimos 12 meses)"></label>
      <label>Arredondar para<select data-r="arred">${[['0','centavos'],['1','R$ 1'],['5','R$ 5'],['10','R$ 10']].map(([v,n])=>`<option value="${v}"${P.arred===v?' selected':''}>${n}</option>`).join('')}</select></label>
      <label>Regime<select data-r="reg"><option value="">Todos</option>${regs.map(r=>`<option${r===P.reg?' selected':''}>${esc(r)}</option>`).join('')}</select></label>
      <label style="flex-direction:row;align-items:center;gap:8px;grid-column:1/-1;color:var(--fg)"><input type="checkbox" data-r="pend"${P.pend?' checked':''}> Atualizar também os honorários e 13º já lançados e pendentes a partir de ${mesAno(P.desde)}</label>
    </div>
    ${p?`<p class="hint" style="margin:12px 0 8px">Carteira mensal dos selecionados: ${brl2(antes)} → <b>${brl2(depois)}</b> (+${brl2(r2(depois-antes))} por mês).</p>`:'<p class="hint" style="margin:12px 0 8px">Informe o percentual para ver os novos valores. Desmarque quem não terá reajuste.</p>'}
    <div class="tscroll"><table><thead><tr><th class="l">Cliente (${L.length-[...P.fora].filter(id=>L.some(c=>c.id===id)).length} de ${L.length})</th><th class="l">Regime</th><th>Atual</th><th>Novo</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="l muted">Nenhum cliente com honorário neste filtro.</td></tr>'}</tbody></table></div>
    <p class="hint" style="margin-top:8px">Clientes com cobrança trimestral, semestral ou anual têm o valor do período reajustado direto no cadastro. Permuta e avulso ficam de fora.</p></div>
    <div class="dfoot"><span></span><span style="display:flex;gap:8px"><button class="btn" data-close>Cancelar</button><button class="btn primary" data-ok>Aplicar reajuste</button></span></div>`;
  };
  draw();dlg.style.width='min(900px,calc(100vw - 24px))';dlg.addEventListener('close',()=>{dlg.style.width=''},{once:true});
  dlg.oninput=e=>{const k=e.target.dataset.r;if(k==='pct'){P.pct=e.target.value}};
  dlg.onchange=e=>{const t=e.target,k=t.dataset.r;
    if(t.dataset.rcli){if(t.checked)P.fora.delete(t.dataset.rcli);else P.fora.add(t.dataset.rcli);draw();return}
    if(!k)return;P[k]=t.type==='checkbox'?t.checked:t.value;draw();if(k==='pct'){const f=dlg.querySelector('[data-r=pct]');f.focus();f.setSelectionRange(f.value.length,f.value.length)}};
  dlg.onclick=e=>{
    if(e.target===dlg||e.target.closest('[data-close]')){dlg.close();return}
    if(!e.target.closest('[data-ok]'))return;
    const p=parseBR(String(P.pct||'0'))||0;if(!p){toast('Informe o percentual do reajuste');return}
    if(!/^\d{4}-\d{2}$/.test(P.desde)){toast('Escolha o mês');return}
    const L=elegiveis().filter(c=>!P.fora.has(c.id));if(!L.length){toast('Nenhum cliente selecionado');return}
    if(!confirm(`Reajustar ${String(p).replace('.',',')}% o honorário de ${L.length} cliente(s) a partir de ${mesAno(P.desde)}?`))return;
    S._acao=`Reajuste de ${String(p).replace('.',',')}% em ${L.length} cliente(s)`;let nc=0,nm=0;
    for(const c of L){
      if(perDe(c)!=='mensal'){c.hon_valor=novo(honVal(c));nc++;continue}
      const e0=cliEm(c,P.desde),nv=novo(e0.honorario);
      if(!c.historico||!c.historico.length)c.historico=[{desde:c.desde&&c.desde<P.desde?c.desde:'2000-01',regime:c.regime,natureza:c.natureza||natPadrao(c),honorario:+c.honorario_mensal||0,treze:trezeDe(c)}];
      const base=[...c.historico].filter(x=>x.desde<=P.desde&&x.status!=='Inativo'&&x.regime).pop()||c.historico[0];
      c.historico=c.historico.filter(x=>x.desde!==P.desde);
      c.historico.push({desde:P.desde,regime:e0.regime,natureza:e0.natureza||base.natureza||'',honorario:nv,treze:!!e0.treze});
      c.historico.sort((a,b)=>a.desde.localeCompare(b.desde));
      // mudanças futuras do mesmo cliente (ex.: troca de regime já agendada) recebem o reajuste também
      for(const x of c.historico)if(x.desde>P.desde&&x.honorario!=null&&+x.honorario===+e0.honorario)x.honorario=nv;
      syncCli(c);nc++;
      if(P.pend){for(const m of pendHon(c,P.desde)){if(Math.abs((+m.valor||0)-e0.honorario)<0.01){m.valor=nv;putMov(m);nm++}}
        for(const m of pend13(c,P.desde)){if(Math.abs((+m.valor||0)-e0.honorario)<0.01){m.valor=nv;putMov(m);nm++}}}
    }
    salvar('cadastros','clientes');setCfg({reajustes:[...(cfg().reajustes||[]),{em:todayISO,desde:P.desde,pct:p,n:nc}].slice(-30)});
    dlg.close();render();toast(`Reajuste aplicado em ${nc} cliente(s) a partir de ${mesAno(P.desde)}${nm?`, ${nm} cobrança(s) pendente(s) atualizada(s)`:''}`);
  };
  if(!dlg.open)dlg.showModal();
}

const MIN_PADRAO={'das-mei':10,'dasn':30,'pgdas':30,'defis':60,'dctfweb':20,'reinf':20,'fgts':20,'piscofins':40,'irpjcsll':60,'efdcontrib':60,'ecd':240,'ecf':240,'irpf':90,'alvara':30,'anuidade-crc':10};
const minObg=id=>{const v=(cfg().obgMin||{})[id];return v!=null&&v!==''?+v:(MIN_PADRAO[id]??30)};
/* tempo gasto numa tarefa (Equipe): campo "Tempo gasto (min)" */
{const _ot=openTarefa;openTarefa=function(id,pre){_ot(id,pre);const t0=id?tarefas().find(t=>t.id===id):null;
  const ref=dlg.querySelector('label [data-k="obs"]')?.closest('label');if(!ref)return;
  ref.insertAdjacentHTML('afterend',`<label>Tempo gasto (min)<input type="number" min="0" step="5" data-k="min" value="${esc(t0?.min??'')}" placeholder="Ex.: 30" ${PODE_TAR?'':'disabled'}></label>`)}}
function rentabilidade(ini,fim){
  const R=new Map();const get=id=>{let x=R.get(id);if(!x){x={c:cliById(id),rec:0,min:0,nO:0,nT:0,tSem:0};R.set(id,x)}return x};
  for(const m of allMovs()){if(m.tipo!=='Receita'||m.status!=='Pago')continue;const cid=clienteDe(m);if(!cid)continue;const d=dCaixa(m);if(d<ini||d>fim)continue;get(cid).rec+=+m.valor||0}
  const tpl=new Map(obrTpl().map(t=>[t.id,t]));
  for(const doc of Object.values(S.obg||{}))for(const [k,f] of Object.entries(doc.feitos||{})){if(!f||!f.em||f.em<ini||f.em>fim)continue;const [cid,tid]=k.split('|');if(!cliById(cid))continue;const x=get(cid);x.min+=minObg(tid);x.nO++}
  for(const t of tarefas()){if(!t.feito_em||t.feito_em<ini||t.feito_em>fim||!t.cliente_id||!cliById(t.cliente_id))continue;const x=get(t.cliente_id);x.nT++;if(+t.min>0)x.min+=+t.min;else x.tSem++}
  return [...R.values()].filter(x=>x.c&&!ehPropria(x.c)&&(x.rec>0||x.min>0)).map(x=>({...x,rec:r2(x.rec),h:x.min/60,rh:x.min?r2(x.rec/(x.min/60)):null}));
}

  const L=rentabilidade(ini,fimP).sort((a,b)=>(a.rh??1e9)-(b.rh??1e9));
  const tRec=L.reduce((a,x)=>a+x.rec,0),tMin=L.reduce((a,x)=>a+x.min,0),recH=L.filter(x=>x.min>0).reduce((a,x)=>a+x.rec,0),media=tMin?r2(recH/(tMin/60)):0;

  <section class="kpis">${stat('Recebido dos clientes',brl2(tRec),'no período','dollar','a')}${stat('Horas de trabalho',String(Math.round(tMin/60)),'obrigações feitas e tarefas com tempo','hoje','i')}${stat('Média por hora',media?brl2(media):'—','da carteira','target','p')}</section>
  <div class="tscroll"><table><thead><tr><th class="l">Cliente</th><th>Recebido</th><th>Obrigações</th><th>Tarefas</th><th>Horas</th><th>R$ por hora</th><th class="l">Comparado à média</th></tr></thead><tbody>
  ${L.map(x=>{const rel=x.rh!=null&&media?x.rh/media:null;return `<tr data-act="editCli" data-id="${esc(x.c.id)}" tabindex="0" style="cursor:pointer"><td class="l"><span class="lname">${esc(x.c.nome)}</span></td><td>${brl2(x.rec)}</td><td>${x.nO}</td><td>${x.nT}${x.tSem?` <span class="muted" title="Tarefas concluídas sem tempo informado">(${x.tSem} sem tempo)</span>`:''}</td><td>${x.h.toFixed(1).replace('.',',')}</td>
    <td class="${rel!=null&&rel<0.6?'neg':''}"><b>${x.rh!=null?brl2(x.rh):'—'}</b></td>
    <td class="l">${rel==null?'<span class="muted">sem horas registradas</span>':`<span class="prog" style="width:110px;display:inline-block;vertical-align:middle"><span style="width:${Math.min(100,rel*50)}%;background:${rel<0.6?'var(--destructive)':rel<1?'var(--warn, #d97706)':'var(--rec)'}"></span></span> ${Math.round(rel*100)}%`}</td></tr>`}).join('')||'<tr><td colspan="7" class="l muted">Sem dados no período.</td></tr>'}
  </tbody></table></div>
  <details class="panel" style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">Tempo médio de cada obrigação (minutos)</summary>

  <p class="hint" style="margin-top:10px">Os primeiros da lista são os que menos pagam por hora: candidatos a reajuste ou a rever o escopo. Recebido considera tudo o que o cliente pagou no período (honorários, serviços e 13º).</p>`;
}

/* ================= SISTEMA ÚNICO: DADOS FINANCEIROS SEPARADOS (só o dono lê) =================
   cadastros/clientes  -> dados sem valor (a equipe lê e edita)
   financeiro/clientes -> honorários, forma de cobrança, código do Simples etc., por cliente (só o dono)
   config/geral        -> configurações sem valor; financeiro/config -> o resto (só o dono)
   As regras do banco garantem isso; a tela só esconde os menus. */
var PUB_CLI=new Set(['id','nome','cpf_cnpj','telefone','tipo_cliente','status','desde','data_inativacao','regime','natureza','obrig','aniversario','insc_municipal','insc_estadual','nire','propria','certificado_venc','sem_certificado','sst_venc','socios','funcionarios','semIE','ieOk','razao_social','situacao_rf','regime_rf','historico','email']);
var LOADED=new Set(),MERGED=new WeakSet(),_migFin=false,_finPend={cfg:null};

if(UNIF&&!EQUIPE){Object.assign(COLS,OWNER_COLS);S.fin=S.fin||{};S.usu=S.usu||{}}
if(UNIF&&EQUIPE){delete COLS.financeiro}
const finOk=()=>UNIF&&!EQUIPE&&store.mode==='db'&&LOADED.has('financeiro')&&LOADED.has('cadastros')&&LOADED.has('config');
const temPriv=c=>Object.keys(c).some(k=>!PUB_CLI.has(k))||(c.historico||[]).some(x=>x&&('honorario' in x||'treze' in x));
function pubClientes(src){
  const o={...src,itens:(src.itens||[]).map(c=>{const d={};for(const k of Object.keys(c))if(PUB_CLI.has(k)&&c[k]!==undefined)d[k]=c[k];
    if(d.historico)d.historico=d.historico.map(x=>{const y={...x};delete y.honorario;delete y.treze;return y});return d})};
  return JSON.parse(JSON.stringify(o));
}
function pubCfg(src){const o={};for(const [k,v] of Object.entries(src||{}))if(PUB_CFG.has(k)&&v!==undefined)o[k]=v;return JSON.parse(JSON.stringify(o))}
var XF={'cadastros/clientes':pubClientes};
if(UNIF)XF['config/geral']=pubCfg;
function mergeFin(force){
  if(!UNIF||EQUIPE||!LOADED.has('financeiro'))return;
  const P=(S.fin.clientes&&S.fin.clientes.porId)||{};
  for(const c of clientes()){
    if(!force&&MERGED.has(c))continue;
    const e=P[c.id];
    if(e){
      if(force)for(const k of Object.keys(c))if(!PUB_CLI.has(k))delete c[k];
      for(const [k,v] of Object.entries(e))if(k!=='_h'&&(force||c[k]===undefined))c[k]=JSON.parse(JSON.stringify(v));
      if(e._h&&c.historico)for(const x of c.historico){const h=e._h[x.desde];if(h)for(const [k,v] of Object.entries(h))if(force||x[k]===undefined)x[k]=v}
    }
    MERGED.add(c);
  }
}
function extractFin(){
  mergeFin(false);
  const P={...((S.fin.clientes&&S.fin.clientes.porId)||{})},ids=new Set();
  for(const c of clientes()){ids.add(c.id);if(!MERGED.has(c))continue;
    const e={};for(const [k,v] of Object.entries(c))if(!PUB_CLI.has(k)&&v!==undefined)e[k]=v;
    const h={};for(const x of c.historico||[]){if(!x)continue;const o={};if(x.honorario!==undefined)o.honorario=x.honorario;if(x.treze!==undefined)o.treze=x.treze;if(Object.keys(o).length)h[x.desde]=o}
    if(Object.keys(h).length)e._h=h;
    if(Object.keys(e).length)P[c.id]=JSON.parse(JSON.stringify(e));else delete P[c.id]}
  for(const id of Object.keys(P))if(!ids.has(id))delete P[id];
  S.fin.clientes={porId:P};
}
/* gravação: salvar os clientes também grava a parte financeira; idem configurações */
/* a parte financeira é gravada direto (fora do "Desfazer"): ela é sempre recalculada a partir dos clientes e das configurações */
function _salvarFin(id){if(!S.fin||!S.fin[id])return;_salvarOrig('financeiro',id)}
{const _sv=salvar;salvar=function(col,id){
  if(UNIF&&!EQUIPE){
    if(col==='financeiro'){if(!finOk()){if(id==='config')_finPend.cfg={...(_finPend.cfg||{}),...(S.fin.config||{})};return}return _salvarFin(id)}

    if(col==='config'&&id==='geral'&&finOk()){const g=S.cfg.geral||{},pri={};for(const [k,v] of Object.entries(g))if(!PUB_CFG.has(k))pri[k]=v;

{const _r=render;render=function(){try{mergeFin(false)}catch(e){}return _r.apply(this,arguments)}}
async function migrarFin(){
  if(_migFin||!finOk())return;
  /* decide pelo que está GRAVADO no banco (os clientes em memória já vêm juntados com a parte financeira) */
  const raw=k=>{try{return lastJson[k]?JSON.parse(lastJson[k]):null}catch(e){return null}};
  const rc=raw('cadastros/clientes'),rg=raw('config/geral');
  const cliPriv=!!(rc&&(rc.itens||[]).some(temPriv)),cfgPriv=!!(rg&&Object.keys(rg).some(k=>!PUB_CFG.has(k)));
  if(!cliPriv&&!cfgPriv)return;

  try{
    setStatus('Protegendo dados financeiros…');

    const g=S.cfg.geral||{},pri={...(S.fin.config||{})};for(const [k,v] of Object.entries(g))if(!PUB_CFG.has(k)&&pri[k]===undefined)pri[k]=v;

    S.cfg.geral=pubCfg(g);
    const pc=pubClientes(S.cad.clientes);lastJson['cadastros/clientes']=JSON.stringify(pc);await store.db.doc('cadastros/clientes').set(pc);
    const pg=pubCfg(S.cfg.geral);lastJson['config/geral']=JSON.stringify(pg);await store.db.doc('config/geral').set(pg);
    setStatus('Tudo salvo');toast('Dados financeiros protegidos: honorários, contas e configurações de cobrança agora ficam numa área que só você lê.');
  }catch(e){console.error(e);_migFin=false;setStatus('Falha ao proteger dados');toast('Não foi possível separar os dados financeiros agora ('+(e.code||e.message||'erro')+'). Nada foi apagado; tente recarregar.')}
}

/* ================= CÓPIAS AUTOMÁTICAS DENTRO DO SISTEMA (14 dias) ================= */
const BK_DIAS=14;
async function snapshotDB(rotulo){
  if(store.mode!=='db'||EQUIPE)return false;
  const base='backups/'+rotulo;const docs=[];
  for(const [col,t] of Object.entries(COLS))for(const [id,d] of Object.entries(S[t]||{}))if(d)docs.push([col,id,d]);
  let n=0;
  for(const [col,id,d] of docs){await store.db.doc(`${base}/docs/${col}~${id}`).set({col,id,dados:JSON.parse(JSON.stringify(d))});n++;await new Promise(r=>setTimeout(r,120))}
  await store.db.doc(base).set({em:new Date().toISOString(),rotulo,docs:n,movs:allMovs().length,clientes:clientes().length});
  return true;
}
async function listarCopias(){if(store.mode!=='db')return[];const q=await store.db.collection('backups').get();return q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.em).localeCompare(String(a.em)))}
async function apagarCopia(id){const q=await store.db.collection(`backups/${id}/docs`).get();for(const d of q.docs){await store.db.doc(`backups/${id}/docs/${d.id}`).delete();await new Promise(r=>setTimeout(r,80))}await store.db.doc('backups/'+id).delete()}
async function copiaDiaria(){
  if(!UNIF||EQUIPE||!finOk())return;
  try{
    const id='dia-'+todayISO;const ja=await store.db.doc('backups/'+id).get();if(ja.exists)return;
    await snapshotDB(id);
    const L=await listarCopias();const lim=addDays(todayISO,-BK_DIAS),limEsp=addDays(todayISO,-60);
    for(const c of L){const d=String(c.em||'').slice(0,10);if((c.id.startsWith('dia-')&&d<lim)||(!c.id.startsWith('dia-')&&d<limEsp))await apagarCopia(c.id)}
  }catch(e){console.error('cópia diária',e)}
}
async function restaurarCopia(id){
  const q=await store.db.collection(`backups/${id}/docs`).get();const dados={};
  for(const d of q.docs){const x=d.data();if(!x||!x.col)continue;(dados[x.col]=dados[x.col]||{})[x.id]=x.dados}
  if(!Object.keys(dados).length){toast('Cópia vazia');return}
  await snapshotDB('antes-da-restauracao-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'));
  aplicarDados(dados);toast('Cópia restaurada');
}
function aplicarDados(dados){
  S._acao='Restauração de cópia';

    if(!dados[col])continue;
    const novo=dados[col];const ids=new Set([...Object.keys(S[t]||{}),...Object.keys(novo)]);
    S[t]=JSON.parse(JSON.stringify(novo));
    if(col==='financeiro'||col==='cadastros'){MERGED=new WeakSet()}

  }
  if(UNIF&&!EQUIPE){mergeFin(!!dados.financeiro);if(dados.financeiro){for(const id of Object.keys(dados.financeiro))salvar('financeiro',id)}salvar('cadastros','clientes');salvar('config','geral')}

  try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000);toast('Se o download não começar, use o botão Copiar que aparece a seguir.')}catch(e){}

    dlg.onclick=e=>{if(e.target===dlg||e.target.closest('[data-close]')){dlg.close();return}if(e.target.closest('[data-cp]')){const ta=dlg.querySelector('textarea');ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('Copiado'),()=>toast('Selecione o texto e copie com Ctrl+C'));else toast(ok?'Copiado':'Selecione o texto e copie com Ctrl+C')}};
    if(!dlg.open)dlg.showModal()},800);
}

const robDasRefs=()=>Object.keys(S.rob).filter(k=>/^das_\d{4}-\d{2}$/.test(k)).map(k=>isoRef(k.slice(4))).sort((a,b)=>refIso(b).localeCompare(refIso(a)));
const robEhMei=c=>/MEI/i.test(String(c.regime||''))||/MEI/i.test(String(c.natureza||''));
function robVDas(){
  const C=robCfg(),cl=C.clientes||{},a=robAg();
  const refs=robDasRefs();const ref=S.robDasRef&&refs.includes(S.robDasRef)?S.robDasRef:(refs[0]||refAnt());
  const d=S.rob['das_'+refIso(ref)];const itens=[...(d?.itens||[])].sort((x,y)=>(x.situacao==='gerado'?1:0)-(y.situacao==='gerado'?1:0)||String(x.nome).localeCompare(String(y.nome)));
  const ger=itens.filter(x=>x.situacao==='gerado'),tot=ger.reduce((s,x)=>s+(+x.total||0),0);

function tela(html){let el=document.getElementById('jmfb');if(!el){el=document.createElement('div');el.id='jmfb';document.body.appendChild(el)}el.innerHTML='<div class="c">'+html+'</div>';return el}
function fechaTela(){const el=document.getElementById('jmfb');if(el)el.remove()}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function telaLogin(msg){
  const el=tela(`<h1>JM Gestão</h1><p>Entre com a sua conta Google para abrir o sistema.</p><button type="button" data-g>${G}Entrar com Google</button>${msg?`<div class="err">${esc(msg)}</div>`:''}`);
  el.querySelector('[data-g]').onclick=entrar;
}
async function entrar(){
  const prov=new GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
  try{await setPersistence(auth,browserLocalPersistence)}catch(e){}
  try{await signInWithPopup(auth,prov)}
  catch(e){
    const c=e&&e.code||'';
    if(/popup-blocked|operation-not-supported|web-storage/.test(c)){try{await signInWithRedirect(auth,prov);return}catch(e2){telaLogin('Não foi possível entrar ('+(e2.code||e2.message)+').');return}}
    if(/popup-closed|cancelled-popup/.test(c)){telaLogin();return}
    telaLogin('Não foi possível entrar ('+(c||e.message)+').');
  }
}
window.JM_SAIR=async()=>{try{await signOut(auth)}catch(e){}location.reload()};

getRedirectResult(auth).catch(e=>telaLogin('Não foi possível entrar ('+(e.code||e.message)+').'));

/* ---------- banco: mesma interface do banco do Claude ---------- */
const PRIV=new Set(['movimentacoes','orcamento','servicos','financeiro','sistema','backups']);
function erro(e){const n=new Error(e&&e.message||String(e));n.code=String(e&&e.code||'erro').replace(/-/g,'_');return n}
function dec(path,s){
  const x=s.data();if(!x)return undefined;
  let v;try{v=typeof x.j==='string'?JSON.parse(x.j):x}catch(e){v=x}
  if(path.startsWith('usuarios/')&&v&&typeof v==='object'&&x.papel)v.papel=x.papel; // o perfil que vale é o gravado pelo dono
  return v;
}
function mkdb(uid){
  const wrap=(path,s)=>({id:s.id,exists:s.exists(),data:()=>s.exists()?dec(path,s):undefined});
  const enc=(path,d)=>{const j=JSON.stringify(d===undefined?null:d);
    if(j.length>950000)throw Object.assign(new Error('documento grande demais ('+Math.round(j.length/1024)+' KB)'),{code:'too_large'});
    const o={j,em:serverTimestamp(),por:uid};
    if(path.startsWith('usuarios/'))o.papel=(d&&d.papel)||'pendente';
    return o};
  return{
    doc(path){const r=doc(fs,path);return{
      async get(){try{return wrap(path,await getDoc(r))}catch(e){throw erro(e)}},
      async set(d){if(/^usuarios\/u_/.test(path))return; /* acessos antigos do Claude não valem aqui */
        try{await setDoc(r,enc(path,d))}catch(e){throw erro(e)}},
      async update(p){try{const s=await getDoc(r);const cur=s.exists()?dec(path,s)||{}:{};await setDoc(r,enc(path,{...cur,...p}))}catch(e){throw erro(e)}},
      async delete(){try{await deleteDoc(r)}catch(e){throw erro(e)}}}},
    collection(path){const c=collection(fs,path);return{
      async get(){try{const q=await getDocs(c);return{docs:q.docs.map(s=>wrap(path+'/'+s.id,s)),size:q.size,empty:q.empty}}catch(e){throw erro(e)}},
      onSnapshot(cb,er){return onSnapshot(c,q=>cb({docs:q.docs.map(s=>wrap(path+'/'+s.id,s))}),e=>{er&&er(erro(e))})}}}
  };
}

/* ---------- depois de entrar ---------- */
let iniciado=false;
async function iniciar(u){
  if(iniciado)return;iniciado=true;
  const email=String(u.email||'').toLowerCase(),dono=email===DONO&&u.emailVerified!==false;
  const nome=u.displayName||email;
  tela('<h1>JM Gestão</h1><p>Abrindo…</p>');
  try{await setDoc(doc(fs,'perfis/'+u.uid),{nome,email,em:serverTimestamp()})}catch(e){}
  if(!dono){
    /* quem não é o dono só entra depois de liberado em "Usuários e acessos" */
    const ref=doc(fs,'usuarios/'+u.uid);let papel=null;
    try{const s=await getDoc(ref);if(s.exists())papel=s.data().papel;
      else{await setDoc(ref,{j:JSON.stringify({id:u.uid,papel:'pendente',menus:[],primeiroAcesso:new Date().toISOString().slice(0,10)}),papel:'pendente',em:serverTimestamp(),por:u.uid});papel='pendente'}}
    catch(e){tela(`<h1>JM Gestão</h1><p>Não foi possível verificar o seu acesso (${esc(e.code||e.message)}). Verifique a internet e recarregue.</p><button type="button" onclick="location.reload()">Recarregar</button>`);return}
    if(papel!=='adm'&&papel!=='colab'){
      const el=tela(`<h1>Acesso aguardando liberação</h1><p>Você entrou como <b>${esc(email)}</b>. Peça ao José para liberar o seu acesso em "Usuários e acessos". Esta tela abre sozinha quando for liberado.</p><button type="button" class="sec" data-s>Entrar com outra conta</button>`);
      el.querySelector('[data-s]').onclick=window.JM_SAIR;
      onSnapshot(ref,s=>{const p=s.exists()&&s.data().papel;if(p==='adm'||p==='colab')location.reload()},()=>{});
      return;
    }
  }
  const db=mkdb(u.uid);
  const user={
    async isOwner(){return dono},async canEdit(){return true},async can(){return true},async id(){return u.uid},
    async me(){return{id:u.uid,name:nome,email,isOwner:dono}},
    async profiles(ids){const o={};await Promise.all((ids||[]).map(async id=>{try{const s=await getDoc(doc(fs,'perfis/'+id));o[id]=s.exists()?{name:s.data().nome||s.data().email||''}:{name:''}}catch(e){o[id]={name:''}}}));return o},
    async search(){return[]}
  };
  const downloads={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=filename||'arquivo';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return{ok:true}}};
  window.JM_FIREBASE={email,dono,sair:window.JM_SAIR};
  window.JMC={use:async n=>n==='db'?db:n==='user'?user:n==='downloads'?downloads:null};
  fechaTela();
  const s=document.createElement('script');s.textContent=document.getElementById('jmloader').textContent;document.body.appendChild(s);
  if(dono)prepararDrive();
  /* o avatar do topo mostra quem entrou e permite sair */
  let n=0;const t=setInterval(()=>{const av=document.querySelector('.avatar');if(av||++n>60){clearInterval(t)}if(!av)return;
    av.title='Conectado como '+email+' — clique para sair';av.style.cursor='pointer';
    av.addEventListener('click',()=>{if(confirm('Sair do JM Gestão ('+email+')?'))window.JM_SAIR()})},500);
}
/* ---------- backup no Google Drive do dono (sem chave guardada: autoriza na hora, pela conta Google) ---------- */
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file',PASTA='JM Gestão – Backups do sistema',GUARDA=60;
let tok=null,tokAte=0;
try{const t=JSON.parse(sessionStorage.getItem('jm-dt')||'null');if(t&&t.ate>Date.now()){tok=t.tok;tokAte=t.ate}}catch(e){}
function aviso(html,botoes){
  let b=document.getElementById('jmdrive');if(!b){b=document.createElement('div');b.id='jmdrive';
    b.style.cssText='position:fixed;right:16px;bottom:16px;left:auto;max-width:min(420px,calc(100vw - 32px));z-index:9999;background:#1e293b;color:#fff;border-radius:12px;padding:12px 14px;font:14px/1.45 Inter,system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;flex-wrap:wrap';document.body.appendChild(b)}
  b.innerHTML='<span style="flex:1;min-width:200px">'+html+'</span>';
  for(const [txt,fn,prim] of (botoes||[['Fechar',()=>b.remove()]])){const x=document.createElement('button');x.type='button';x.textContent=txt;
    x.style.cssText='border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer;'+(prim?'background:#22c55e;color:#06210f':'background:transparent;color:#cbd5e1;border:1px solid #475569');x.onclick=fn;b.appendChild(x)}
  return b}
const fechaAviso=()=>{const b=document.getElementById('jmdrive');if(b)b.remove()};
async function pedirToken(){
  const p=new GoogleAuthProvider();p.addScope(DRIVE_SCOPE);p.setCustomParameters({login_hint:DONO});
  const {reauthenticateWithPopup}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');
  const r=await reauthenticateWithPopup(auth.currentUser,p);
  const c=GoogleAuthProvider.credentialFromResult(r);if(!c||!c.accessToken)throw new Error('o Google não liberou o acesso ao Drive');
  tok=c.accessToken;tokAte=Date.now()+50*60*1000;try{sessionStorage.setItem('jm-dt',JSON.stringify({tok,ate:tokAte}))}catch(e){}
}
async function gd(url,opt={}){
  const r=await fetch(url,{...opt,headers:{Authorization:'Bearer '+tok,...(opt.headers||{})}});
  if(r.status===401||r.status===403&&/insufficient|scope/i.test(await r.clone().text())){tok=null;try{sessionStorage.removeItem('jm-dt')}catch(e){}throw Object.assign(new Error('autorização vencida'),{code:'token'})}
  if(!r.ok)throw new Error('Drive '+r.status+': '+(await r.text()).slice(0,160));
  return r.status===204?{}:r.json()}
async function pastaId(){
  const q=encodeURIComponent(`name='${PASTA}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const l=await gd(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);
  if(l.files&&l.files.length)return l.files[0].id;
  const c=await gd('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:PASTA,mimeType:'application/vnd.google-apps.folder'})});
  return c.id}
async function enviarDrive(json){
  const pid=await pastaId();const agora=new Date(),p2=n=>String(n).padStart(2,'0');
  const nome=`JM-Gestao-backup-${agora.getFullYear()}-${p2(agora.getMonth()+1)}-${p2(agora.getDate())}_${p2(agora.getHours())}h${p2(agora.getMinutes())}.json`;
  const bd='jmb'+Date.now();
  const body=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:nome,parents:[pid],mimeType:'application/json'})}\r\n--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${json}\r\n--${bd}--`;
  const f=await gd('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,size',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body});
  /* mantém os 60 mais recentes; os mais antigos vão para a lixeira do Drive (recuperáveis) */
  try{const q=encodeURIComponent(`'${pid}' in parents and trashed=false`);
    const l=await gd(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=createdTime desc&pageSize=200&fields=files(id,name)`);
    for(const x of (l.files||[]).slice(GUARDA))await gd(`https://www.googleapis.com/drive/v3/files/${x.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({trashed:true})})}catch(e){}
  try{await setDoc(doc(fs,'sistema/drive'),{j:JSON.stringify({em:agora.toISOString(),arquivo:nome}),em:serverTimestamp()})}catch(e){}
  return nome}
let enviando=false;
window.JM_DRIVE_BACKUP=async function(){
  if(enviando)return;
  const json=window.jmBackupJSON&&window.jmBackupJSON();
  if(!json){aviso('Os dados ainda estão carregando. Tente de novo em alguns segundos.');return}
  enviando=true;
  try{
    if(!tok||Date.now()>tokAte){aviso('Autorize o acesso ao seu Google Drive na janela que abriu…',[]);await pedirToken()}
    aviso('Enviando o backup para o Google Drive…',[]);
    const nome=await enviarDrive(json);
    aviso(`Backup salvo no Google Drive, na pasta “${esc(PASTA)}”: ${esc(nome)}`);setTimeout(fechaAviso,8000);
  }catch(e){
    const c=e&&e.code||'';
    if(c==='token')aviso('A autorização do Drive venceu. Clique para autorizar de novo.',[['Autorizar e enviar',()=>window.JM_DRIVE_BACKUP(),true],['Depois',fechaAviso]]);
    else if(/popup-closed|cancelled-popup/.test(c))aviso('O backup no Drive não foi feito porque a janela foi fechada.',[['Tentar de novo',()=>window.JM_DRIVE_BACKUP(),true],['Depois',fechaAviso]]);
    else if(/popup-blocked/.test(c))aviso('O navegador bloqueou a janela de autorização. Clique no botão abaixo.',[['Autorizar e enviar',()=>window.JM_DRIVE_BACKUP(),true],['Depois',fechaAviso]]);
    else aviso('Não foi possível salvar o backup no Drive ('+esc(c||e.message)+').',[['Tentar de novo',()=>window.JM_DRIVE_BACKUP(),true],['Fechar',fechaAviso]]);
  }finally{enviando=false}
};
function prepararDrive(){
  /* uma vez por dia: se o backup do dia no Drive ainda não foi feito, oferece fazer com um clique */
  setTimeout(async()=>{
    let ult=null;try{const s=await getDoc(doc(fs,'sistema/drive'));if(s.exists())ult=JSON.parse(s.data().j).em}catch(e){}
    if(ult&&Date.now()-new Date(ult).getTime()<20*3600*1000)return;
    let n=0;while(!(window.jmBackupJSON&&window.jmBackupJSON())&&n++<30)await new Promise(r=>setTimeout(r,2000));
    if(!(window.jmBackupJSON&&window.jmBackupJSON()))return;
    if(tok&&Date.now()<tokAte){window.JM_DRIVE_BACKUP();return}
    aviso('O backup de hoje no seu Google Drive ainda não foi feito.',[['Fazer agora',()=>window.JM_DRIVE_BACKUP(),true],['Depois',fechaAviso]]);
  },6000);
}

onAuthStateChanged(auth,u=>{if(u)iniciar(u);else if(!iniciado)telaLogin()});
